<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plugins · Riffet</title>
<meta name="description" content="Plugins for Riffet.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
/* Tokens, rail and type are the homepage's (site/index.html); only --u differs, for the small lockup. */
:root {
  --paper: #f4f2ee; --raised: #faf9f6; --sunk: #eae7e1;
  --ink: #15171a; --ink-2: #3a3d42; --ink-3: #7b7d81;
  --line: color-mix(in srgb, var(--ink) 14%, transparent); --accent: #3867f0; --thread: var(--accent);
  --add: #2f6b4a; --del: #9a3b33;
  --u: 1.4px;
  --pad: max(clamp(20px, 5vw, 64px), calc((100vw - 1120px) / 2));
  --rail: calc(var(--pad) + 3.9 * var(--u));
  --gap: clamp(28px, 4vw, 48px);
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  --paper: #15171a; --raised: #1c1f23; --sunk: #101214;
  --ink: #f4f2ee; --ink-2: #c9c7c2; --ink-3: #8b8c8e;
  --line: color-mix(in srgb, var(--ink) 16%, transparent); --accent: #5b8cff;
  --add: #7fc79d; --del: #e08a80;
}
* { box-sizing: border-box; }
html { transition: background-color .35s, color .35s; background: var(--paper); color: var(--ink); font: 17px/1.6 var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; scrollbar-gutter: stable; }
body { margin: 0; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--grain, none) 0 0 / 256px; opacity: var(--grain-o, 0); pointer-events: none; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
h1, h2, h3, p, figure { margin: 0; }
code, pre, .mono { font-family: var(--mono); font-size: .82em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
[hidden] { display: none !important; }
mark { background: color-mix(in srgb, var(--thread) 20%, transparent); color: inherit; border-radius: 3px; }

nav { display: flex; align-items: flex-start; gap: 28px; padding: 22px var(--pad) 0; font-size: 14px; color: var(--ink-2); }
nav .brand { margin-right: auto; line-height: 0; }
nav .brand svg { display: block; width: calc(67.5 * var(--u)); height: calc(27.4 * var(--u)); color: var(--ink); }
nav > a:not(.brand), nav > button { margin-top: calc(12.1 * var(--u) - .8em); }
nav > a:hover, nav > button:hover { color: var(--ink); }
.word { stroke: var(--ink); fill: none; stroke-width: 2.8; stroke-linecap: round; }
.word circle { fill: var(--ink); stroke: none; }
.strand { fill: none; stroke: var(--thread); stroke-width: 2px; vector-effect: non-scaling-stroke; }

main { position: relative; padding-bottom: 96px; }
.rail { position: absolute; top: 0; left: calc(var(--rail) - 1px); width: 2px; background: color-mix(in srgb, var(--thread) 20%, transparent); pointer-events: none; }
.rail i { display: block; height: 100%; background: var(--thread); transform-origin: top; transform: scaleY(0); }
section { position: relative; padding: clamp(52px, 9vh, 88px) var(--pad) 0 calc(var(--rail) + var(--gap)); }
section.top { padding-top: clamp(34px, 6vh, 60px); }
h1, section > h2 { position: relative; }
h1 { font-size: clamp(30px, 3.4vw, 44px); line-height: 1.1; letter-spacing: -.03em; font-weight: 640; text-wrap: balance; }
section > h2 { font-size: clamp(21px, 2.2vw, 27px); line-height: 1.15; letter-spacing: -.02em; font-weight: 620; }
h1::before, section > h2::before { content: ""; position: absolute; left: calc(-1 * var(--gap) - 5.5px); top: .55em; width: 11px; height: 11px; margin-top: -5.5px; border-radius: 50%; background: var(--paper); border: 2px solid color-mix(in srgb, var(--thread) 35%, var(--paper)); transition: border-color .3s, background-color .35s; }
h1.on::before, section > h2.on::before { border-color: var(--thread); }
section > h2 + p { margin-top: 12px; max-width: 38em; color: var(--ink-2); text-wrap: pretty; font-size: 16px; }
section > h2 + p a, .prose a { border-bottom: 1px solid var(--line); }
section > h2 + p a:hover, .prose a:hover { border-color: var(--ink); color: var(--ink); }

/* ── Find ── */
.search { display: flex; align-items: center; gap: 10px; margin-top: 26px; max-width: 560px; height: 46px; padding: 0 12px 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--raised); color: var(--ink-3); transition: border-color .15s, box-shadow .15s; }
.search:focus-within { border-color: color-mix(in srgb, var(--accent) 60%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
.search svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; font-size: 16px; color: var(--ink); }
.search input::placeholder { color: var(--ink-3); }
.search input::-webkit-search-cancel-button { display: none; }
kbd { font: 11.5px var(--mono); color: var(--ink-3); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.search:focus-within kbd { visibility: hidden; }
.facets { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; margin-top: 22px; }
.kinds { display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 14.5px; color: var(--ink-2); }
.kinds button { padding: 3px 0 2px; border-bottom: 1px solid transparent; white-space: nowrap; }
.kinds button:hover { color: var(--ink); }
.kinds button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.kinds em { margin-left: 5px; font: 400 11.5px var(--mono); color: var(--ink-3); }
.reaches { margin-left: auto; display: flex; gap: 2px; }
.reaches button { display: flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 8px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.reaches button:hover { color: var(--ink); background: var(--sunk); }
.reaches button[aria-pressed="true"] { color: var(--ink); background: var(--raised); box-shadow: 0 0 0 1px var(--line); }
/* How far a package reaches into the machine: nothing runs, runs boxed in, runs as Riffet. */
.moon { flex: none; width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; }
.moon.sandbox { background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.moon.trusted { background: currentColor; }

/* ── The index: one ruled row per package ── */
.rows { margin-top: 18px; border-top: 1px solid var(--line); }
#list > .flat { padding-top: 14px; }
.row { position: relative; display: grid; grid-template-columns: 48px minmax(0, 12.5em) minmax(0, 1fr) 10em 5.8em 2.8em; gap: 0 22px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
.row:hover, .row:focus-visible { --hover: color-mix(in srgb, var(--ink) 4%, transparent); background: var(--hover); box-shadow: -14px 0 0 var(--hover), 14px 0 0 var(--hover); }
.glyph { display: block; width: 48px; height: 34px; color: var(--ink-2); fill: none; overflow: visible; }
.glyph * { vector-effect: non-scaling-stroke; }
.glyph .f { stroke: currentColor; stroke-width: 1.4; }
.glyph .d { stroke: color-mix(in srgb, var(--ink) 24%, transparent); stroke-width: 1.2; }
.glyph .s { fill: currentColor; transition: fill .15s; }
.glyph .o { stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; transition: stroke .15s; }
a:hover .glyph .s, a:focus-visible .glyph .s { fill: var(--thread); }
a:hover .glyph .o, a:focus-visible .glyph .o { stroke: var(--thread); }
.who { min-width: 0; }
.who b { display: block; font-weight: 600; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.id { display: block; font: 11.5px/1.5 var(--mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.what { font-size: 15px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kindline { font: 11.5px var(--mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reach { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.ver { font: 11.5px var(--mono); color: var(--ink-3); text-align: right; }
.empty { margin-top: 44px; color: var(--ink-2); font-size: 16px; }
.empty button { margin-left: 14px; border-bottom: 1px solid var(--line); }
.empty button:hover { border-color: var(--ink); }

/* ── Appearance is shown, not described: the workbench wearing each palette ── */
.specs { margin-top: 26px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 36px 30px; }
.spec { display: block; min-width: 0; }
.spec b { display: block; margin-top: 14px; font-weight: 600; font-size: 15.5px; }
.spec .reach { margin-top: 5px; }
.spec .reach .kindline { margin-left: 8px; }
.wb { position: relative; display: flex; aspect-ratio: 16 / 10; container-type: inline-size; overflow: hidden; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--ink) 24%, transparent); background: var(--p-bg); box-shadow: 0 14px 30px -22px color-mix(in srgb, var(--ink) 55%, transparent); transition: transform .2s; }
.spec:hover .wb { transform: translateY(-2px); }
.wb::after { content: ""; position: absolute; inset: 0; background: var(--p-grain, none) 0 0 / 128px; opacity: var(--p-grain-o, 0); pointer-events: none; }
.wb aside { flex: none; display: flex; flex-direction: column; gap: 1.1cqw; width: 27cqw; padding: 5cqw 2.4cqw 0; background: var(--p-side); border-right: 1px solid var(--p-line); }
.wb aside b { position: relative; display: block; flex: none; height: 4.6cqw; margin: 0; border-radius: 1.5cqw; }
.wb aside b::after { content: ""; position: absolute; left: 2cqw; top: 1.5cqw; width: var(--w); height: 1.6cqw; border-radius: 1cqw; background: color-mix(in srgb, var(--p-fg) 24%, transparent); }
.wb aside b.sel { background: var(--p-soft); }
.wb aside b.sel::after { background: color-mix(in srgb, var(--p-fg) 60%, transparent); }
.wb aside u { display: flex; gap: 1.7cqw; margin-top: auto; padding: 0 2cqw 4.4cqw; }
.wb aside u i { width: 2.6cqw; height: 2.6cqw; border-radius: 50%; background: var(--c); }
.wb > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2cqw; padding: 6cqw 5cqw 4cqw; }
.wb .me { align-self: flex-end; flex: none; width: 46%; height: 5.6cqw; margin-bottom: 1cqw; border-radius: 2.8cqw; background: var(--p-bubble); }
.wb .l { flex: none; height: 1.7cqw; border-radius: 1cqw; background: color-mix(in srgb, var(--p-fg) 22%, transparent); }
.wb .l.m { width: 78%; } .wb .l.s { width: 52%; }
.wb .df { flex: none; margin-top: 1cqw; border: 1px solid var(--p-line); border-radius: 1.8cqw; overflow: hidden; }
.wb .df i { display: block; height: 3.6cqw; background: var(--c); }
.wb .df i::after { content: ""; display: block; position: relative; top: 1cqw; left: 2.4cqw; width: var(--w); height: 1.6cqw; border-radius: 1cqw; background: var(--m); opacity: .7; }
.wb .box { position: relative; flex: none; margin-top: auto; height: 8.6cqw; border: 1px solid var(--p-line); border-radius: 3cqw; background: var(--p-raised); }
.wb .box::after { content: ""; position: absolute; right: 1.8cqw; top: 50%; width: 5cqw; height: 5cqw; margin-top: -2.5cqw; border-radius: 50%; background: var(--p-accent); }
.wb.icons { background: var(--raised); }
.wb.icons > span { flex: 1; display: flex; flex-wrap: wrap; align-content: center; align-items: center; justify-content: center; gap: 7cqw 8cqw; padding: 8cqw 14cqw; }
.wb.icons svg { width: 9cqw; height: 9cqw; color: var(--ink); }

/* ── One package ── */
.back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 22px; font-size: 14px; color: var(--ink-2); }
.back:hover { color: var(--ink); }
.back svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.by { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; font-size: 15px; color: var(--ink-2); }
.by .mono { color: var(--ink-3); }
.lede { margin-top: 18px; max-width: 34em; text-wrap: pretty; color: var(--ink-2); }
.get { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-top: 28px; }
.btn { display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 10px; background: var(--ink); color: var(--paper); font-size: 15px; font-weight: 560; white-space: nowrap; }
.btn:hover { background: var(--ink-2); }
.cmd { display: inline-flex; align-items: center; gap: 14px; max-width: 100%; padding: 11px 12px 11px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); font: 14px var(--mono); }
.cmd > span { overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
.cmd .p, .cmd .o { color: var(--ink-3); } .cmd .p { user-select: none; } .cmd .o { white-space: nowrap; }
.cmd button { display: grid; place-items: center; flex: none; width: 26px; height: 26px; border-radius: 6px; color: var(--ink-3); }
.cmd button:hover { color: var(--ink); background: var(--sunk); }
.cmd svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ships { margin-top: 26px; font-size: 14.5px; color: var(--ink-2); }
.links { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 14px; color: var(--ink-2); }
.links a { border-bottom: 1px solid var(--line); }
.links a:hover { color: var(--ink); border-color: var(--ink); }
.facts { display: flex; flex-wrap: wrap; gap: 6px 30px; margin-top: 22px; font: 13px var(--mono); color: var(--ink-2); }

/* Where it plugs in: the strand leaves the rail and enters the workbench at the slots this package fills. */
.fits { position: relative; display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 30px clamp(28px, 5vw, 64px); align-items: start; margin-top: 30px; }
.fits.wide { grid-template-columns: minmax(0, 1fr); gap: 0; }
.plug { position: absolute; left: calc(-1 * var(--gap) - 1px); top: -26px; width: calc(var(--gap) + 1px); height: 96px; border: solid color-mix(in srgb, var(--thread) 20%, var(--paper)); border-width: 0 0 2px 2px; border-radius: 0 0 0 22px; pointer-events: none; transition: border-color .3s; }
.plug::after { content: ""; position: absolute; right: -4px; bottom: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--thread); opacity: .25; transition: opacity .3s; }
h2.on ~ .fits .plug { border-color: var(--thread); } h2.on ~ .fits .plug::after { opacity: 1; }
.map svg { display: block; width: 100%; height: auto; overflow: visible; fill: none; }
.map .f { fill: var(--raised); stroke: color-mix(in srgb, var(--ink) 26%, transparent); }
.map .nv { fill: color-mix(in srgb, var(--ink) 5%, transparent); }
.map .ln { stroke: var(--line); }
.map .sk, .map .bar { fill: color-mix(in srgb, var(--ink) 16%, transparent); }
.map .sk.q { fill: color-mix(in srgb, var(--ink) 8%, transparent); }
.map .box { fill: var(--raised); stroke: var(--line); }
.map .ic { stroke: color-mix(in srgb, var(--ink) 30%, transparent); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.map .slot { transition: opacity .2s; }
.map .slot .hl { fill: none; }
.map .slot.on .hl { fill: color-mix(in srgb, var(--thread) 15%, transparent); }
.map .slot.on .bar { fill: var(--thread); }
.map .slot.on .sk { fill: color-mix(in srgb, var(--thread) 42%, transparent); }
.map .slot.on .ic { stroke: var(--thread); }
.map .slot.on .box { stroke: var(--thread); stroke-width: 1.4; }
.map .slot.only:not(.on) { display: none; }
.map.dim .slot.on:not(.hot) { opacity: .28; }
.looks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; max-width: 760px; }
.looks figcaption { margin-top: 10px; font: 12px var(--mono); color: var(--ink-3); }
.try { display: flex; align-items: center; gap: 6px; margin-top: 20px; }
.try button { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 8px; font-size: 14px; color: var(--ink-2); box-shadow: 0 0 0 1px var(--line); }
.try button:hover { color: var(--ink); background: var(--sunk); }
.try button[aria-pressed="true"] { color: var(--paper); background: var(--ink); box-shadow: none; }
.try .mode { width: 32px; padding: 0; justify-content: center; box-shadow: none; }
.try svg { width: 17px; height: 17px; }

.ledger { display: grid; border-top: 1px solid var(--line); }
.ledger > div { display: grid; grid-template-columns: subgrid; grid-column: 1 / -1; gap: 4px 22px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ledger em { font: 400 11.5px var(--mono); color: var(--ink-3); white-space: nowrap; }
.ledger b { font-weight: 600; font-size: 15.5px; }
.ledger span { font-size: 15px; color: var(--ink-2); min-width: 0; }
.contrib { grid-template-columns: max-content minmax(0, 1fr) max-content; }
.contrib > div { transition: opacity .2s; cursor: default; }
.contrib .w { display: inline-block; margin-left: 14px; font-size: 14.5px; }
.contrib .mono { font-size: 12px; color: var(--ink-2); }
.swatches { display: grid; gap: 5px; margin-top: 10px; }
.swatches div { display: flex; align-items: center; }
.swatches em { width: 4em; }
.swatches i { width: 18px; height: 18px; background: var(--c); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 12%, transparent); }
.swatches i:first-of-type { border-radius: 5px 0 0 5px; } .swatches i:last-of-type { border-radius: 0 5px 5px 0; }
.swatches i.g { margin-left: 8px; border-radius: 5px 0 0 5px; }
.ledger .type { display: block; margin-top: 8px; font-size: 26px; line-height: 1.25; letter-spacing: -.01em; color: var(--ink); }
.tile { display: block; width: 132px; height: 60px; margin-top: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); position: relative; overflow: hidden; }
.tile::after { content: ""; position: absolute; inset: 0; background: var(--img) 0 0 / 128px; opacity: var(--o, 1); }
.faces { grid-column: 2 / -1; align-self: start; display: grid; grid-template-columns: repeat(auto-fill, 76px); gap: 18px 14px; }
.faces figure { text-align: center; }
.faces span { display: block; width: 56px; height: 56px; margin: 0 auto; border-radius: 14px; overflow: hidden; background: var(--sunk); }
.faces svg { display: block; width: 100%; height: 100%; }
.faces figcaption { margin-top: 6px; font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.says { display: flex; gap: 10px; align-items: baseline; margin-top: 14px; max-width: 40em; color: var(--ink-2); font-size: 16px; text-wrap: pretty; }
.says .moon { position: relative; top: -1px; color: var(--ink); }
.says b { color: var(--ink); font-weight: 600; white-space: nowrap; }
.caps { margin-top: 22px; grid-template-columns: max-content minmax(0, 1fr); }
.caps b { font: 500 13px var(--mono); }
.note { margin-top: 14px; font-size: 14.5px; color: var(--ink-2); }
.sets { margin-top: 22px; grid-template-columns: max-content max-content minmax(0, 1fr); }
.vers { margin-top: 22px; grid-template-columns: max-content max-content max-content max-content minmax(0, 1fr) max-content; }
.vers span, .sets .mono { font: 12px var(--mono); color: var(--ink-2); }
.vers span.h { color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vers a { font-size: 14px; color: var(--ink-2); border-bottom: 1px solid var(--line); }
.vers a:hover { color: var(--ink); border-color: var(--ink); }
.prose { margin-top: 18px; max-width: 42em; font-size: 15.5px; color: var(--ink-2); overflow-wrap: break-word; }
.prose > * { margin: 12px 0 0; }
.prose h2, .prose h3, .prose h4 { margin-top: 24px; font-size: 16px; font-weight: 600; color: var(--ink); letter-spacing: 0; }
.prose ul, .prose ol { padding-left: 1.25em; } .prose li + li { margin-top: 6px; }
.prose code { padding: 1px 5px; border-radius: 5px; background: color-mix(in srgb, var(--ink) 7%, transparent); font-size: .84em; }
.prose pre { padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); overflow-x: auto; font-size: 13px; line-height: 1.7; }
.prose pre code { padding: 0; background: none; font-size: inherit; }
.prose table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.prose th, .prose td { padding: 8px 14px 8px 0; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
.prose th { font: 400 12px var(--mono); color: var(--ink-3); }

/* ── The end of the line ── */
pre.start { margin: 24px 0 0; width: fit-content; max-width: 100%; padding: 16px 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--raised); font: 14px/1.9 var(--mono); overflow-x: auto; }
pre.start .p { color: var(--ink-3); }
.end { padding-top: clamp(36px, 6vh, 60px); }
.finish { display: flex; align-items: flex-start; margin: 0 0 0 calc(-1 * var(--gap) - 1px); height: 84px; transition: opacity .3s; }

    </section>
    <section><h2>${t('access')}</h2>${access(p)}</section>
    ${m.settings?.length ? `<section><h2>${t('settings')}</h2><div class="ledger sets">${m.settings.map((s) => `<div><b>${esc(loc(s.label, s.key))}</b><span class="mono">${esc(s.key)}</span><span>${s.kind === 'secret' ? t('secret') : ''}</span></div>`).join('')}</div></section>` : ''}
    ${p.readmeHtml ? `<section><h2>${t('readme')}</h2><div class="prose">${p.readmeHtml}</div></section>` : ''}
    <section><h2>${t('versions')}</h2><div class="ledger vers">${p.versions.map((one) => `<div><b>${esc(one.version)}</b><span>${esc(one.date)}</span><span>${esc(api)}</span><span>${one.size ? size(one.size) : ''}</span><span class="h" title="${esc(one.integrity ?? '')}">${one.integrity ? `sha256 ${esc(one.integrity.replace(/^sha256-/, '').slice(0, 12))}…${esc(one.integrity.slice(-6))}` : ''}</span>${one.archive ? `<a href="${esc(new URL(one.archive, location.href))}">${t('download')}</a>` : '<span></span>'}</div>`).join('')}</div></section>`;
  for (const sample of document.querySelectorAll('[data-font]')) {
    const font = p.a.fonts.find((one) => one.id === sample.dataset.font);
    face({ family: font.family, url: p.assets[font.id] }).then((family) => { sample.style.fontFamily = `"${family}", ${font.fallback?.join(', ') ?? 'sans-serif'}`; });
  }
}
const detail = document.getElementById('detail');
detail.addEventListener('click', (event) => {
  if (event.target.closest('#wear')) { wear(wearing ? null : byId.get(current).look); event.target.closest('#wear').setAttribute('aria-pressed', Boolean(wearing)); }
  if (event.target.closest('#mode')) { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; if (wearing) wear(wearing); renderDetail(byId.get(current)); layout(); }
});
// Pointing at a contribution shows which slot of the workbench it fills.
const point = (event, enter) => {
  const line = event.target.closest?.('.contrib > [data-slot]'), map = detail.querySelector('.map');
  if (!line || !map || line.contains(event.relatedTarget)) return;
  map.classList.toggle('dim', enter);
  for (const slot of map.querySelectorAll('.slot')) slot.classList.toggle('hot', enter && line.dataset.slot.split(' ').includes(slot.dataset.slot));
};
detail.addEventListener('mouseover', (event) => point(event, true));
detail.addEventListener('mouseout', (event) => point(event, false));

document.addEventListener('click', (event) => {
  const button = event.target.closest('[data-copy]'); if (!button) return;
  navigator.clipboard?.writeText(button.dataset.copy);
  button.innerHTML = ICON.done; setTimeout(() => { button.innerHTML = ICON.copy; }, 1400);
  if (!reduced) brand.animate([{ transform: 'none' }, { transform: 'translateY(-5px) rotate(-3deg)', offset: 0.4 }, { transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.2,.8,.3,1)' });
});

/* ── The rail: from the lockup's strand to the last horse, written as the reader scrolls ── */
const main = document.querySelector('main'), rail = document.querySelector('.rail'), ink = rail.firstElementChild, finish = document.querySelector('.finish');
let railHeight = 0;
function layout() {
  railHeight = finish.getBoundingClientRect().top - main.getBoundingClientRect().top;
  rail.style.height = `${railHeight}px`;
  write();
}
function write() {
  // On a page shorter than the window the line is simply complete.
  const room = root.scrollHeight - innerHeight, share = room <= 0 ? 1 : 0.62 + 0.38 * Math.min(1, scrollY / room);
  const done = Math.max(0, Math.min(1, (scrollY + innerHeight * share - main.offsetTop) / railHeight));
  ink.style.transform = `scaleY(${done})`;
  const tip = main.offsetTop + done * railHeight;
  for (const head of document.querySelectorAll('h1, section > h2')) head.classList.toggle('on', head.getBoundingClientRect().top + scrollY + 12 <= tip);
  finish.style.opacity = done >= 1 ? 1 : 0.2;
}
new ResizeObserver(layout).observe(main);
addEventListener('scroll', write, { passive: true });

/* ── Routes: #/ is the index (with its filters), #/<id> one package ── */
let current = '', indexScroll = 0;
function route() {
  const [path, query = ''] = location.hash.replace(/^#\/?/, '').split('?');
  const p = byId.get(decodeURIComponent(path));
  if (!p && current) wear(null);
  if (p) {
    if (!current) indexScroll = scrollY;
    if (wearing && current !== p.id) wear(null);
    current = p.id;
    renderDetail(p);
    document.title = `${title(p)} · Riffet`;
  } else {
    const params = new URLSearchParams(query);
    if (!current) { state.q = params.get('q') ?? state.q; state.kind = KINDS.includes(params.get('kind')) ? params.get('kind') : state.kind; state.reach = REACHES.includes(params.get('reach')) ? params.get('reach') : state.reach; }
    input.value = state.q;
    renderFacets(); renderList(); remember();
    document.title = `${t('plugins')} · Riffet`;
  }
  document.getElementById('index').hidden = Boolean(p);
  detail.hidden = !p;
  const back = !p && current;
  if (!p) current = '';
  layout();
  scrollTo(0, back ? indexScroll : 0);
}
addEventListener('hashchange', route);

addEventListener('keydown', (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const typing = document.activeElement === input;
  if (event.key === '/' && !typing && !current) { event.preventDefault(); input.focus(); input.select(); }
  else if (event.key === 'Escape' && current) location.hash = '#/';
  else if (event.key === 'Escape' && typing) { if (input.value) { input.value = ''; state.q = ''; renderList(); remember(); } else input.blur(); }
  else if ((event.key === 'ArrowDown' || event.key === 'ArrowUp') && !current) {
    const items = [...document.querySelectorAll('#list a')], at = items.indexOf(document.activeElement);
    if (!typing && at < 0) return;
    event.preventDefault();
    const next = event.key === 'ArrowDown' ? items[at + 1] : at <= 0 ? input : items[at - 1];
    next?.focus();
  }
});

/* ── Language ── */
const langButton = document.getElementById('lang');
function setLang(next) {
  lang = next; root.lang = lang;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-h]').forEach((el) => { el.innerHTML = t(el.dataset.h); });
  input.placeholder = t('search'); input.setAttribute('aria-label', t('search'));
  langButton.textContent = lang === 'zh' ? 'English' : '中文';
  route();
}
langButton.onclick = () => { const y = scrollY; setLang(lang === 'zh' ? 'en' : 'zh'); scrollTo(0, y); };
setLang(lang);
</script>
</body>
