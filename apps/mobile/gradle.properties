org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
# The Kotlin/Compose plugin combination used here is not configuration-cache clean yet;
# enabling it is a P4 concern, not a P0 one.
org.gradle.configuration-cache=false

kotlin.code.style=official
# `contracts` and `core` are commonMain-only; this keeps a stray platform import obvious.
kotlin.mpp.enableCInteropCommonization=true
# Don't try to download a Kotlin/Native toolchain on a machine that only runs the JVM tests.
kotlin.native.ignoreDisabledTargets=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
