name: Riffet
options:
  bundleIdPrefix: io.github.riffable
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MARKETING_VERSION: 0.10.0
    CURRENT_PROJECT_VERSION: 26112201
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SUPPORTS_MACCATALYST: NO
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.3
  Markdown:
    url: https://github.com/apple/swift-markdown
    exactVersion: 0.9.0
targets:
  Riffet:
    type: application
    platform: iOS
    sources:
      - Riffet
      - RiffetWidgets/RiffetSummaryAttributes.swift
      - ../../macos/Riffet/Bridge/Flows.swift
      - ../../macos/Riffet/Bridge/TerminalOutputInbox.swift
      - ../../macos/Riffet/Features/Transcript/MarkdownModel.swift
      - ../../macos/Riffet/Features/Transcript/MathText.swift
      - ../../macos/Riffet/Features/Transcript/Footnotes.swift
      - ../../macos/Riffet/Features/Transcript/BareURLs.swift
      - ../../macos/Riffet/Features/Transcript/MarkdownSource.swift
      - ../../macos/Riffet/Features/Transcript/UnderscoreEmphasis.swift
      - ../../macos/Riffet/Features/Transcript/TextLayout.swift
      - path: ../../macos/Riffet/Resources/highlight.js
        type: file
        buildPhase: resources
      # The full texts of the Swift packages this app links.
      - path: ../../macos/Riffet/Resources/Licenses
        type: folder
        buildPhase: resources
    info:
      path: Riffet/Resources/Info.plist
      properties:
        CFBundleDisplayName: Riffet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # iPad takes part in Split View, Slide Over and Stage Manager only with all four.
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: 扫描 Mac 上的配对二维码以连接 Riffet。
        NSLocalNetworkUsageDescription: 发现并连接同一网络中的 Riffet 服务。
        NSMicrophoneUsageDescription: 把语音转成文字输入到消息里。
        NSBonjourServices: [_riffet._tcp]
        NSFaceIDUsageDescription: 在你选择启用时，验证本人后提交操作确认。
        NSSupportsLiveActivities: YES
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: YES
        CFBundleURLTypes:
          - CFBundleURLName: io.github.riffable.iphone
            CFBundleURLSchemes: [riffet]
    dependencies:
      - package: SwiftTerm
      - package: Markdown
      - target: RiffetWidgets
    preBuildScripts:
      - name: Build RiffetKit
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home)}"
          cd "$SRCROOT/.."
          ./gradlew :client:embedAndSignAppleFrameworkForXcode --console=plain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.riffable.iphone
        PRODUCT_NAME: Riffet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-purple AppIcon-magenta AppIcon-pink AppIcon-red AppIcon-orange AppIcon-yellow AppIcon-lime AppIcon-green AppIcon-cyan AppIcon-graphite AppIcon-white"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Riffet/Resources/Riffet.entitlements
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../client/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - RiffetKit
          - -lsqlite3
          # The main thread gets 8 MB, as on macOS and in the simulator, instead of iOS's 1 MB: SwiftUI
          # resolves a page's whole view type and builds its body on this thread, and iOS 27 overflows
          # 1 MB on long pages. ios.md §2.0 has the rules that keep pages within it regardless.
          - -Wl,-stack_size,0x800000
        # -stack_size only links into a main executable; the debug dylib would carry the app's code instead.
        ENABLE_DEBUG_DYLIB: NO
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Riffet/Resources/Riffet-Release.entitlements
  # The summary Live Activity; it draws pushed counts only and shares no data with the app.
  RiffetWidgets:
    type: app-extension
    platform: iOS
    sources: [RiffetWidgets]
    info:
      path: RiffetWidgets/Info.plist
      properties:
        CFBundleDisplayName: Riffet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.riffable.iphone.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  RiffetTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RiffetTests]
    dependencies:
      - target: Riffet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.riffable.iphone.tests
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../client/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
schemes:
  Riffet:
    build:
      targets:
        Riffet: all
    test:
      targets: [RiffetTests]
