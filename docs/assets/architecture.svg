<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" fill="none" role="img" aria-labelledby="t d">
<title id="t">How Riffet fits together</title>
<desc id="d">Web, macOS, iPhone and Android clients and a Feishu or Lark bot connect to a Riffet server running on your own machine. The server drives the agent CLIs installed there — cursor-agent, claude, codex, dsh, droid, traex and pi — against your repositories, using your existing logins.</desc>
