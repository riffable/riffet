<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 664" width="1200" height="664" role="img" aria-label="Riffet extension" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, 'Segoe UI', sans-serif">
<style>.m{font-family:ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace}</style>
<rect width="1200" height="664" fill="#ffffff"/>
<g transform="translate(22 19) scale(0.92)"><path d="M8.77 6.2Q6.51 6.56 5.15 8.55L7.76 8.17Q5.43 9.17 4.26 11.65L6.94 10.68Q4.72 12.24 3.82 15.1L6.42 13.42Z" fill="#3867f0" stroke="#3867f0" stroke-width="0.6" stroke-linejoin="round"/><path d="M6 21C5.6 14.4 6.6 9 8.8 5.8L9.4 2.6L11.2 5.4C14.4 6.6 17.4 8.4 20 10.8c1.3 1.2 0.7 3.4 -1 3.4c-1.4 0 -3 -0.3 -4.4 -0.6c-1.4 -0.3 -2.3 0.3 -2.4 1.6c-0.1 2 0.2 4 0.8 5.8ZM11.5 8.2a1 1 0 1 0 2 0a1 1 0 1 0 -2 0Z" fill="#15171a" fill-rule="evenodd"/><path d="M6 21C5.6 14.4 6.6 9 8.8 5.8L9.4 2.6L11.2 5.4C14.4 6.6 17.4 8.4 20 10.8c1.3 1.2 0.7 3.4 -1 3.4c-1.4 0 -3 -0.3 -4.4 -0.6c-1.4 -0.3 -2.3 0.3 -2.4 1.6c-0.1 2 0.2 4 0.8 5.8Z" fill="none" stroke="#15171a" stroke-width="1" stroke-linejoin="round"/></g>
<text x="50" y="37" font-size="14" fill="#15171a"><tspan font-weight="600">Riffet</tspan><tspan dx="8" fill="#4c5158">Extension</tspan></text>
<text x="1176" y="37" font-size="10" font-weight="400" fill="#6e737b" text-anchor="end" class="m">fig. 5 · subsystem · riffet 0.7.0 · Node.js ≥ 24.19</text>
<path d="M24 54L1176 54" stroke="rgb(21 23 26 / 0.14)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<rect x="24" y="72" width="280" height="190" rx="7" fill="#ffffff" stroke="rgb(21 23 26 / 0.14)" stroke-width="1"/>
<text x="36" y="93" font-size="12.5" font-weight="600" fill="#15171a" text-anchor="start">Plugin</text>
<rect x="85.4" y="82" width="22" height="14" rx="7" fill="none" stroke="#3867f0" stroke-width="1"/>
<text x="96.4" y="92.5" font-size="9" font-weight="600" fill="#3867f0" text-anchor="middle" class="m">P7</text>
<text x="292" y="93" font-size="9.5" font-weight="400" fill="#6e737b" text-anchor="end" class="m">@riffet/plugin-api</text>
<text x="36" y="116" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m">manifest</text>
<text x="36" y="129" font-size="10" font-weight="400" fill="#6e737b" text-anchor="start">id, apiVersion, settings, contributes</text>
<text x="36" y="146" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m">detect()</text>
<text x="36" y="159" font-size="10" font-weight="400" fill="#6e737b" text-anchor="start">optional availability probe</text>
<text x="36" y="176" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m">activate()</text>
<text x="36" y="189" font-size="10" font-weight="400" fill="#6e737b" text-anchor="start">returns its contributions</text>
<text x="36" y="220" font-size="10" font-weight="400" fill="#4c5158" text-anchor="start" class="m">PLUGIN_API_VERSION 1</text>
<text x="36" y="234" font-size="10" font-weight="400" fill="#6e737b" text-anchor="start">additive changes only</text>
<rect x="368" y="72" width="400" height="190" rx="7" fill="#ffffff" stroke="rgb(21 23 26 / 0.14)" stroke-width="1"/>
<text x="380" y="93" font-size="12.5" font-weight="600" fill="#15171a" text-anchor="start">Plugin host</text>
<text x="756" y="93" font-size="9.5" font-weight="400" fill="#6e737b" text-anchor="end" class="m">plugins-host/ · plugins/</text>
<text x="380" y="110" font-size="10.5" font-weight="400" fill="#4c5158" text-anchor="start">Registry and lifecycle: discover, enable, activate, deactivate.</text>
<text x="380" y="124" font-size="10.5" font-weight="400" fill="#4c5158" text-anchor="start">Trust is recorded by the host; a package cannot assert it.</text>
<text x="380" y="138" font-size="10.5" font-weight="400" fill="#4c5158" text-anchor="start">Sources: plugin index, local package, development directory.</text>
<text x="380" y="176" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m">PluginHost</text>
<text x="380" y="190" font-size="10" font-weight="400" fill="#6e737b" text-anchor="start">the only way a plugin reaches the server:</text>
<text x="380" y="206" font-size="10" font-weight="400" fill="#4c5158" text-anchor="start" class="m">child process · CLI lookup · model catalog</text>
<text x="380" y="220" font-size="10" font-weight="400" fill="#4c5158" text-anchor="start" class="m">private state directory · secrets</text>
<rect x="832" y="72" width="344" height="190" rx="7" fill="#ffffff" stroke="rgb(21 23 26 / 0.14)" stroke-width="1"/>
<text x="844" y="93" font-size="12.5" font-weight="600" fill="#15171a" text-anchor="start">Execution</text>
<text x="1164" y="93" font-size="9.5" font-weight="400" fill="#6e737b" text-anchor="end" class="m">process.ts · sandbox.ts</text>
<rect x="844" y="104" width="320" height="50" rx="5" fill="#f4f2ee" stroke="none" stroke-width="1"/>
<text x="853" y="126.5" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m"></text>
<text x="853" y="139.5" font-size="9.5" font-weight="400" fill="#6e737b" text-anchor="start"></text>
<text x="854" y="123" font-size="11.5" font-weight="600" fill="#15171a" text-anchor="start">In process</text>
<text x="854" y="140" font-size="10" font-weight="400" fill="#4c5158" text-anchor="start">built-in, development and explicitly trusted packages</text>
<rect x="844" y="162" width="320" height="88" rx="5" fill="#f4f2ee" stroke="none" stroke-width="1"/>
<text x="853" y="203.5" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m"></text>
<text x="853" y="216.5" font-size="9.5" font-weight="400" fill="#6e737b" text-anchor="start"></text>
<text x="854" y="181" font-size="11.5" font-weight="600" fill="#15171a" text-anchor="start">Isolated process</text>
<text x="854" y="198" font-size="10" font-weight="400" fill="#4c5158" text-anchor="start">installed packages, by default</text>
<text x="854" y="212" font-size="10" font-weight="400" fill="#4c5158" text-anchor="start">Node permission model inside a macOS Seatbelt sandbox</text>
<text x="854" y="226" font-size="10" font-weight="400" fill="#4c5158" text-anchor="start">JSON lines on stdio, protocol 1</text>
<text x="854" y="240" font-size="10" font-weight="400" fill="#4c5158" text-anchor="start">no OS sandbox: refused unless the operator opts in</text>
<path d="M304 167L368 167" stroke="#4c5158" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M363 163.5L368 167L363 170.5" stroke="#4c5158" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="336" y="160" font-size="10" font-weight="400" fill="#6e737b" text-anchor="middle">loaded by</text>
<path d="M768 167L832 167" stroke="#4c5158" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M827 163.5L832 167L827 170.5" stroke="#4c5158" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="800" y="160" font-size="10" font-weight="400" fill="#6e737b" text-anchor="middle">runs in</text>
<rect x="24" y="298" width="1152" height="272" rx="9" fill="#f4f2ee" stroke="rgb(21 23 26 / 0.14)" stroke-width="1"/>
<text x="40" y="320" font-size="9.5" fill="#6e737b" text-anchor="start"><tspan font-weight="600" letter-spacing="0.08em">EXTENSION POINTS</tspan><tspan dx="8" class="m" font-size="10">by the subsystem they extend (fig. 1)</tspan></text>
<rect x="40" y="334" width="268" height="220" rx="7" fill="#ffffff" stroke="rgb(21 23 26 / 0.14)" stroke-width="1"/>
<text x="52" y="355" font-size="11.5" font-weight="600" fill="#15171a" text-anchor="start">Agent integration</text>
<path d="M52 366L296 366" stroke="rgb(21 23 26 / 0.14)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="52" y="386" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m">agentBackends</text>
<text x="52" y="399" font-size="10" font-weight="400" fill="#6e737b" text-anchor="start">a driver for another agent (experimental)</text>
<text x="52" y="420" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m">modelSources</text>
<text x="52" y="433" font-size="10" font-weight="400" fill="#6e737b" text-anchor="start">endpoints, credentials, model catalog</text>
<text x="52" y="454" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m">runtimeHooks</text>
<text x="52" y="467" font-size="10" font-weight="400" fill="#6e737b" text-anchor="start">a process attached to an agent runtime</text>
<text x="52" y="488" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m">agentTools  ◆</text>
<text x="52" y="501" font-size="10" font-weight="400" fill="#6e737b" text-anchor="start">tools served to agents over Riffet MCP</text>
<rect x="323" y="334" width="268" height="220" rx="7" fill="#ffffff" stroke="rgb(21 23 26 / 0.14)" stroke-width="1"/>
<text x="335" y="355" font-size="11.5" font-weight="600" fill="#15171a" text-anchor="start">Automation · Derived views</text>
<path d="M335 366L579 366" stroke="rgb(21 23 26 / 0.14)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="335" y="386" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m">taskProviders</text>
<text x="335" y="399" font-size="10" font-weight="400" fill="#6e737b" text-anchor="start">detect, list and describe project tasks</text>
<text x="335" y="420" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m">sharePublisher</text>
<text x="335" y="433" font-size="10" font-weight="400" fill="#6e737b" text-anchor="start">where a shared session is published</text>
<rect x="606" y="334" width="268" height="220" rx="7" fill="#ffffff" stroke="rgb(21 23 26 / 0.14)" stroke-width="1"/>
<text x="618" y="355" font-size="11.5" font-weight="600" fill="#15171a" text-anchor="start">Clients · Access</text>
<path d="M618 366L862 366" stroke="rgb(21 23 26 / 0.14)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="618" y="386" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m">contributes.views</text>
<text x="618" y="399" font-size="10" font-weight="400" fill="#6e737b" text-anchor="start">web views added to the workbench</text>
<text x="618" y="420" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m">commands</text>
<text x="618" y="433" font-size="10" font-weight="400" fill="#6e737b" text-anchor="start">commands, with optional key bindings</text>
<text x="618" y="454" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m">channels  ◆</text>
<text x="618" y="467" font-size="10" font-weight="400" fill="#6e737b" text-anchor="start">one WebSocket per session</text>
<text x="618" y="488" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m">page · actions</text>
<text x="618" y="501" font-size="10" font-weight="400" fill="#6e737b" text-anchor="start">the plugin’s own page and settings actions</text>
<text x="618" y="522" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m">avatarStyles</text>
<text x="618" y="535" font-size="10" font-weight="400" fill="#6e737b" text-anchor="start">deterministic SVG avatars</text>
<rect x="889" y="334" width="268" height="220" rx="7" fill="#ffffff" stroke="rgb(21 23 26 / 0.14)" stroke-width="1"/>
<text x="901" y="355" font-size="11.5" font-weight="600" fill="#15171a" text-anchor="start">Platform</text>
<path d="M901 366L1145 366" stroke="rgb(21 23 26 / 0.14)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<text x="901" y="386" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m">settings</text>
<text x="901" y="399" font-size="10" font-weight="400" fill="#6e737b" text-anchor="start">declared in the manifest, stored by the host</text>
<text x="901" y="420" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m">status</text>
<text x="901" y="433" font-size="10" font-weight="400" fill="#6e737b" text-anchor="start">state shown in settings</text>
<text x="901" y="454" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m">doctorChecks</text>
<text x="901" y="467" font-size="10" font-weight="400" fill="#6e737b" text-anchor="start">rows in riffet doctor</text>
<text x="24" y="598" font-size="10.5" font-weight="400" fill="#4c5158" text-anchor="start">◆  in-process packages only</text>
<text x="24" y="618" font-size="10.5" font-weight="400" fill="#6e737b" text-anchor="start">Built-in plugins live in plugins/riffet/; the Cursor driver is one of them. A plugin never receives the store, the HTTP server or the terminal service.</text>
<text x="24" y="634" font-size="10.5" font-weight="400" fill="#6e737b" text-anchor="start">Command ids, queueing, delivery records, the journal and session ownership stay in the core for plugin drivers as well.</text>
</svg>
