<text x="97" y="262" font-size="9.5" font-weight="400" fill="#6e737b" text-anchor="start" class="m">closed</text>
<text x="260" y="262" font-size="10.5" font-weight="400" fill="#6e737b" text-anchor="end">one agent each</text>
<text x="38" y="283" font-size="10" font-weight="400" fill="#4c5158" text-anchor="start" class="m">backends/&lt;name&gt;/</text>
<rect x="286" y="238" width="518" height="60" rx="7" fill="#ffffff" stroke="rgb(21 23 26 / 0.14)" stroke-width="1"/>
<text x="300" y="262" font-size="12.5" font-weight="600" fill="#15171a" text-anchor="start">features</text>
<text x="366" y="262" font-size="9.5" font-weight="400" fill="#6e737b" text-anchor="start" class="m">closed</text>
<text x="790" y="262" font-size="10.5" font-weight="400" fill="#6e737b" text-anchor="end">one capability each</text>
<text x="300" y="283" font-size="10" font-weight="400" fill="#4c5158" text-anchor="start" class="m">git · workspace · orchestration · tasks · stats · search · plugins-host · …</text>
<rect x="24" y="308" width="780" height="60" rx="7" fill="#f4f2ee" stroke="rgb(21 23 26 / 0.14)" stroke-width="1"/>
<text x="38" y="332" font-size="12.5" font-weight="600" fill="#15171a" text-anchor="start">kit</text>
<text x="69" y="332" font-size="9.5" font-weight="400" fill="#6e737b" text-anchor="start" class="m">open</text>
<text x="790" y="332" font-size="10.5" font-weight="400" fill="#6e737b" text-anchor="end">mechanisms drivers share: subprocess, hooks, waiting</text>
<text x="38" y="353" font-size="10" font-weight="400" fill="#4c5158" text-anchor="start" class="m">backends/shared/ · adapters/</text>
<rect x="24" y="378" width="780" height="60" rx="7" fill="#f4f2ee" stroke="rgb(21 23 26 / 0.14)" stroke-width="1"/>
<text x="38" y="402" font-size="12.5" font-weight="600" fill="#15171a" text-anchor="start">kernel</text>
<text x="90" y="402" font-size="9.5" font-weight="400" fill="#6e737b" text-anchor="start" class="m">open</text>
<text x="790" y="402" font-size="10.5" font-weight="400" fill="#6e737b" text-anchor="end">the read and write spine of a session; names no concrete backend</text>
<text x="38" y="423" font-size="10" font-weight="400" fill="#4c5158" text-anchor="start" class="m">store.ts · journal · timeline · sync · native · backends/*.ts · terminal · agent-host · settings · auxiliary</text>
<rect x="24" y="448" width="780" height="60" rx="7" fill="#f4f2ee" stroke="rgb(21 23 26 / 0.14)" stroke-width="1"/>
<text x="38" y="472" font-size="12.5" font-weight="600" fill="#15171a" text-anchor="start">base</text>
<text x="76" y="472" font-size="9.5" font-weight="400" fill="#6e737b" text-anchor="start" class="m">open</text>
<text x="790" y="472" font-size="10.5" font-weight="400" fill="#6e737b" text-anchor="end">knows nothing of sessions</text>
<text x="38" y="493" font-size="10" font-weight="400" fill="#4c5158" text-anchor="start" class="m">errors · environment · exec · auth · pairing · discovery · metrics · prompts · …</text>
