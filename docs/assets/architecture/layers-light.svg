<rect x="24" y="98" width="780" height="60" rx="7" fill="#f4f2ee" stroke="rgb(21 23 26 / 0.14)" stroke-width="1"/>
<text x="38" y="122" font-size="12.5" font-weight="600" fill="#15171a" text-anchor="start">root</text>
<text x="76" y="122" font-size="9.5" font-weight="400" fill="#6e737b" text-anchor="start" class="m">open</text>
<text x="790" y="122" font-size="10.5" font-weight="400" fill="#6e737b" text-anchor="end">the only place that knows every module</text>
<text x="38" y="143" font-size="10" font-weight="400" fill="#4c5158" text-anchor="start" class="m">app.ts · index.ts · cli*.ts · doctor.ts</text>
<rect x="24" y="168" width="780" height="60" rx="7" fill="#ffffff" stroke="rgb(21 23 26 / 0.14)" stroke-width="1"/>
<text x="38" y="192" font-size="12.5" font-weight="600" fill="#15171a" text-anchor="start">surfaces</text>
<text x="104" y="192" font-size="9.5" font-weight="400" fill="#6e737b" text-anchor="start" class="m">closed</text>
<text x="790" y="192" font-size="10.5" font-weight="400" fill="#6e737b" text-anchor="end">protocol translation</text>
<text x="38" y="213" font-size="10" font-weight="400" fill="#4c5158" text-anchor="start" class="m">routes/ · channels/</text>
<rect x="24" y="238" width="250" height="60" rx="7" fill="#ffffff" stroke="rgb(21 23 26 / 0.14)" stroke-width="1"/>
