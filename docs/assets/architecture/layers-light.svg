<text x="850" y="86" font-size="9.5" fill="#6e737b" text-anchor="start"><tspan font-weight="600" letter-spacing="0.08em">RULES</tspan></text>
<rect x="896" y="76" width="22" height="14" rx="7" fill="none" stroke="#3867f0" stroke-width="1"/>
<text x="907" y="86.5" font-size="9" font-weight="600" fill="#3867f0" text-anchor="middle" class="m">P7</text>
<text x="850" y="112" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m">imports</text>
<text x="850" y="127" font-size="10.5" font-weight="400" fill="#4c5158" text-anchor="start">A file imports its own module and</text>
<text x="850" y="141" font-size="10.5" font-weight="400" fill="#4c5158" text-anchor="start">modules of lower layers.</text>
<text x="850" y="169" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m">open</text>
<text x="850" y="184" font-size="10.5" font-weight="400" fill="#4c5158" text-anchor="start">Modules of the layer may import</text>
<text x="850" y="198" font-size="10.5" font-weight="400" fill="#4c5158" text-anchor="start">each other.</text>
<text x="850" y="226" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m">closed</text>
<text x="850" y="241" font-size="10.5" font-weight="400" fill="#4c5158" text-anchor="start">No imports between sibling modules.</text>
<text x="850" y="255" font-size="10.5" font-weight="400" fill="#4c5158" text-anchor="start">What they need from each other is</text>
<text x="850" y="269" font-size="10.5" font-weight="400" fill="#4c5158" text-anchor="start">passed in by app.ts.</text>
<text x="850" y="297" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m">check</text>
<text x="850" y="312" font-size="10.5" font-weight="400" fill="#4c5158" text-anchor="start">pnpm check:layers runs in CI. Module</text>
<text x="850" y="326" font-size="10.5" font-weight="400" fill="#4c5158" text-anchor="start">pairs that cross a layer are counted;</text>
<text x="850" y="340" font-size="10.5" font-weight="400" fill="#4c5158" text-anchor="start">the count in layers-baseline.json may</text>
<text x="850" y="354" font-size="10.5" font-weight="400" fill="#4c5158" text-anchor="start">only go down.</text>
