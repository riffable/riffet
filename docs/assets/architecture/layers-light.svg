<text x="24" y="676" font-size="10.5" font-weight="500" fill="#15171a" text-anchor="start" class="m">apps/mobile</text>
<text x="319" y="676" font-size="10" font-weight="400" fill="#4c5158" text-anchor="middle" class="m">fixtures</text>
<text x="880" y="582" font-size="10.5" font-weight="400" fill="#6e737b" text-anchor="start">apps/server and apps/web do not import each other.</text>
<text x="880" y="598" font-size="10.5" font-weight="400" fill="#6e737b" text-anchor="start">apps/mobile :contracts: hand-written Kotlin DTOs,</text>
<text x="880" y="614" font-size="10.5" font-weight="400" fill="#6e737b" text-anchor="start">checked against fixtures from packages/contracts.</text>
<text x="880" y="630" font-size="10.5" font-weight="400" fill="#6e737b" text-anchor="start">apps/macos links apps/mobile :client as RiffetKit.</text>
<text x="880" y="646" font-size="10.5" font-weight="400" fill="#6e737b" text-anchor="start">Plugins reach the server through packages/plugin-api.</text>
