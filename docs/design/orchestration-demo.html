<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Riffet · 编排能力交互原型（讨论用）</title>
<style>
/* Palette copied from apps/web/src/styles/index.css (Riffet theme, light + dark). */
:root {
  color-scheme: light;
  --bg: #ffffff; --bg-sidebar: #f7f8fa; --bg-subtle: #f5f6f8; --bg-muted: #eef0f3; --bg-elevated: #ffffff; --bg-popover: #ffffff;
  --bg-hover: rgb(35 45 70 / 0.055); --bg-active: rgb(35 45 70 / 0.09); --bg-bubble: #eef3fd;
  --fg: #121417; --fg-2: #50555d; --fg-3: #60666e; --fg-4: #adb2ba;
  --line: rgb(15 23 42 / 0.08); --line-soft: rgb(15 23 42 / 0.055); --line-strong: rgb(15 23 42 / 0.13);
  --primary: #15171a; --primary-hover: #34373d; --primary-fg: #ffffff;
  --accent: #3867f0; --accent-hover: #2d59dc; --accent-soft: rgb(56 103 240 / 0.1); --accent-fg: #ffffff;
  --success: #1f9d55; --success-soft: rgb(31 157 85 / 0.1); --warning: #c77f06; --warning-soft: rgb(245 158 11 / 0.13);
  --danger: #e0454b; --danger-soft: rgb(224 69 75 / 0.08);
  --diff-add: #e6f4e7; --diff-add-gutter: #edf7ed; --diff-add-marker: #01a241;
  --diff-del: #fce6e2; --diff-del-gutter: #fdece9; --diff-del-marker: #ba2723;
  --toast: #25272b;
  --agent-cursor: #3d4451; --agent-codex: #10a37f; --agent-claude: #d97757; --agent-dsh: #4d6bfe; --agent-droid: #8566c1; --agent-traex: #c45c7c;
  --shadow-pop: 0 0 0 0.5px rgb(15 23 42 / 0.1), 0 8px 24px -8px rgb(15 23 42 / 0.14), 0 2px 5px -2px rgb(15 23 42 / 0.05);
  --shadow-composer: 0 0 0 0.5px rgb(24 24 26 / 0.08), 0 2px 4px rgb(24 24 26 / 0.03), 0 10px 28px -12px rgb(24 24 26 / 0.14);
  --canvas: var(--bg-sidebar);
  --font-sans: "Inter Variable", "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, "PingFang SC", monospace;
}
.dark {
  color-scheme: dark;
  --bg: #141416; --bg-sidebar: #1a1a1d; --bg-subtle: #1d1d20; --bg-muted: #27272b; --bg-elevated: #1f1f22; --bg-popover: #252528;
  --bg-hover: rgb(255 255 255 / 0.06); --bg-active: rgb(255 255 255 / 0.1); --bg-bubble: #27282c;
  --fg: #eceef1; --fg-2: #b6bac1; --fg-3: #9da2aa; --fg-4: #62666e;
  --line: rgb(255 255 255 / 0.075); --line-soft: rgb(255 255 255 / 0.05); --line-strong: rgb(255 255 255 / 0.12);
  --primary: #eceef1; --primary-hover: #d3d6db; --primary-fg: #141416;
  --accent: #5b8cff; --accent-hover: #4a7cf5; --accent-soft: rgb(91 140 255 / 0.15); --accent-fg: #141416;
  --success: #3fb96f; --success-soft: rgb(63 185 111 / 0.14); --warning: #e5a13a; --warning-soft: rgb(229 161 58 / 0.15);
  --danger: #f0676c; --danger-soft: rgb(240 103 108 / 0.13);
  --diff-add: #1f3124; --diff-add-gutter: #132016; --diff-add-marker: #41c977;
  --diff-del: #3c1f1b; --diff-del-gutter: #28130e; --diff-del-marker: #fa423e;
  --toast: #34363b;
  --agent-cursor: #c9ced6; --agent-codex: #2fc79b; --agent-claude: #e8916f; --agent-dsh: #7590ff; --agent-droid: #b497df; --agent-traex: #da91ad;
  --shadow-pop: 0 0 0 0.5px rgb(255 255 255 / 0.09), 0 12px 32px -10px rgb(0 0 0 / 0.6);
  --shadow-composer: 0 0 0 0.5px rgb(255 255 255 / 0.08), 0 10px 28px -12px rgb(0 0 0 / 0.7);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--canvas); color: var(--fg); font: 14px/22px var(--font-sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
.mono { font-family: var(--font-mono); font-size: 12px; }
.muted { color: var(--fg-3); } .faint { color: var(--fg-4); } .xs { font-size: 12px; line-height: 18px; } .xxs { font-size: 11px; line-height: 16px; }
.add { color: var(--diff-add-marker); } .del { color: var(--diff-del-marker); }
.row { display: flex; align-items: center; gap: 8px; } .col { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; min-width: 0; } .trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp { margin-left: auto; }
svg.i { width: 16px; height: 16px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.s { width: 13px; height: 13px; }

/* Demo chrome */
.demobar { height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-bottom: 1px dashed var(--line-strong); background: var(--bg-subtle); }
.demobar .tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--warning-soft); color: var(--warning); font-weight: 600; }
.seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--bg-muted); gap: 2px; }
.seg button { height: 26px; padding: 0 10px; border-radius: 7px; font-size: 13px; color: var(--fg-3); white-space: nowrap; }
.seg button.on { background: var(--bg); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 0 0 .5px var(--line-strong); font-weight: 500; }
.seg.xs button { height: 22px; padding: 0 8px; font-size: 12px; }

/* Shell */
.shell { display: flex; height: calc(100vh - 44px); }
.sidebar { width: 256px; flex-shrink: 0; display: flex; flex-direction: column; min-height: 0; }
.sb-head { height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px; font-weight: 600; font-size: 15px; }
.brand { width: 20px; height: 20px; border-radius: 6px; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.navrow { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: 8px; font-size: 14px; color: var(--fg); width: 100%; text-align: left; }
.navrow:hover { background: var(--bg-hover); } .navrow.on { background: var(--bg-active); }
.search { margin: 2px 8px 0; height: 32px; border-radius: 8px; background: var(--bg-hover); display: flex; align-items: center; gap: 8px; padding: 0 8px; color: var(--fg-4); font-size: 13px; }
.sb-scroll { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
.sb-sec { display: flex; align-items: center; height: 28px; margin-top: 12px; padding: 0 8px; font-size: 12px; font-weight: 500; color: var(--fg-3); }
.proj { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; font-size: 13px; color: var(--fg-2); font-weight: 500; }
.sess { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px 0 10px; border-radius: 8px; font-size: 13.5px; width: 100%; text-align: left; }
.sess:hover { background: var(--bg-hover); } .sess.on { background: var(--bg-active); }
.sess.child { padding-left: 26px; }
.dot { width: 7px; height: 7px; border-radius: 99px; background: var(--fg-4); flex-shrink: 0; }
.spin { width: 12px; height: 12px; border-radius: 99px; border: 1.8px solid var(--accent-soft); border-top-color: var(--accent); animation: sp 0.8s linear infinite; flex-shrink: 0; }
@keyframes sp { to { transform: rotate(360deg); } }
.panel { flex: 1; min-width: 0; display: flex; margin: 8px 8px 8px 0; border-radius: 12px; background: var(--bg); box-shadow: 0 0 0 1px var(--line); overflow: hidden; position: relative; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.aside { width: 400px; flex-shrink: 0; border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
.aside.wide { width: 620px; }
.hdr { height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line-soft); }
.iconbtn { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 7px; color: var(--fg-3); position: relative; }
.iconbtn:hover, .iconbtn.on { background: var(--bg-hover); color: var(--fg); }
.timeline { flex: 1; overflow-y: auto; padding: 20px 0 24px; }
.tl-inner { max-width: 760px; margin: 0 auto; padding: 0 28px; display: flex; flex-direction: column; gap: 16px; }
.turn { position: relative; display: flex; flex-direction: column; gap: 10px; }
.user { display: flex; justify-content: flex-end; }
.bubble { max-width: min(82%, 560px); white-space: pre-wrap; word-break: break-word; border-radius: 22px; background: var(--bg-bubble); padding: 10px 16px; font-size: 15px; }
.asst { font-size: 15px; line-height: 25px; color: var(--fg); }
.asst p { margin: 0 0 6px; }
.tool { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg-3); }
.meta { display: flex; justify-content: flex-end; gap: 8px; font-size: 11px; color: var(--fg-3); padding: 0 4px; align-items: center; }
.composer-wrap { padding: 0 24px 16px; flex-shrink: 0; }
.composer { max-width: 760px; margin: 0 auto; border-radius: 16px; box-shadow: var(--shadow-composer); background: var(--bg-elevated); padding: 10px 10px 8px; position: relative; }
.composer textarea { width: 100%; border: 0; outline: 0; resize: none; background: transparent; min-height: 48px; padding: 2px 6px; font-size: 15px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 99px; font-size: 13px; color: var(--fg-2); font-weight: 500; white-space: nowrap; }
.pill:hover, .pill.on { background: var(--bg-hover); color: var(--fg); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.sendbtn { width: 30px; height: 30px; border-radius: 99px; background: var(--primary); color: var(--primary-fg); display: grid; place-items: center; }
.agentdot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; flex-shrink: 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 99px; background: var(--bg-muted); font-size: 12px; color: var(--fg-2); white-space: nowrap; }
.chip.ok { background: var(--success-soft); color: var(--success); } .chip.warn { background: var(--warning-soft); color: var(--warning); }
.chip.bad { background: var(--danger-soft); color: var(--danger); } .chip.acc { background: var(--accent-soft); color: var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 500; background: var(--bg-muted); color: var(--fg); white-space: nowrap; }
.btn:hover { background: var(--bg-active); }
.btn.pri { background: var(--primary); color: var(--primary-fg); } .btn.pri:hover { background: var(--primary-hover); }
.btn.acc { background: var(--accent); color: var(--accent-fg); }
.btn.ghost { background: transparent; color: var(--fg-2); } .btn.ghost:hover { background: var(--bg-hover); color: var(--fg); }
.btn.danger { background: var(--danger); color: #fff; }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; border-radius: 7px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.banner { display: flex; align-items: center; gap: 8px; margin: 10px 16px 0; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--fg-2); font-size: 13px; }
.banner.muted { background: var(--bg-subtle); }
.link { color: var(--accent); cursor: pointer; } .link:hover { text-decoration: underline; }

/* Aside */
.utabs { display: flex; gap: 16px; padding: 0 16px; height: 44px; align-items: flex-end; border-bottom: 1px solid var(--line-soft); flex-shrink: 0; }
.utabs button { height: 36px; font-size: 13.5px; color: var(--fg-3); border-bottom: 2px solid transparent; }
.utabs button.on { color: var(--fg); border-color: var(--fg); font-weight: 500; }
.asc { flex: 1; min-height: 0; overflow-y: auto; }
.sec-title { font-size: 11px; font-weight: 500; color: var(--fg-4); padding: 0 8px; margin: 12px 0 6px; display: flex; align-items: center; }
.frow { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 8px; font-size: 13.5px; cursor: pointer; }
.frow:hover { background: var(--bg-hover); } .frow.on { background: var(--bg-active); }
.letter { width: 12px; text-align: center; font: 600 12px var(--font-mono); }
.card { border-radius: 12px; box-shadow: 0 0 0 1px var(--line); background: var(--bg-elevated); padding: 12px; }
.tray { flex-shrink: 0; border-top: 1px solid var(--line); background: var(--bg-subtle); padding: 10px 12px; }
.tray-item { display: flex; gap: 8px; font-size: 12.5px; padding: 6px 8px; border-radius: 8px; background: var(--bg); box-shadow: 0 0 0 1px var(--line-soft); }

/* Diff */
.diff { font: 12px/20px var(--font-mono); }
.dl { display: grid; grid-template-columns: 22px 38px 38px 14px 1fr; position: relative; user-select: none; }
.dl .g { color: var(--fg-4); text-align: right; padding-right: 6px; }
.dl .c { white-space: pre; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
.dl.a { background: var(--diff-add); } .dl.a .g { background: var(--diff-add-gutter); } .dl.a .m { color: var(--diff-add-marker); }
.dl.d { background: var(--diff-del); } .dl.d .g { background: var(--diff-del-gutter); } .dl.d .m { color: var(--diff-del-marker); }
.dl.h { background: var(--accent-soft); color: var(--fg-3); }
.dl .plus { width: 18px; height: 18px; margin: 1px 2px; border-radius: 5px; background: var(--accent); color: #fff; display: grid; place-items: center; opacity: 0; font: 600 13px/1 var(--font-sans); }
.dl:hover .plus, .dl.sel .plus { opacity: 1; }
.dl.sel { box-shadow: inset 3px 0 0 var(--accent); filter: saturate(1.4); }
.dl.sel::after { content: ""; position: absolute; inset: 0; background: var(--accent-soft); pointer-events: none; }
.dl.cm { box-shadow: inset 3px 0 0 var(--warning); }
.cbox { margin: 4px 8px 8px 60px; font-family: var(--font-sans); font-size: 13px; padding: 10px; border-radius: 10px; background: var(--bg-elevated); box-shadow: var(--shadow-pop); }
.cnote { margin: 2px 8px 6px 60px; font-family: var(--font-sans); font-size: 12.5px; line-height: 19px; padding: 6px 10px; border-radius: 8px; background: var(--warning-soft); }
textarea.inp, input.inp, select.inp { width: 100%; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--bg); padding: 6px 9px; outline: none; font-size: 13px; }
textarea.inp { resize: vertical; min-height: 64px; line-height: 20px; }
.inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
label.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--fg-3); }
label.chk { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; cursor: pointer; }
label.chk input { margin-top: 4px; accent-color: var(--accent); }

/* Overlay */
.scrim { position: fixed; inset: 0; background: rgb(10 12 16 / .32); display: grid; place-items: center; z-index: 50; animation: fi .12s ease-out; }
@keyframes fi { from { opacity: 0; } }
.dialog { width: min(560px, 94vw); max-height: 88vh; overflow-y: auto; background: var(--bg-popover); border-radius: 16px; box-shadow: var(--shadow-pop); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.dialog.lg { width: min(860px, 96vw); }
.dialog h3 { margin: 0; font-size: 16px; font-weight: 600; }
.dialog .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
pre.preview { margin: 0; white-space: pre-wrap; font: 12px/19px var(--font-mono); background: var(--bg-subtle); border-radius: 10px; padding: 12px; max-height: 320px; overflow: auto; box-shadow: inset 0 0 0 1px var(--line-soft); }
.warnbox { display: flex; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--warning-soft); color: var(--fg); font-size: 13px; border: 1px solid color-mix(in srgb, var(--warning) 40%, transparent); }
.warnbox b { color: var(--warning); }
.infobox { display: flex; gap: 10px; padding: 9px 12px; border-radius: 10px; background: var(--bg-subtle); font-size: 12.5px; color: var(--fg-2); }
.pop { position: absolute; z-index: 30; background: var(--bg-popover); border-radius: 12px; box-shadow: var(--shadow-pop); padding: 6px; min-width: 220px; }
.mi { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 10px; border-radius: 8px; font-size: 13.5px; text-align: left; }
.mi:hover { background: var(--bg-hover); }
.mi.dis { color: var(--fg-4); pointer-events: none; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--toast); color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 13px; z-index: 80; box-shadow: var(--shadow-pop); animation: fi .15s; }
.note { position: fixed; right: 20px; bottom: 20px; width: 330px; z-index: 40; background: #fffbea; color: #3b3110; border-radius: 12px; box-shadow: 0 0 0 1px rgb(199 127 6 / .35), 0 12px 32px -12px rgb(0 0 0 / .3); font-size: 12.5px; line-height: 19px; }
.dark .note { background: #2b2614; color: #f1e6c4; }
.note header { display: flex; align-items: center; gap: 6px; padding: 8px 12px; font-weight: 600; border-bottom: 1px dashed rgb(199 127 6 / .35); cursor: pointer; }
.note ol { margin: 0; padding: 8px 12px 10px 30px; max-height: 300px; overflow: auto; }
.note li { margin-bottom: 4px; }
.note.min ol { display: none; }

/* Checkpoint markers */
.cp-mark { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--fg-4); height: 22px; }
.cp-mark::before, .cp-mark::after { content: ""; height: 1px; background: var(--line); flex: 1; }
.cp-mark .acts { display: none; gap: 4px; }
.turn:hover .cp-mark .acts { display: flex; }
.turn:hover .cp-mark { color: var(--fg-3); }
.cp-mark.always .acts { display: flex; }
.rail { position: absolute; left: -22px; top: 6px; width: 12px; height: 12px; border-radius: 99px; border: 2px solid var(--fg-4); background: var(--bg); cursor: pointer; }
.rail:hover, .rail.on { border-color: var(--accent); background: var(--accent-soft); }
.tl-inner.railed { position: relative; }
.tl-inner.railed::before { content: ""; position: absolute; left: 11px; top: 0; bottom: 0; border-left: 1px dashed var(--line-strong); }
.cp-item { display: flex; gap: 10px; padding: 8px; border-radius: 8px; }
.cp-item:hover { background: var(--bg-hover); }
.cp-ico { width: 20px; height: 20px; border-radius: 99px; display: grid; place-items: center; flex-shrink: 0; font-size: 10px; font-weight: 600; }

/* Attempts */
.cmp { flex: 1; overflow: auto; padding: 16px 20px 24px; }
.cmp-grid { display: grid; gap: 12px; }
.att { border-radius: 12px; box-shadow: 0 0 0 1px var(--line); padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--bg-elevated); min-width: 0; }
.att.win { box-shadow: 0 0 0 2px var(--success); }
.att .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 12px; font-size: 12px; color: var(--fg-3); }
.att .stats b { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }
.excerpt { font-size: 13px; color: var(--fg-2); background: var(--bg-subtle); border-radius: 8px; padding: 8px 10px; line-height: 20px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.bar { height: 4px; border-radius: 9px; background: var(--bg-muted); overflow: hidden; } .bar i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 500; color: var(--fg-3); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 9px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.tgt { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; font-size: 13px; cursor: pointer; }
.tgt:hover { background: var(--bg-hover); }
.tgt.on { background: var(--accent-soft); }

/* Tasks page */
.page { flex: 1; overflow-y: auto; padding: 20px 28px 40px; }
.page h2 { margin: 0; font-size: 18px; font-weight: 600; }
.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.tpl { display: flex; flex-direction: column; gap: 8px; }
.tpl .prompt { font-size: 13px; color: var(--fg-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; min-height: 60px; }
.switch { width: 32px; height: 18px; border-radius: 99px; background: var(--bg-active); position: relative; flex-shrink: 0; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 99px; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .2); transition: left .15s; }
.switch.on { background: var(--accent); } .switch.on::after { left: 16px; }
.palette { width: min(620px, 94vw); background: var(--bg-popover); border-radius: 14px; box-shadow: var(--shadow-pop); overflow: hidden; align-self: start; margin-top: 12vh; }
.palette input { width: 100%; border: 0; outline: 0; padding: 14px 16px; font-size: 15px; background: transparent; border-bottom: 1px solid var(--line); }
</style>
</head>

/* ============ Cron ============ */
function cronField(f, v, min) {
  return f.split(',').some((part) => {
    let [range, step] = part.split('/'); step = step ? +step : 1;
    let lo, hi;
    if (range === '*') { lo = min; hi = 99; } else if (range.includes('-')) [lo, hi] = range.split('-').map(Number); else { lo = +range; hi = step > 1 ? 99 : lo; }
    return v >= lo && v <= hi && (v - lo) % step === 0;
  });
}
function cronValid(expr) { const f = expr.trim().split(/\s+/); return f.length === 5 && f.every((x) => /^[\d*,\-/]+$/.test(x)); }
function nextRuns(expr, n = 3, from = NOW) {
  if (!cronValid(expr)) return [];
  const [mi, ho, dom, mon, dow] = expr.trim().split(/\s+/); const out = []; const d = new Date(from); d.setSeconds(0, 0); d.setMinutes(d.getMinutes() + 1);
  for (let i = 0; i < 60 * 24 * 40 && out.length < n; i++, d.setMinutes(d.getMinutes() + 1))
    if (cronField(mi, d.getMinutes(), 0) && cronField(ho, d.getHours(), 0) && cronField(dom, d.getDate(), 1) && cronField(mon, d.getMonth() + 1, 1) && cronField(dow, d.getDay(), 0)) out.push(new Date(d));
  return out;
}
function cronHuman(expr) {
  if (!cronValid(expr)) return '无效的 cron 表达式';
  const [mi, ho, dom, mon, dow] = expr.trim().split(/\s+/); const num = (x) => /^\d+$/.test(x);
  const t = num(mi) && num(ho) ? `${pad(ho)}:${pad(mi)}` : '';
  if (num(mi) && ho === '*' && dom === '*' && mon === '*' && dow === '*') return `每小时第 ${mi} 分`;
  if (num(mi) && /^\*\/\d+$/.test(ho) && dom === '*' && dow === '*') return `每 ${ho.slice(2)} 小时（第 ${mi} 分）`;
  if (t && dom === '*' && mon === '*') {
    if (dow === '*') return `每天 ${t}`;
    if (dow === '1-5') return `每个工作日 ${t}`;
    if (dow === '0,6' || dow === '6,0') return `每个周末 ${t}`;
    if (/^[\d,]+$/.test(dow)) return `每${dow.split(',').map((x) => WD[+x % 7]).join('、')} ${t}`;
  }

  return `自定义：${expr}`;
}

}

function handoffContext(o) {

  const turns = CSV_TURNS.slice(0, upto + 1);
  const strip = (h) => h.replace(/<br>/g, ' ').replace(/<[^>]+>/g, '');
  const lines = [
    `# 交接说明`, `你正在接手一个由 Claude Code 开始的会话「导出发票 CSV」。工作目录：${o.wt ? '~/.riffet/worktrees/billing-service/invoice-csv-handoff（新 worktree，基于当前改动）' : '~/.riffet/worktrees/billing-service/invoice-csv'}`, '',
    `## 最初的任务（原文保留）`, turns[0].user, '',
  ];
  if (turns.length > 2) lines.push(`## 较早的对话`, `（已省略 ${turns.length - 2} 个回合，约 ${(turns.length - 2) * 3.4}k tokens；要点：${strip(turns[1].asst).slice(0, 60)}…）`, '');
  lines.push(`## 最近的回合`);
  turns.slice(Math.max(1, turns.length - 1)).forEach((t) => lines.push(`用户：${t.user}`, `助手：${strip(t.asst)}`));
  if (turns.length === 1) lines.push(`助手：${strip(turns[0].asst)}`);

}

});

document.addEventListener('keydown', (e) => {

});
document.addEventListener('DOMContentLoaded', () => { initFiles(); render(); });

<script type="text/plain" id="diff-csv">
@@ -0,0 +1,22 @@
+export interface CsvColumn<T> {
+  header: string;
+  value: (row: T) => string | number | null | undefined;
+}
+
+const NEEDS_QUOTE = /[",\r\n]/;
+
+export function escapeCell(input: unknown): string {
+  if (input === null || input === undefined) return '';
+  const text = String(input);
+  if (!NEEDS_QUOTE.test(text)) return text;
+  return `"${text.replace(/"/g, '""')}"`;
+}
+
+export function toCsv<T>(rows: T[], columns: CsvColumn<T>[]): string {
+  const head = columns.map((c) => escapeCell(c.header)).join(',');
+  const body = rows.map((row) =>
+    columns.map((c) => escapeCell(c.value(row))).join(','),
+  );
+  return [head, ...body].join('\r\n');
+}
</script>

+export function formatMoney(cents: number, currency = 'CNY') {
+  return new Intl.NumberFormat('zh-CN', { style: 'currency', currency }).format(cents / 100);
+}
+
+/** 用于导出：固定两位小数，不带货币符号和千分位。 */
+export function formatCents(cents: number) {
+  const sign = cents < 0 ? '-' : '';
+  const abs = Math.abs(cents);
+  return `${sign}${Math.floor(abs / 100)}.${String(abs % 100).padStart(2, '0')}`;
 }
