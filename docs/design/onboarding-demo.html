<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Riffet · 未连接与首次使用（交互原型）</title>
<style>
/*
 * Prototype: the main window without a server, the in-place setup that replaces the composer, the
 * brand mark drawn once on first launch, and the full-window first-launch flow. Drawn with the design system
 * (docs/design/system/): role colours from apps/web/src/styles/index.css, motion tokens from
 * design-tokens.ts, the Riffet style rules in docs/design/riffet-style.md. Brand geometry is
 * apps/web/src/lib/app-icon.ts; icons are lucide paths at stroke 1.25.
 */
:root {
  color-scheme: light;
  --bg: #ffffff; --bg-sidebar: #f7f8fa; --bg-subtle: #f5f6f8; --bg-muted: #eef0f3; --bg-elevated: #ffffff; --bg-popover: #ffffff;
  --bg-hover: rgb(35 45 70 / 0.055); --bg-active: rgb(35 45 70 / 0.09); --bg-bubble: #eef3fd;
  --fg: #2a2c2e; --fg-2: #50555d; --fg-3: #60666e; --fg-4: #adb2ba;
  --line: rgb(15 23 42 / 0.08); --line-soft: rgb(15 23 42 / 0.055); --line-strong: rgb(15 23 42 / 0.13);
  --primary: #15171a; --primary-hover: #34373d; --primary-fg: #ffffff;
  --accent: #3867f0;
  --warning: #c77f06; --danger: #e0454b;
  --agent-claude: #d97757;
  --shadow-soft: 0 1px 2px rgb(15 23 42 / 0.03), 0 3px 10px -4px rgb(15 23 42 / 0.05);
  --shadow-pop: 0 0 0 0.5px rgb(15 23 42 / 0.1), 0 8px 24px -8px rgb(15 23 42 / 0.14), 0 2px 5px -2px rgb(15 23 42 / 0.05);
  --shadow-composer: 0 0 0 0.5px rgb(24 24 26 / 0.08), 0 2px 4px rgb(24 24 26 / 0.03), 0 10px 28px -12px rgb(24 24 26 / 0.14);
  --scrim: rgb(0 0 0 / 0.25);
  --canvas: var(--bg-sidebar);
  --focus-ring: color-mix(in srgb, var(--accent) 50%, transparent);
  --ease-standard: cubic-bezier(0.2, 0, 0, 1); --ease-decelerate: cubic-bezier(0.05, 0.7, 0.1, 1); --ease-accelerate: cubic-bezier(0.3, 0, 0.8, 0.15);
  --duration-fast: 150ms; --duration-base: 200ms; --duration-medium: 250ms; --duration-slow: 400ms; --duration-exit-fast: 100ms;
  --font-sans: "Inter Variable", "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, "PingFang SC", monospace;
}
.dark {
  color-scheme: dark;
  --bg: #141416; --bg-sidebar: #1a1a1d; --bg-subtle: #1d1d20; --bg-muted: #27272b; --bg-elevated: #1f1f22; --bg-popover: #252528;
  --bg-hover: rgb(255 255 255 / 0.06); --bg-active: rgb(255 255 255 / 0.1); --bg-bubble: #27282c;
  --fg: #d2d4d7; --fg-2: #b6bac1; --fg-3: #9da2aa; --fg-4: #62666e;
  --line: rgb(255 255 255 / 0.075); --line-soft: rgb(255 255 255 / 0.05); --line-strong: rgb(255 255 255 / 0.12);
  --primary: #eceef1; --primary-hover: #d3d6db; --primary-fg: #141416;
  --accent: #5b8cff; --warning: #e5a13a; --danger: #f0676c; --agent-claude: #e8916f;
  --shadow-soft: 0 1px 2px rgb(0 0 0 / 0.18);
  --shadow-pop: 0 0 0 0.5px rgb(255 255 255 / 0.09), 0 12px 32px -10px rgb(0 0 0 / 0.6);
  --shadow-composer: 0 0 0 0.5px rgb(255 255 255 / 0.08), 0 10px 28px -12px rgb(0 0 0 / 0.7);
  --scrim: rgb(0 0 0 / 0.5);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--canvas); color: var(--fg); font: 13px/20px var(--font-sans); -webkit-font-smoothing: antialiased; overflow: hidden; user-select: none; -webkit-user-select: none; cursor: default; }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: default; text-align: inherit; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
svg.i * { vector-effect: non-scaling-stroke; }
.mono { font-family: var(--font-mono); }
.trunc { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fg-2 { color: var(--fg-2); } .fg-3 { color: var(--fg-3); } .fg-4 { color: var(--fg-4); }
.spin { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Button — components/ui/button.tsx */
.btn { display: inline-flex; flex: none; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; font-weight: 500;
  transition: color var(--duration-fast) var(--ease-standard), background-color var(--duration-fast) var(--ease-standard), scale var(--duration-fast) var(--ease-standard); }
.btn:active { scale: 0.97; }
.btn:disabled { opacity: .5; pointer-events: none; }
.btn.xs { height: 24px; padding: 0 8px; border-radius: 8px; font-size: 12px; line-height: 18px; } .btn.xs svg.i { width: 14px; height: 14px; }
.btn.sm { height: 28px; padding: 0 10px; border-radius: 10px; } .btn.sm svg.i { width: 14px; height: 14px; }
.btn.md { height: 32px; padding: 0 12px; border-radius: 10px; }
.btn.icon-xs { width: 24px; height: 24px; border-radius: 8px; } .btn.icon-xs svg.i { width: 14px; height: 14px; }
.btn.primary { background: var(--primary); color: var(--primary-fg); } .btn.primary:hover { background: var(--primary-hover); }
.btn.secondary { background: color-mix(in srgb, var(--fg) 7%, transparent); color: var(--fg); }
.btn.secondary:hover { background: color-mix(in srgb, var(--fg) 11%, transparent); }
.btn.ghost { color: var(--fg-2); } .btn.quiet { color: var(--fg-3); }
.btn.ghost:hover, .btn.quiet:hover { background: var(--bg-hover); color: var(--fg); }

/* Segmented — controls.tsx */
.seg { position: relative; display: inline-flex; align-items: center; padding: 2px; border-radius: 10px; background: var(--bg-muted); box-shadow: inset 0 0 0 .5px var(--line); }
.seg button { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 8px; font-size: 12px; font-weight: 500; color: var(--fg-3); transition: color var(--duration-base) var(--ease-standard), background-color var(--duration-base); }
.seg button:hover { color: var(--fg-2); }
.seg button[aria-checked="true"] { color: var(--fg); background: var(--bg-elevated); box-shadow: 0 0 0 .5px var(--line-strong), var(--shadow-soft); }
.dark .seg button[aria-checked="true"] { background: var(--bg-active); }
.seg svg.i { width: 14px; height: 14px; }

/* Menu, dialog — dropdown-menu.tsx, dialog.tsx */
.menu { position: fixed; z-index: 75; min-width: 200px; padding: 4px; border-radius: 12px; background: var(--bg-popover); box-shadow: var(--shadow-pop); color: var(--fg); animation: pop-in var(--duration-fast) var(--ease-decelerate) both; }
@keyframes pop-in { from { opacity: 0; transform: scale(.96) translateY(4px); } }
.mi { display: flex; width: 100%; min-height: 32px; align-items: center; gap: 8px; padding: 0 8px; border-radius: 8px; font-size: 13px; }
.mi:hover, .mi.hl { background: var(--bg-hover); }
.mi > svg.i:first-child { color: var(--fg-3); }
.mi .end { margin-left: auto; padding-left: 16px; display: inline-flex; align-items: center; gap: 6px; color: var(--fg-3); font-size: 12px; }
.mlabel { padding: 6px 8px 4px; font-size: 12px; line-height: 18px; font-weight: 500; color: var(--fg-3); }
.msep { height: 1px; margin: 4px -4px; background: var(--line); }
.scrim { position: fixed; inset: 0; z-index: 69; background: var(--scrim); backdrop-filter: blur(1.5px); animation: fade-in var(--duration-fast) var(--ease-decelerate) both; }
.dialog { position: fixed; z-index: 70; left: 50%; top: 50%; width: min(448px, calc(100vw - 32px)); transform: translate(-50%, -50%); display: flex; flex-direction: column; border-radius: 16px; background: var(--bg-elevated); box-shadow: var(--shadow-pop); animation: dialog-in var(--duration-fast) var(--ease-decelerate) both; }
@keyframes fade-in { from { opacity: 0; } }
@keyframes dialog-in { from { opacity: 0; transform: translate(-50%, -50%) scale(.96); } }
.dialog .dh { padding: 20px 48px 12px 20px; font-size: 16px; line-height: 24px; font-weight: 500; }
.dialog .dx { position: absolute; top: 12px; right: 12px; }
.dialog .db { display: flex; flex-direction: column; gap: 16px; padding: 0 20px 8px; }
.dialog .df { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 16px 20px 20px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 13px; font-weight: 500; }
.input { width: 100%; height: 32px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--bg-elevated); font-size: 13px; outline: none; }
.input::placeholder { color: var(--fg-4); }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }

/* ---------- prototype chrome (not part of the design) ---------- */
.demo-bar { position: fixed; inset: 0 0 auto 0; height: 44px; z-index: 50; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 16px; background: var(--canvas); box-shadow: inset 0 -1px var(--line); }
.demo-bar .name { font-weight: 500; color: var(--fg-3); }
.demo-bar .sp { flex: 1; }
.demo-bar .sub { display: flex; align-items: center; gap: 8px; }
.stage { position: absolute; inset: 44px 0 0 0; }
.scene { position: absolute; inset: 0; display: none; }
.scene.on { display: flex; }
.note { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); font-size: 12px; color: var(--fg-4); white-space: nowrap; pointer-events: none; }

/* ---------- workbench: sidebar on the canvas, main card inset 8, radius 12 ---------- */
.sb { width: 256px; flex: none; display: flex; flex-direction: column; min-height: 0; }
.sb-top { height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px; }
.sb-top .brand { font-size: 14px; line-height: 22px; font-weight: 600; letter-spacing: -.01em; }
.sb-nav { display: flex; flex-direction: column; gap: 1px; padding: 0 8px 8px; }
.nav { display: flex; height: 32px; align-items: center; gap: 9px; padding: 0 8px; border-radius: 10px; color: var(--fg-2); transition: background-color var(--duration-fast), color var(--duration-fast); }
.nav svg.i { width: 18px; height: 18px; }
.nav:hover { background: var(--bg-hover); color: var(--fg); }
.nav[aria-current="page"] { background: var(--bg-active); color: var(--fg); }
.sb-list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 12px; }
.sb-sec { display: flex; align-items: center; gap: 6px; height: 28px; margin-top: 12px; padding: 0 8px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--fg-3); }
.sb-sec svg.i { width: 14px; height: 14px; color: var(--fg-3); }
.sb-row { display: flex; height: 30px; align-items: center; gap: 8px; padding: 0 8px 0 28px; border-radius: 8px; color: var(--fg-2); }
.sb-row.sel { background: var(--bg-active); color: var(--fg); }
.sb-row .t { flex: 1; min-width: 0; }
.sb-row .when { font-size: 12px; color: var(--fg-4); }
.sb-foot { display: flex; align-items: center; height: 52px; flex: none; padding: 0 12px; }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-active); color: var(--fg-3); }
.avatar:hover { color: var(--fg); }
.avatar svg.i { width: 15px; height: 15px; }
.main { position: relative; flex: 1; min-width: 0; margin: 8px 8px 8px 0; border-radius: 12px; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
.page-h { height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; }
.page-h h1 { margin: 0; font-size: 13px; line-height: 20px; font-weight: 500; }

/* ---------- the brand mark: drawn once, then still ---------- */
.mark { overflow: visible; }
.mark .head { fill: currentColor; stroke: currentColor; stroke-width: 1; stroke-linejoin: round; }
.mark .tooth { fill: var(--accent); stroke: var(--accent); stroke-width: .6; stroke-linejoin: round; }
.mark.draw .head { stroke-dasharray: 1.02 1; animation: draw-line 1.9s var(--ease-standard) both; }
.mark.draw .p-tooth { animation: draw-pop .42s var(--ease-decelerate) both; }
.mark.draw .p-tooth.n1 { animation-delay: 1.25s; } .mark.draw .p-tooth.n2 { animation-delay: 1.38s; } .mark.draw .p-tooth.n3 { animation-delay: 1.51s; }
.mark.draw .p-eye { animation: draw-pop .36s var(--ease-decelerate) 1.72s both; }
@keyframes draw-line { 0% { stroke-dashoffset: 1; fill-opacity: 0; } 62% { stroke-dashoffset: 0; fill-opacity: 0; } 100% { stroke-dashoffset: 0; fill-opacity: 1; } }
@keyframes draw-pop { 0% { transform: scale(0); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .mark.draw .head, .mark.draw .p-tooth, .mark.draw .p-eye { animation: none; stroke-dasharray: none; } }

/* ---------- home: the new-session page ---------- */
.home { flex: 1; min-height: 0; overflow-y: auto; }
.home-col { max-width: 720px; margin: 0 auto; padding: max(48px, 14vh) 32px 64px; display: flex; flex-direction: column; }
.home-hero { display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 32px; margin-bottom: 24px; text-align: center; }
.home-hero .mark { width: 64px; height: 64px; margin-bottom: 8px; color: var(--fg); }
.home-hero h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -.01em; animation: fade-up var(--duration-medium) var(--ease-decelerate) both; }
@keyframes fade-up { from { opacity: 0; transform: translateY(4px); } }

/*
 * Setup: the composer's own card (radius 16, shadow-composer) holding the three conditions. Done
 * steps show what they resolved to; the open step is the only one with a body. When the last one
 * closes, the card keeps its frame and its contents cross-fade into the composer.
 */
.card16 { border-radius: 16px; background: var(--bg-elevated); box-shadow: var(--shadow-composer); overflow: hidden; transition: height var(--duration-slow) var(--ease-standard); }
.steps { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; }
.step { display: inline-flex; align-items: center; gap: 8px; min-width: 0; color: var(--fg-4); font-weight: 500; transition: color var(--duration-base); }
.step.open { color: var(--fg); }
.step.done { color: var(--fg-2); font-weight: 400; }
.step .v { max-width: 160px; }
.step-sep { flex: 0 1 28px; min-width: 12px; height: 1px; background: var(--line-strong); }
.glyph { position: relative; width: 16px; height: 16px; flex: none; border-radius: 50%; box-shadow: inset 0 0 0 1.25px currentColor; display: grid; place-items: center; transition: background-color var(--duration-base), box-shadow var(--duration-base); }
.step.open .glyph { box-shadow: inset 0 0 0 1.25px var(--fg); }
.step.open .glyph::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--fg); }
.step.busy .glyph { box-shadow: none; }
.step.busy .glyph::after { display: none; }
.step.busy .glyph svg.i { width: 16px; height: 16px; color: var(--fg-3); }
.step.done .glyph { background: var(--fg-2); box-shadow: none; color: var(--bg); animation: tick-in var(--duration-medium) var(--ease-decelerate) both; }
.step.done .glyph svg.i { width: 11px; height: 11px; stroke-width: 2.2; }
@keyframes tick-in { from { transform: scale(.6); } }
.step-body { padding: 0 16px 14px; animation: fade-in var(--duration-base) var(--ease-decelerate) both; }
.step-line { display: flex; align-items: center; gap: 12px; min-height: 32px; }
.step-line .what { flex: 1; min-width: 0; color: var(--fg-2); }
.step-line .acts { display: flex; gap: 6px; }
.install { margin-top: 8px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); padding: 4px; }
.install .r { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 4px 0 8px; border-radius: 8px; }
.install .r:hover { background: var(--bg-hover); }
.install .r .n { width: 124px; white-space: nowrap; flex: none; display: flex; align-items: center; gap: 8px; color: var(--fg); }
.install .r code { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 12px; color: var(--fg-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.amark { width: 14px; height: 14px; flex: none; }

/* composer (surfaces §1.8) */
.composer textarea { display: block; width: 100%; min-height: 76px; padding: 16px 16px 4px; border: 0; background: none; resize: none; outline: none; font-size: 14px; line-height: 24px; }
.composer textarea::placeholder { color: var(--fg-4); }
.composer .bar { display: flex; align-items: center; gap: 4px; padding: 4px 8px 8px; }
.plus { width: 28px; height: 28px; border-radius: 10px; display: grid; place-items: center; color: var(--fg-3); }
.plus:hover, .plus.on { background: var(--bg-hover); color: var(--fg); }
.plus svg.i { width: 18px; height: 18px; }
.capsule { display: inline-flex; height: 26px; align-items: center; gap: 6px; padding: 0 10px; border-radius: 13px; color: var(--fg-3); }
.capsule:hover { background: var(--bg-hover); color: var(--fg); }
.send { width: 32px; height: 32px; margin-left: auto; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: var(--primary-fg); flex: none; }
.send svg.i { width: 16px; height: 16px; }
.send:disabled { background: color-mix(in srgb, var(--fg) 8%, transparent); color: var(--fg-4); }
.swap-in { animation: fade-in var(--duration-medium) var(--ease-decelerate) both; }


/* EmptyState — the page a server-backed destination shows without a server */
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 0 24px 96px; text-align: center; }
.empty .tile { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; background: var(--bg-subtle); color: var(--fg-2); }
.empty .tile svg.i { width: 20px; height: 20px; }
.empty h2 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 500; }
.ghost-page { flex: 1; display: grid; place-items: center; color: var(--fg-4); font-size: 12px; }

/* settings (dialog size wide) */
.settings { position: fixed; z-index: 70; left: 50%; top: 50%; width: min(860px, calc(100vw - 48px)); height: min(600px, calc(100vh - 96px)); transform: translate(-50%, -50%); display: flex; border-radius: 16px; overflow: hidden; background: var(--bg-elevated); box-shadow: var(--shadow-pop); animation: dialog-in var(--duration-fast) var(--ease-decelerate) both; }
.set-nav { width: 216px; flex: none; overflow-y: auto; padding: 12px 8px; background: var(--bg-sidebar); }
.set-nav .g { padding: 12px 8px 4px; font-size: 12px; font-weight: 500; color: var(--fg-3); }
.set-nav .g:first-child { padding-top: 0; }
.set-nav .nav { width: 100%; height: 30px; }
.set-nav .nav svg.i { width: 16px; height: 16px; }
.set-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.set-body .page-h { padding-left: 24px; }
.set-scroll { flex: 1; overflow-y: auto; padding: 4px 24px 32px; }
.sgroup { margin-bottom: 24px; }
.sgroup .h { height: 28px; display: flex; align-items: center; padding: 0 2px; font-size: 12px; font-weight: 500; color: var(--fg-3); }
.sframe { border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); }
.srow { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 14px; }
.srow + .srow { box-shadow: inset 0 1px var(--line-soft); }
.srow .k { flex: 1; min-width: 0; }
.srow .k small { display: block; font-size: 12px; line-height: 16px; color: var(--fg-3); }
.srow .v { color: var(--fg-3); }


/*
 * Hint: one line that slides out from behind the composer's top edge, shown once and gone for good
 * once dismissed or acted on. It reads as part of the composer, not as a toast over the timeline.
 */
/* ---------- phones ---------- */
.phones { flex: 1; display: flex; justify-content: center; align-items: center; gap: 48px; padding: 24px; overflow: auto; }
.phone-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.phone { position: relative; width: 360px; height: 760px; flex: none; display: flex; flex-direction: column; overflow: hidden; border-radius: 48px; background: var(--bg);
  box-shadow: 0 0 0 10px #0d0d0f, 0 0 0 11px #2c2c30, 0 30px 60px -20px rgb(0 0 0 / .45); font-size: 15px; line-height: 22px; }
.phone.grouped { background: var(--bg-sidebar); }
.p-status { height: 50px; flex: none; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 32px 6px 36px; font-size: 15px; font-weight: 600; }
.p-status .sig { display: flex; gap: 3px; align-items: flex-end; height: 12px; }
.p-status .sig i { display: block; width: 3px; border-radius: 1px; background: currentColor; }
.p-bar { height: 44px; flex: none; display: flex; align-items: center; padding: 0 8px; }
.p-bar .title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; }
.p-large { padding: 4px 20px 8px; font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: -.01em; }
.p-main { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
.p-hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding-bottom: 40px; }
.p-hero .mark { width: 56px; height: 56px; color: var(--fg); }
.p-hero h1 { margin: 0; font-size: 22px; line-height: 30px; font-weight: 600; animation: fade-up var(--duration-medium) var(--ease-decelerate) both; }
/* the floating glass island (mobile only): the setup takes its place and its material */

.welcome .sub { animation: fade-up var(--duration-slow) var(--ease-decelerate) 2.05s both; }

</div>

<div class="stage">

function qrSVG() {
  const n = 25; let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#111"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#111"/>`;
  let cells = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const inF = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
    if (!inF && rnd() > .52) cells += `<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`;
  }
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges">${cells}${finder(0, 0)}${finder(n - 7, 0)}${finder(0, n - 7)}</svg>`;
}

    const dirs = [['kiln', 'git'], ['notes', ''], ['riffet-plugins', 'git'], ['sandbox', '']];
    col = `<div class="${cls}"><h1>从哪个目录开始</h1><p class="sub">Agent 会在所选目录里读写文件</p>
      <div class="content"><div class="browser"><div class="crumb"><button class="btn icon-xs ghost" aria-label="上一级">${I('left')}</button>~/workspace</div>
        <div class="list" role="listbox">${dirs.map(([n, m]) => `<button class="r" role="option" aria-selected="${o.pick === n}" data-pick="${n}">${I('folder')}<span class="t">${n}</span><small>${m}</small></button>`).join('')}</div></div></div>
      <div class="foot"><button class="btn ghost" data-oact="nodir">先不选</button><button class="btn primary" data-oact="next" ${o.pick ? '' : 'disabled'}>继续${kbd}</button></div></div>`;
  }
  if (page === 'phone') {
    const done = o.phone === 'done';
    col = `<div class="${cls}"><h1>在手机上接着看</h1><p class="sub">用手机上的 Riffet 扫码，离开电脑也能处理审批</p>
      <div class="content"><div class="pair"><button class="code" data-oact="scanned" aria-label="二维码">${qrSVG()}</button>
        ${done ? `<span class="state ok">${I('check')}Pixel 9 已连接</span>` : `<span class="state">${I('loader', 'spin')}等待扫码</span>`}</div>
        ${done ? '<p class="agent-note">在「技能与工具」里可以让 Agent 操作这台手机</p>' : ''}</div>
      <div class="foot">${done ? '' : '<button class="btn ghost" data-oact="finish">以后再说</button>'}<button class="btn primary" data-oact="finish">完成${kbd}</button></div></div>`;
  }
  $('#onb').classList.remove('leaving');
  $('#onb').innerHTML = top + `<div class="onb-body">${col}</div>`;
}
function onbGo(step) {
  const o = S.onb, pages = onbPages(), at = pages.indexOf(o.page), next = pages[at + step];
  if (!next) return;
  o.dir = step; o.page = next; renderOnb();
}
/* Leaving, by finishing or skipping, lands on the main window with whatever is already done. */
function leaveOnb() {
  const o = S.onb, d = S.desk, pages = onbPages(), at = pages.indexOf(o.page), finished = o.page === 'phone';
  const past = (p) => pages.indexOf(p) >= 0 ? at > pages.indexOf(p) || finished : at > pages.indexOf('server');
  d.firstDraw = false; d.route = 'home';
  d.server = at > 1 ? 'done' : 'open';
  d.agent = d.server !== 'done' ? 'pending' : agentsFound() ? 'done' : 'open';
  d.agentName = AGENTS[S.agents === 'many' ? o.agent : 'claude'][0];
  d.project = d.agent !== 'done' ? 'pending' : past('project') ? 'done' : 'open';
  d.projectName = d.project === 'done' ? (o.pick || '') : '';
  $('#onb').classList.add('leaving');
  setTimeout(() => {
    setScene('desk');
    const sc = $('#scene-desk'); sc.classList.add('entering'); setTimeout(() => sc.classList.remove('entering'), 600);
  }, 240);
}

/* ---------- phones ---------- */
const status = () => `<div class="p-status"><span>9:41</span><span class="sig"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i></span></div>`;
const TABS = [['new', 'plus', '新会话'], ['assistant', 'bot', '助理'], ['tasks', 'list', '任务'], ['settings', 'more', '设置']];
const tabbar = (cur) => `<nav class="tabbar">${TABS.map(([id, ic, l]) => `<button ${cur === id ? 'aria-current="page"' : ''}>${I(ic)}<span>${l}</span></button>`).join('')}</nav><div class="p-home"></div>`;
const phoneValues = () => ({ server: 'MacBook Pro', agent: 'Claude Code', project: S.phone.projectName || '无项目' });
function phoneBody() {
  const p = S.phone;
  if (p.server === 'open') return `<div class="step-body"><button class="p-btn primary" data-pact="scan">${I('scan')}扫码配对</button>
    <div class="found">${I('wifi')}<span class="b">MacBook Pro<small>192.168.1.8</small></span><button class="btn secondary" data-pact="lan">连接</button></div></div>`;
  if (p.server === 'busy') return `<div class="step-body"><div class="what fg-3">在 MacBook Pro 上允许这台手机</div></div>`;
  if (p.project === 'open') return `<div class="step-body"><div class="what">Agent 会在所选目录里读写文件</div><div style="display:flex;gap:8px"><button class="p-btn secondary" data-pact="pskip" style="flex:1">跳过</button><button class="p-btn primary" data-pact="ppick" style="flex:2">选择项目</button></div></div>`;
  return '';
}
function phoneOnbStrip() {
  const top = (n) => `<div class="top"><span class="progress">${n ? [1, 2].map(k => `<i class="${k <= n ? 'on' : ''}"></i>`).join('') : ''}</span><button class="btn xs quiet" style="font-size:15px">跳过</button></div>`;
  const shell = (cap, inner, tab) => `<div class="phone-wrap"><div class="phone">${status()}${inner}${tab || '<div class="p-home"></div>'}</div><span class="phone-cap">${cap}</span></div>`;
  const welcome = shell('欢迎：标志描画一次', `<div class="p-onb">${top(0)}<div class="pc center">${mark(true)}<div class="brand">Riffet</div><p class="sub">在任何设备上查看和接手<br>电脑上的编程 Agent</p></div>
    <div class="bottom"><button class="p-btn primary">开始</button></div></div>`);
  const connect = shell('连接：扫码，或局域网里找到的那一台', `<div class="p-onb">${top(1)}<div class="pc"><h1>连接你的电脑</h1><p class="sub">二维码在电脑上 Riffet 设置的「设备管理」里</p>
    <div class="found">${I('wifi')}<span class="b">MacBook Pro<small>192.168.1.8</small></span><button class="btn secondary">连接</button></div></div>
    <div class="bottom"><button class="p-btn primary">${I('scan')}扫码配对</button><button class="p-btn ghost">输入地址</button></div></div>`);
  const notify = shell('通知：审批要靠它', `<div class="p-onb">${top(2)}<div class="pc"><h1>需要你时通知你</h1><p class="sub">Agent 等待审批、提问或完成时</p>
    <div class="notif"><span class="ic">${mark(false).replace('<svg', '<svg style="width:22px;height:22px;color:#fff"')}</span><span class="b"><b>kiln · 运行命令</b><br><span>pnpm install 等待确认</span></span></div></div>
    <div class="bottom"><button class="p-btn primary">允许通知</button><button class="p-btn ghost">以后再说</button></div></div>`);
  const land = shell('落地：电脑上已有的项目直接可用', `<div class="p-main"><div class="p-hero">${mark(false)}<h1>要在 kiln 做什么？</h1></div>
    <div class="island"><textarea rows="1" placeholder="描述要完成的任务"></textarea><div class="bar"><button class="plus">${I('plus')}</button><button class="capsule">默认</button><span style="flex:1"></span><button class="capsule">${CLAUDE}Sonnet 5.5</button><button class="send" disabled>${I('up')}</button></div></div></div>`, tabbar('new'));
  return welcome + connect + notify + land;
}
function renderPhones() {
  const strip = S.pmode === 'onb';
  $('#phones').classList.toggle('strip', strip);
  if (strip) { $('#phones').innerHTML = phoneOnbStrip(); return; }
  const p = S.phone, ready = p.project === 'done', connected = p.server === 'done';
  const title = ready ? (p.projectName ? `要在 ${p.projectName} 做什么？` : '要做什么？') : '';
  const island = ready ? `<div class="island swap-in"><textarea rows="1" placeholder="描述要完成的任务"></textarea><div class="bar"><button class="plus">${I('plus')}</button><button class="capsule">默认</button><span style="flex:1"></span><button class="capsule">${CLAUDE}Sonnet 5.5</button><button class="send" disabled>${I('up')}</button></div></div>`
    : `<div class="island" id="p-island"><div class="steps">${stepsRow(p, phoneValues())}</div>${phoneBody()}</div>`;
  const sheet = p.sheet === 'projects' ? `<div class="sheet-scrim" data-pact="close"></div><div class="sheet"><div class="grab"></div><h3>选择项目</h3>
    <div>${['kiln', 'riffet-plugins', 'notes'].map(n => `<button class="p-row" data-pproject="${n}" style="width:100%">${I('folder')}<span class="t">${n}</span><span class="v mono" style="font-size:12px">~/workspace/${n}</span></button>`).join('')}</div></div>` : '';
  const a = `<div class="phone-wrap"><div class="phone">${status()}<div class="p-main"><div class="p-hero">${mark(p.firstDraw)}${title ? `<h1>${title}</h1>` : ''}</div>${island}${sheet}</div>${tabbar('new')}</div>
    <span class="phone-cap">新会话 · 跳过后停在这里</span></div>`;
  const b = `<div class="phone-wrap"><div class="phone">${status()}<div class="p-large">任务</div>
      ${connected ? '<div class="p-empty"><span class="fg-3">（已连接时的任务列表）</span></div>' : `<div class="p-empty"><div class="tile">${I('server')}</div><h2>需要连接服务器</h2><button class="p-btn secondary">连接</button></div>`}
      ${tabbar('tasks')}</div><span class="phone-cap">需要服务器的页面</span></div>`;
  const row = (ic, t, v, off) => `<div class="p-row">${I(ic)}<span class="t">${t}</span>${v ? `<span class="v ${off ? 'off' : ''}">${v}</span>` : ''}${I('right')}</div>`;
  const dim = !connected;
  const c = `<div class="phone-wrap"><div class="phone grouped">${status()}<div class="p-large">设置</div><div class="p-list">
      <div class="p-sec">外观</div><div class="p-group">${row('sun', '主题', '跟随系统')}${row('globe', '语言', '简体中文')}${row('bell', '通知', '')}</div>
      <div class="p-sec">访问</div><div class="p-group">${row('server', '服务器', connected ? 'MacBook Pro' : '未连接', dim)}${row('phone', '设备管理', dim ? '未连接' : '', dim)}</div>
      <div class="p-sec">模型</div><div class="p-group">${row('bot', 'Agent', dim ? '未连接' : 'Claude Code', dim)}${row('layers', '模型提供商', dim ? '未连接' : '', dim)}</div>
    </div>${tabbar('settings')}</div><span class="phone-cap">设置：本机部分照常，需要服务器的标出</span></div>`;
  $('#phones').innerHTML = a + b + c;
  p.firstDraw = false;
}
function phoneMorph(fn) {
  const el = $('#p-island'); const from = el ? el.getBoundingClientRect().height : 0;
  fn(); renderPhones();
  const next = $('#p-island') || $('.phone .island'); if (!el || !next) return;
  const to = next.getBoundingClientRect().height;
  next.style.height = from + 'px'; next.style.transition = 'height var(--duration-slow) var(--ease-standard)';
  requestAnimationFrame(() => { next.style.height = to + 'px'; setTimeout(() => { next.style.height = ''; }, 420); });
}

/* ---------- wiring ---------- */
function setScene(s) {
  S.scene = s; closeLayer();
  document.querySelectorAll('.scene').forEach(el => el.classList.toggle('on', el.id === 'scene-' + s));
  document.querySelectorAll('#scene-seg button').forEach(b => b.setAttribute('aria-checked', b.dataset.scene === s));
  $('#desk-ctl').hidden = s !== 'desk' && s !== 'onb'; $('#phone-ctl').hidden = s !== 'phone';
  if (s === 'onb') renderOnb(); if (s === 'desk') renderDesk(); if (s === 'phone') renderPhones();
}
function setTheme(dark) {
  S.dark = dark; document.documentElement.classList.toggle('dark', dark);
  $('#theme').innerHTML = I(dark ? 'sun' : 'moon');
  if (S.desk.settings) renderSettings();
}
function syncSegs() {
  document.querySelectorAll('#agent-seg button').forEach(b => b.setAttribute('aria-checked', b.dataset.agents === S.agents));
  document.querySelectorAll('#phone-seg button').forEach(b => b.setAttribute('aria-checked', b.dataset.pmode === S.pmode));
}
function restart() {
  if (S.scene === 'onb') { S.onb = freshOnb(); return renderOnb(); }
  S.desk = freshDesk(); closeLayer(); renderDesk();
}

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || S.scene !== 'onb' || e.target.closest('input, textarea')) return;
  const primary = document.querySelector('#onb .foot .btn.primary:not(:disabled)');
  if (primary) { e.preventDefault(); primary.click(); }
});

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-close], [data-pact]');
  if (!t) return;
  const d = S.desk, o = S.onb, ds = t.dataset;
  if (ds.scene) return setScene(ds.scene);
  if (ds.pmode) { S.pmode = ds.pmode; syncSegs(); return renderPhones(); }
  if (ds.agents) {
    S.agents = ds.agents; syncSegs();
    if (S.scene === 'onb') { if (o.page === 'agent' && S.agents === 'one') o.page = 'project'; return renderOnb(); }
    if (d.agent === 'open' && agentsFound()) morph(() => { d.agent = 'done'; d.project = 'open'; renderDesk(); });
    return;
  }
  if (t.id === 'replay') return restart();
  if (t.id === 'phone-replay') { S.phone = freshPhone(); return renderPhones(); }
  if (t.id === 'theme') return setTheme(!S.dark);
  if (ds.mode) return setTheme(ds.mode === 'dark');
  if ('close' in ds) { d.settings = null; return closeLayer(); }
  if (ds.server) { o.server = ds.server; return renderOnb(); }
  if (ds.agent) { o.agent = ds.agent; return renderOnb(); }
  if (ds.pick) { o.pick = ds.pick; return renderOnb(); }
  if (ds.oact) switch (ds.oact) {
    case 'next': return onbGo(1);
    case 'back': return onbGo(-1);
    case 'skip': return leaveOnb();
    case 'server': o.serverBusy = true; renderOnb(); return setTimeout(() => { o.serverBusy = false; onbGo(1); }, 1100);
    case 'recheck': if (agentsFound()) return onbGo(1); t.innerHTML = `${I('loader', 'spin')}正在检测`; t.disabled = true; return setTimeout(renderOnb, 900);
    case 'nodir': o.pick = null; return onbGo(1);
    case 'scanned': o.phone = 'done'; return renderOnb();
    case 'finish': return leaveOnb();
  }
  if (ds.route) { if (ds.route === 'more') return; d.route = ds.route; closeLayer(); if (S.scene !== 'desk') return setScene('desk'); return renderDesk(); }
  if (ds.open === 'settings') { d.settings = 'appearance'; return renderSettings(); }
  if (ds.set) { d.settings = ds.set; return renderSettings(); }
  if (ds.dir) { closeLayer(); return morph(() => { d.project = 'done'; d.projectName = ds.dir; renderDesk(); }); }
  switch (ds.act) {
    case 'start': return startServer();
    case 'start-from-settings': d.settings = null; closeLayer(); d.route = 'home'; renderDesk(); return startServer();
    case 'remote': return remoteDialog();
    case 'recheck': if (agentsFound()) morph(() => { d.agent = 'done'; d.project = 'open'; renderDesk(); }); else { morph(() => { d.agent = 'busy'; renderDesk(); }); later(900, () => { d.agent = 'open'; }); } return;
    case 'copy': t.innerHTML = I('check'); setTimeout(() => { t.innerHTML = I('copy'); }, 1200); return;
    case 'pick': return pickDirectory();
    case 'skipdir': return morph(() => { d.project = 'done'; d.projectName = ''; renderDesk(); });
    case 'goconnect': d.settings = null; closeLayer(); d.route = 'home'; d.pulse = true; return renderDesk();
  }
  const p = S.phone;
  switch (ds.pact) {
    case 'scan': case 'lan':
      phoneMorph(() => { p.server = 'busy'; });
      setTimeout(() => phoneMorph(() => { p.server = 'done'; p.agent = 'done'; p.project = 'open'; }), 1500); return;
    case 'ppick': p.sheet = 'projects'; return renderPhones();
    case 'pskip': return phoneMorph(() => { p.project = 'done'; p.projectName = ''; });
    case 'close': p.sheet = null; return renderPhones();
  }
  if (ds.pproject) { p.sheet = null; return phoneMorph(() => { p.project = 'done'; p.projectName = ds.pproject; }); }
});

/* deep links for screenshots: #onb/<page>, #desk[/agent-missing|project|ready|tasks|settings], #phone[/skip] ; ?agents=one|none ; ?dark */
(function boot() {
  const [scene = 'onb', sub = ''] = location.hash.slice(1).split('/');
  const q = new URLSearchParams(location.search);
  if (q.get('agents')) S.agents = q.get('agents');
  if (q.has('dark')) S.dark = true;
  const d = S.desk;
  if (scene === 'onb' && sub) { S.onb.page = sub; if (sub === 'remote') { S.onb.page = 'server'; S.onb.server = 'remote'; } if (sub === 'phone-done') { S.onb.page = 'phone'; S.onb.phone = 'done'; } }
  if (sub === 'agent-missing' && scene === 'desk') { S.agents = 'none'; d.server = 'done'; d.agent = 'open'; }
  if (sub === 'project' && scene === 'desk') { d.server = 'done'; d.agent = 'done'; d.project = 'open'; }
  if (sub === 'ready') { d.server = d.agent = d.project = 'done'; d.projectName = 'kiln'; }
  if (sub === 'tasks') d.route = 'tasks';
  if (sub === 'settings') d.settings = 'agents';
  if (scene === 'phone' && sub === 'skip') S.pmode = 'skip';
  syncSegs(); setTheme(S.dark); setScene(scene);
})();
</script>
</body>
</html>
