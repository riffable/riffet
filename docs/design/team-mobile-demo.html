<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Riffet · 手机团队（原型）</title>
<style>
/*
 * Prototype for the phone's 团队 tab (docs/TEAM.md §5, §8.4). iPhone, Riffet theme: role colours from
 * packages/contracts/src/theme-builtins.generated.ts, type and metrics from iosApp/Riffet/Design/RiffetDesign.swift
 * (body/headline 16, barTitle 17, label 15, caption 13; page inset 16, hit target 44, avatar 44, composer radius 24).
 * Icons are lucide paths; agent marks are scripts/agent-marks/*.svg.
 */
:root {
  color-scheme: light;
  --bg: #ffffff; --bg-sidebar: #f7f8fa; --bg-subtle: #f5f6f8; --bg-muted: #eef0f3; --bg-elevated: #ffffff; --bg-popover: #ffffff;
  --bg-hover: #232d460e; --bg-active: #232d4617; --bg-bubble: #eef3fd;
  --fg: #2a2c2e; --fg-2: #50555d; --fg-3: #60666e; --fg-4: #adb2ba;
  --line: #0f172a14; --line-soft: #0f172a0e; --line-strong: #0f172a21;
  --primary: #15171a; --primary-fg: #ffffff; --accent: #3867f0; --accent-soft: #3867f01a;
  --success: #1f9d55; --warning: #c77f06; --warning-soft: #f59e0b21; --danger: #e0454b; --danger-soft: #e0454b14;
  --agent-claude: #d97757; --agent-codex: #10a37f; --agent-cursor: #3d4451;
  --scrim: rgb(0 0 0 / .22);
  --shadow-float: 0 0 0 .5px rgb(24 24 26 / .08), 0 4px 14px -4px rgb(24 24 26 / .12);
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --font-mono: "SF Mono", ui-monospace, Menlo, monospace;
  --stage: #e9ebef;
}
.dark {
  color-scheme: dark;
  --bg: #141416; --bg-sidebar: #1a1a1d; --bg-subtle: #1d1d20; --bg-muted: #27272b; --bg-elevated: #1f1f22; --bg-popover: #252528;
  --bg-hover: #ffffff0f; --bg-active: #ffffff1a; --bg-bubble: #27282c;
  --fg: #d2d4d7; --fg-2: #b6bac1; --fg-3: #9da2aa; --fg-4: #62666e;
  --line: #ffffff13; --line-soft: #ffffff0d; --line-strong: #ffffff1f;
  --primary: #eceef1; --primary-fg: #141416; --accent: #5b8cff; --accent-soft: #5b8cff26;
  --success: #3fb96f; --warning: #e5a13a; --warning-soft: #e5a13a26; --danger: #f0676c; --danger-soft: #f0676c21;
  --agent-claude: #e8916f; --agent-codex: #2fc79b; --agent-cursor: #c9ced6;
  --scrim: rgb(0 0 0 / .5);
  --shadow-float: 0 0 0 .5px rgb(255 255 255 / .08), 0 6px 18px -6px rgb(0 0 0 / .6);
  --stage: #0b0b0c;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--font-sans); color: var(--fg); background: var(--stage); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- stage ---------- */
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; height: 52px; padding: 0 24px;
  background: color-mix(in srgb, var(--stage) 86%, transparent); backdrop-filter: blur(12px); }
.top h1 { font-size: 14px; font-weight: 600; }
.top .sp { flex: 1; }
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--bg-active); }
.seg button { height: 26px; padding: 0 12px; border-radius: 7px; font-size: 13px; color: var(--fg-3); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.stage { display: flex; gap: 48px; padding: 32px 48px 56px; overflow-x: auto; align-items: flex-start; }
.shot { display: flex; flex-direction: column; gap: 14px; flex: none; width: 375px; }
.cap { font-size: 13px; line-height: 19px; color: var(--fg-2); }
.cap b { display: block; font-size: 14px; font-weight: 600; color: var(--fg); margin-bottom: 2px; }
.cap .n { display: inline-grid; place-items: center; width: 18px; height: 18px; margin-right: 6px; border-radius: 9px; background: var(--fg); color: var(--bg); font-size: 11px; font-weight: 600; vertical-align: 1px; }

/* ---------- phone ---------- */
.phone { position: relative; width: 375px; height: 790px; display: flex; flex-direction: column; overflow: hidden; border-radius: 50px; background: var(--bg);
  box-shadow: 0 0 0 10px #0d0d0f, 0 0 0 11px #2c2c30, 0 30px 60px -24px rgb(0 0 0 / .45); }
.phone.flash { animation: flash 900ms ease; }
@keyframes flash { 0%, 100% { box-shadow: 0 0 0 10px #0d0d0f, 0 0 0 11px #2c2c30, 0 30px 60px -24px rgb(0 0 0 / .45); } 30% { box-shadow: 0 0 0 10px #0d0d0f, 0 0 0 14px var(--accent), 0 30px 60px -24px rgb(0 0 0 / .45); } }
.st { height: 50px; flex: none; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 6px 38px; font-size: 15px; font-weight: 600; }
.st .sig { display: flex; gap: 5px; align-items: center; }
.st .sig i { display: block; width: 3px; border-radius: 1px; background: currentColor; }
.st .bat { width: 24px; height: 12px; border-radius: 4px; border: 1.2px solid currentColor; opacity: .9; position: relative; }
.st .bat::after { content: ""; position: absolute; inset: 1.5px 5px 1.5px 1.5px; border-radius: 2px; background: currentColor; }
.home { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--fg); opacity: .85; z-index: 9; }

/* nav bar: back · title · up to two actions */
.nav { height: 44px; flex: none; display: flex; align-items: center; padding: 0 4px; position: relative; }
.nav .t { position: absolute; left: 64px; right: 64px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 17px; line-height: 22px; font-weight: 600; pointer-events: none; }
.nav .t .sub { font-size: 13px; font-weight: 400; color: var(--fg-3); }
.nav .sp { flex: 1; }
.ib { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 22px; color: var(--fg); }
.ib svg.i { width: 22px; height: 22px; }
.ib.dim { color: var(--fg-4); }
.txtbtn { height: 44px; padding: 0 12px; font-size: 17px; color: var(--fg); }
.txtbtn.strong { font-weight: 600; }
.txtbtn[disabled] { color: var(--fg-4); cursor: default; }

/* avatars: circle, emoji on bg-active, default member is the bot mark (web MemberAvatar) */
.av { flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--bg-active); overflow: hidden; line-height: 1; color: var(--fg-2); }
.av svg.i { stroke-width: 1.5; }

/* ---------- 团队 list ---------- */
.body { flex: 1; min-height: 0; overflow-y: auto; position: relative; }
.body::-webkit-scrollbar { display: none; }
.mrow { display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 0 16px; width: 100%; text-align: left; position: relative; }
.mrow:active { background: var(--bg-hover); }
.mrow + .mrow::before { content: ""; position: absolute; top: 0; left: 72px; right: 0; height: 1px; background: var(--line); }
.mrow .b { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.mrow .l1, .mrow .l2 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mrow .name { font-size: 16px; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow.unread .name { font-weight: 500; }
.mrow .scope { font-size: 13px; line-height: 18px; color: var(--fg-3); white-space: nowrap; flex: none; }
.mrow .time { margin-left: auto; font-size: 13px; color: var(--fg-4); white-space: nowrap; flex: none; }
.mrow .pre { flex: 1; min-width: 0; font-size: 14px; line-height: 20px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow.unread .pre { color: var(--fg-2); }
.mrow .slot { flex: none; width: 18px; height: 18px; display: grid; place-items: center; }
.dot { width: 8px; height: 8px; border-radius: 4px; background: var(--fg); }
.tag-wait { flex: none; height: 20px; padding: 0 6px; border-radius: 6px; font-size: 12px; line-height: 18px; color: var(--warning); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warning) 55%, transparent); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 1.6px solid var(--line-strong); border-top-color: var(--fg-2); animation: spin 900ms linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.pin { width: 12px; height: 12px; color: var(--fg-4); }

/* floating tab bar (iOS 26: icons only, glass capsule) */
.tabbar { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; border-radius: 32px; z-index: 6;
  background: color-mix(in srgb, var(--bg-elevated) 72%, transparent); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6);
  box-shadow: inset 0 0 0 1px var(--line-strong), var(--shadow-float); }
.tabbar span { width: 64px; height: 52px; display: grid; place-items: center; border-radius: 26px; color: var(--fg-3); }
.tabbar span.on { color: var(--fg); background: var(--bg-active); }
.tabbar svg.i { width: 24px; height: 24px; }
.tabbar .badge { position: relative; }
.tabbar .badge::after { content: "2"; position: absolute; top: 8px; right: 12px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--danger); color: #fff; font-size: 11px; line-height: 16px; font-weight: 600; text-align: center; }

/* ---------- conversation ---------- */
.conv { padding: 8px 16px 140px; }
.turn + .turn { margin-top: 28px; }
.umsg { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.bubble { max-width: 86%; font-size: 16px; line-height: 23px; border-radius: 20px; padding: 9px 14px; background: var(--bg-bubble); }
.bubble.peer { background: var(--bg-muted); }
.meta { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg-3); padding-right: 4px; }
.mention { font-weight: 500; }
.md { font-size: 16px; line-height: 26px; }
.md p + p, .md p + ul, .md ul + p { margin-top: 10px; }
.md ul { padding-left: 20px; }
.md code { font-family: var(--font-mono); font-size: .86em; color: var(--fg-2); }
.tool { display: flex; align-items: center; gap: 8px; min-height: 36px; font-size: 15px; color: var(--fg-2); margin: 6px 0; }
.tool .tt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool svg.i { width: 16px; height: 16px; color: var(--fg-3); }
.tool .chev { color: var(--fg-4); }
.check { color: var(--success) !important; }

/* composer island */
.composer { position: absolute; left: 10px; right: 10px; bottom: 26px; border-radius: 24px; padding: 6px 6px 6px 6px; z-index: 6;
  background: color-mix(in srgb, var(--bg-elevated) 74%, transparent); backdrop-filter: blur(20px) saturate(1.5); -webkit-backdrop-filter: blur(20px) saturate(1.5);
  box-shadow: inset 0 0 0 1px var(--line-strong), var(--shadow-float); }
.composer .txt { min-height: 40px; padding: 9px 10px 3px; font-size: 16px; line-height: 23px; color: var(--fg-4); }
.composer .txt.typed { color: var(--fg); }
.composer .caret { display: inline-block; width: 2px; height: 20px; margin-left: 1px; vertical-align: -4px; background: var(--accent); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.composer .row { display: flex; align-items: center; gap: 4px; }
.composer .row .sp { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 10px; border-radius: 17px; font-size: 15px; color: var(--fg-2); }
.chip svg.i { width: 14px; height: 14px; color: var(--fg-3); }
.round { width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; color: var(--fg-2); }
.send { width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; background: var(--primary); color: var(--primary-fg); }
.send.off { background: var(--bg-active); color: var(--fg-4); }
.send svg.i { width: 18px; height: 18px; stroke-width: 2; }
.mark { width: 14px; height: 14px; flex: none; }

/* ---------- fresh member page ---------- */
.prof { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 32px 20px; text-align: center; }
.prof .nm { font-size: 20px; line-height: 26px; font-weight: 600; }
.prof .ds { font-size: 14px; line-height: 20px; color: var(--fg-3); }
.sec { padding: 16px 16px 6px; font-size: 13px; line-height: 18px; color: var(--fg-3); }
.srow { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; position: relative; }
.srow + .srow::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--line); }
.srow .b { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.srow .tt { font-size: 16px; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .x { display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; color: var(--fg-3); white-space: nowrap; overflow: hidden; }
.srow .end { flex: none; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg-4); }

/* ---------- pane (bottom sheet) ---------- */
.dim { position: absolute; inset: 0; background: var(--scrim); z-index: 7; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 64px; z-index: 8; background: var(--bg-sidebar); border-radius: 24px 24px 0 0; display: flex; flex-direction: column; overflow: hidden; }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--fg-4); opacity: .6; margin: 6px auto 0; flex: none; }
.ph { display: flex; align-items: flex-start; gap: 12px; padding: 10px 8px 12px 16px; flex: none; }
.ph .b { flex: 1; min-width: 0; padding-top: 2px; }
.ph .nm { font-size: 17px; line-height: 22px; font-weight: 600; }
.ph .ds { font-size: 13px; line-height: 18px; color: var(--fg-3); margin-top: 2px; }
.pbody { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 40px; display: flex; flex-direction: column; gap: 16px; }
.pbody::-webkit-scrollbar { display: none; }
.card { background: var(--bg-elevated); border-radius: 16px; overflow: hidden; }
.abar { display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; }
.abar span { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0 8px; border-radius: 12px; font-size: 13px; color: var(--fg-2); }
.abar svg.i { width: 22px; height: 22px; color: var(--fg); }
.ptitle { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px 6px; font-size: 13px; color: var(--fg-3); }
.prow { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 16px; position: relative; font-size: 16px; }
.prow + .prow::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--line); }
.prow .b { flex: 1; min-width: 0; }
.prow .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 22px; }
.prow .x { font-size: 13px; line-height: 18px; color: var(--fg-3); display: flex; align-items: center; gap: 5px; }
.prow .v { color: var(--fg-3); font-size: 16px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.prow .chev { width: 14px; height: 14px; color: var(--fg-4); }
.prow .stop { font-size: 15px; color: var(--danger); }
.prow.more { color: var(--fg-2); }
.cur { font-size: 12px; color: var(--fg-3); padding: 1px 6px; border-radius: 6px; background: var(--bg-active); }

/* ---------- @ menu ---------- */
.menu { position: absolute; left: 10px; right: 10px; bottom: 404px; z-index: 6; border-radius: 16px; background: var(--bg-popover); box-shadow: var(--shadow-float), 0 0 0 1px var(--line); padding: 6px; }
.menu .h { padding: 6px 10px 2px; font-size: 13px; color: var(--fg-3); }
.menu .it { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 10px; font-size: 16px; }
.menu .it.on { background: var(--bg-active); }
.menu .it .x { margin-left: auto; font-size: 13px; color: var(--fg-3); }
.menu .sep { height: 1px; background: var(--line); margin: 4px 10px; }
.kbd { position: absolute; left: 0; right: 0; bottom: 0; height: 290px; z-index: 5; background: color-mix(in srgb, var(--bg-muted) 92%, var(--fg) 4%); padding: 10px 4px 0; display: flex; flex-direction: column; gap: 11px; }
.kbd .kr { display: flex; justify-content: center; gap: 6px; }
.kbd i { display: block; width: 31px; height: 42px; border-radius: 6px; background: var(--bg-elevated); box-shadow: 0 1px 0 rgb(0 0 0 / .18); }
.kbd i.w { width: 180px; }
.kbd i.m { width: 46px; background: var(--bg-active); }
.phone.typing .composer { bottom: 298px; }

/* ---------- edit page (新建成员) ---------- */
.grouped { background: var(--bg-sidebar); }
.form { padding: 0 16px 40px; display: flex; flex-direction: column; gap: 22px; }
.avpick { display: flex; justify-content: center; padding: 12px 0 0; position: relative; }
.avpick .edit { position: absolute; left: calc(50% + 22px); bottom: -2px; width: 28px; height: 28px; border-radius: 14px; display: grid; place-items: center; background: var(--bg-elevated); box-shadow: 0 0 0 1px var(--line-strong); color: var(--fg-2); }
.avpick .edit svg.i { width: 15px; height: 15px; }
.field { display: flex; align-items: center; min-height: 52px; padding: 0 16px; font-size: 16px; position: relative; gap: 12px; }
.field + .field::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--line); }
.field .lab { flex: none; width: 72px; }
.field .in { flex: 1; color: var(--fg); }
.field .in.ph { color: var(--fg-4); }
.field .val { margin-left: auto; color: var(--fg-3); display: flex; align-items: center; gap: 6px; }
.field .chev { width: 14px; height: 14px; color: var(--fg-4); }
.area { min-height: 132px; padding: 14px 16px; font-size: 16px; line-height: 23px; color: var(--fg); }
.foot { padding: 6px 16px 0; font-size: 13px; line-height: 18px; color: var(--fg-3); }
.gtitle { padding: 0 16px 6px; font-size: 13px; color: var(--fg-3); }

/* small helper */
.row { display: flex; align-items: center; }
</style>
</head>
<body>
<div class="top">
  <h1>手机 · 团队</h1>
  <span class="sp"></span>
  <div class="seg" role="group" aria-label="外观">
    <button aria-pressed="true" data-mode="light">浅色</button>
    <button aria-pressed="false" data-mode="dark">深色</button>
  </div>
</div>

<div class="stage" id="stage"></div>

<script>
/* ---------- icons ---------- */
const P = {

  chevD: '<path d="m6 9 6 6 6-6"/>',
  up: '<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',

  checklist: '<path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>',
  gear: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',

/* ---------- 6 · 只有默认成员 ---------- */
const single = () => teamList([{ id: 'default', time: '10:42', pre: '明早 9 点提醒你看 #815 的进展', go: 'chat' }]);

/* ---------- stage ---------- */
const SHOTS = [
  ['team', '团队', '标签根页是成员列表，像聊天软件的会话列表。顺序与 Web 侧栏一致（置顶 → 默认成员 → 创建时间），不随活动重排。行尾一个标记：运行中转圈、待确认、未读圆点。', teamList([
    { id: 'default', time: '10:42', pre: '明早 9 点提醒你看 #815 的进展', state: 'unread', go: 'chat' },
    { id: 'invest', time: '10:05', pre: '财报前把仓位降到三成？', state: 'waiting', pinned: false },
    { id: 'qa', time: '2 分钟', pre: '核对 a3f9e21：主分支增量回归', state: 'running', go: 'fresh' },
    { id: 'scm', time: '周一', pre: 'v2.14.0 构建与上传完成' },
    { id: 'read', time: '11月20日', pre: '《系统之美》第 4 章的笔记已整理' },
  ])],
  ['chat', '连续对话的成员', '点进去直接是主对话（沿用现在的个人助理页）。页头是头像和名字，右侧打开详情面板。别的成员回来的结果按来信显示：灰底气泡，下方是发送者头像和名字。', continuousConv()],
  ['fresh', '每次新建的成员', '页面是它的历次会话，按日期分组；底部输入框每发一条开一条新会话。副标题写是谁发起的：你、自动、或哪个成员调用。', freshHome()],
  ['pane', '会话详情面板', '成员的东西都在这里：记忆、规则、能力、文件；它的其他会话（含别的成员调用它的）；Agent、范围、委托；低频操作。不放配置表单。', pane()],
  ['mention', '@ 成员', '输入框的 @ 菜单里成员排在 Agent 前面，绑定项目的标出项目名。发出去是一次调用，结果回到当前对话。', continuousConv({ typing: true })],
  ['create', '新建成员', '只填五项：头像、名称、职责、范围（个人 / 项目 / 全局）、会话方式和 Agent。能力开关与每日上限按范围取默认值，要改去 Web。', create()],
  ['single', '只有一个成员时', '仍然是列表，不直接跳进对话：加第二个成员时页面不换类型，「＋」始终在同一处。切走再回来，标签停在上次打开的对话里。', single()],
];
const only = new URLSearchParams(location.search).get('shot');
document.getElementById('stage').innerHTML = SHOTS.map((s, i) => [...s, i]).filter(([id]) => !only || only.split(',').includes(id)).map(([id, title, cap, html, i]) =>
  `<div class="shot" id="shot-${id}">${html}<div class="cap"><b><span class="n">${i + 1}</span>${title}</b>${cap}</div></div>`).join('');

document.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]')?.dataset.go;
  if (!go) return;
  const shot = document.getElementById('shot-' + go);
  if (!shot) return;
  shot.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  const phone = shot.querySelector('.phone');
  phone.classList.remove('flash'); void phone.offsetWidth; phone.classList.add('flash');
});
document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => {
  document.documentElement.classList.toggle('dark', b.dataset.mode === 'dark');
  document.querySelectorAll('[data-mode]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
}));
if (location.hash === '#dark') document.querySelector('[data-mode="dark"]').click();
</script>
</body>
