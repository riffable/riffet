<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Riffet · Web 设置布局对比原型</title>
<style>
/*
 * Interactive layout comparison prototype for Web Settings:
 *   - Current: 1080×820 workspace modal over the workbench
 *   - Option A: Full page with main sidebar kept + borderless in-page aside (same as PluginsPage)
 *   - Option B: Full page with main sidebar swapped to settings navigation (Linear / Slack style)
 *
 * Role tokens match apps/web/src/styles/index.css (Riffet style, light & dark).
 */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --bg-sidebar: #f7f8fa;
  --bg-subtle: #f5f6f8;
  --bg-muted: #eef0f3;
  --bg-elevated: #ffffff;
  --bg-popover: #ffffff;
  --bg-hover: rgb(35 45 70 / 0.055);
  --bg-active: rgb(35 45 70 / 0.09);
  --bg-bubble: #eef3fd;
  --fg: #2a2c2e;
  --fg-2: #50555d;
  --fg-3: #60666e;
  --fg-4: #adb2ba;
  --line: rgb(15 23 42 / 0.08);
  --line-soft: rgb(15 23 42 / 0.055);
  --line-strong: rgb(15 23 42 / 0.13);
  --primary: #15171a;
  --primary-hover: #34373d;
  --primary-fg: #ffffff;
  --secondary-bg: rgb(21 23 26 / 0.07);
  --secondary-hover: rgb(21 23 26 / 0.11);
  --accent: #3867f0;
  --accent-soft: rgb(56 103 240 / 0.1);
  --success: #1f9d55;
  --success-soft: rgb(31 157 85 / 0.1);
  --warning: #c77f06;
  --warning-soft: rgb(245 158 11 / 0.13);
  --danger: #e0454b;
  --danger-soft: rgb(224 69 75 / 0.08);
  --chart-1: #3867f0;
  --chart-2: #15968f;
  --chart-3: #ba733c;
  --chart-4: #8566c1;
  --agent-claude: #d97757;
  --agent-codex: #10a37f;
  --agent-cursor: #3d4451;
  --agent-pi: #6d5ce7;
  --shadow-soft: 0 1px 2px rgb(15 23 42 / 0.03), 0 3px 10px -4px rgb(15 23 42 / 0.05);
  --shadow-pop: 0 0 0 0.5px rgb(15 23 42 / 0.1), 0 8px 24px -8px rgb(15 23 42 / 0.14), 0 2px 5px -2px rgb(15 23 42 / 0.05);
  --shadow-composer: 0 0 0 0.5px rgb(24 24 26 / 0.08), 0 2px 4px rgb(24 24 26 / 0.03), 0 10px 28px -12px rgb(24 24 26 / 0.14);
  --scrim: rgb(0 0 0 / 0.25);
  --focus-ring: color-mix(in srgb, var(--accent) 50%, transparent);
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --duration-fast: 150ms;
  --duration-base: 200ms;
  --font-sans: "Inter Variable", "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
}

.dark {
  color-scheme: dark;
  --bg: #141416;
  --bg-sidebar: #1a1a1d;
  --bg-subtle: #1d1d20;
  --bg-muted: #27272b;
  --bg-elevated: #1f1f22;
  --bg-popover: #252528;
  --bg-hover: rgb(255 255 255 / 0.06);
  --bg-active: rgb(255 255 255 / 0.1);
  --bg-bubble: #27282c;
  --fg: #d2d4d7;
  --fg-2: #b6bac1;
  --fg-3: #9da2aa;
  --fg-4: #62666e;
  --line: rgb(255 255 255 / 0.075);
  --line-soft: rgb(255 255 255 / 0.05);
  --line-strong: rgb(255 255 255 / 0.12);
  --primary: #eceef1;
  --primary-hover: #d3d6db;
  --primary-fg: #141416;
  --secondary-bg: rgb(255 255 255 / 0.08);
  --secondary-hover: rgb(255 255 255 / 0.13);
  --accent: #5b8cff;
  --accent-soft: rgb(91 140 255 / 0.15);
  --success: #3fb96f;
  --success-soft: rgb(63 185 111 / 0.14);
  --warning: #e5a13a;
  --warning-soft: rgb(229 161 58 / 0.15);
  --danger: #f0676c;
  --danger-soft: rgb(240 103 108 / 0.13);
  --chart-1: #5b8cff;
  --chart-2: #2eb8ac;
  --chart-3: #d99156;
  --chart-4: #a58be0;
  --agent-claude: #e8916f;
  --agent-codex: #28be94;
  --agent-cursor: #b4bac4;
  --agent-pi: #9b8cf5;
  --shadow-soft: 0 1px 2px rgb(0 0 0 / 0.22);
  --shadow-pop: 0 0 0 0.5px rgb(255 255 255 / 0.09), 0 12px 32px -10px rgb(0 0 0 / 0.6);
  --shadow-composer: 0 0 0 0.5px rgb(255 255 255 / 0.08), 0 10px 28px -12px rgb(0 0 0 / 0.7);
  --scrim: rgb(0 0 0 / 0.5);
}

/* Optional warm paper theme preview */
[data-palette="paper"]:not(.dark) {
  --bg: #fcfaf6;
  --bg-sidebar: #f4f1ea;
  --bg-subtle: #f1ede4;
  --bg-muted: #eae5da;
  --bg-elevated: #fdfbf7;
  --bg-popover: #fdfbf7;
  --bg-bubble: #efeae0;
  --accent: #a65c2e;
  --accent-soft: rgb(166 92 46 / 0.12);
}
[data-palette="paper"].dark {
  --bg: #171513;
  --bg-sidebar: #1d1a17;
  --bg-subtle: #211e1b;
  --bg-muted: #2a2622;
  --bg-elevated: #221f1b;
  --bg-popover: #292521;
  --bg-bubble: #2d2823;
  --accent: #d8905c;
  --accent-soft: rgb(216 144 92 / 0.16);
}
[data-palette="slate"]:not(.dark) {
  --bg: #fbfcfd;
  --bg-sidebar: #f1f4f8;
  --bg-subtle: #edf1f6;
  --bg-muted: #e4e9f0;
  --bg-elevated: #ffffff;
  --accent: #2c6e7f;
  --accent-soft: rgb(44 110 127 / 0.11);
}
[data-palette="slate"].dark {
  --bg: #12151a;
  --bg-sidebar: #171b22;
  --bg-subtle: #1b2029;
  --bg-muted: #232a35;
  --bg-elevated: #1c212a;
  --accent: #5baec2;
  --accent-soft: rgb(91 174 194 / 0.16);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: #0d0e11;
  color: var(--fg);
  font: 13px/20px var(--font-sans);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }

svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
svg.i * { vector-effect: non-scaling-stroke; }
svg.i-sm { width: 14px; height: 14px; }
svg.i-xs { width: 12px; height: 12px; }
.mono { font-family: var(--font-mono); }
.tnum { font-variant-numeric: tabular-nums; }
.trunc { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ================= Prototype Comparison Control Bar ================= */
.proto-bar {
  flex: none;
  height: 48px;
  padding: 0 16px;
  background: #16181d;
  color: #e2e5ea;
  border-bottom: 1px solid rgb(255 255 255 / 0.08);
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 12px;
  user-select: none;
  overflow-x: auto;
  z-index: 100;
}
.proto-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  color: #fff;
  white-space: nowrap;
}
.proto-tag {
  padding: 2px 6px;
  border-radius: 5px;
  background: rgb(255 255 255 / 0.1);
  color: #b7bec9;
  font-size: 11px;
  font-weight: 500;
}
.proto-seg {
  display: inline-flex;
  align-items: center;
  background: rgb(255 255 255 / 0.07);
  padding: 3px;
  border-radius: 8px;
  gap: 2px;
  flex: none;
}
.proto-seg button {
  height: 26px;
  padding: 0 10px;
  border-radius: 6px;
  color: #aeb5c0;
  font-weight: 500;
  white-space: nowrap;
  transition: background-color 140ms var(--ease-standard), color 140ms var(--ease-standard);
}
.proto-seg button:hover { color: #fff; }
.proto-seg button.active {
  background: #ffffff;
  color: #14161a;
}
.proto-sep { width: 1px; height: 18px; background: rgb(255 255 255 / 0.1); flex: none; }
.proto-metrics {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  color: #9ba3af;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.proto-metrics strong { color: #f3f5f8; font-weight: 600; }
.proto-chip {
  height: 28px;
  padding: 0 10px;
  border-radius: 7px;
  background: rgb(255 255 255 / 0.08);
  color: #e2e5ea;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 500;
  flex: none;
}
.proto-chip:hover { background: rgb(255 255 255 / 0.14); }

/* ================= Stage Frame (Viewport Simulator) ================= */
.stage-wrap {
  flex: 1;
  min-height: 0;
  display: flex;
  justify-content: center;
  align-items: stretch;
  background: #0d0e11;
  overflow: auto;
  padding: 0;
}
.stage-wrap.framed { padding: 14px; }
.viewport {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 620px;
  background: var(--bg-sidebar);
  color: var(--fg);
  display: flex;
  overflow: hidden;
}
.stage-wrap.framed .viewport {
  border-radius: 14px;
  box-shadow: 0 0 0 1px rgb(255 255 255 / 0.12), 0 24px 64px -16px rgb(0 0 0 / 0.7);
}

/* ================= Workbench Shell (Riffet Style) ================= */
.wb-sidebar {
  width: 268px;
  flex: none;
  background: var(--bg-sidebar);
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 8px;
  gap: 4px;
  user-select: none;
}
.wb-main-wrap {
  flex: 1;
  min-width: 0;
  min-height: 0;
  padding: 8px 8px 8px 0;
  display: flex;
}
.wb-main {
  flex: 1;
  min-width: 0;
  min-height: 0;
  background: var(--bg);
  border-radius: 12px;
  box-shadow: 0 0 0 1px var(--line);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* ListRow */
.list-row {
  height: 32px;
  padding: 0 8px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--fg-2);
  font-size: 13px;
  width: 100%;
  transition: background-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}
.list-row:hover { background: var(--bg-hover); color: var(--fg); }
.list-row.selected { background: var(--bg-active); color: var(--fg); font-weight: 500; }
.list-row .leading { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; flex: none; color: var(--fg-3); }
.list-row.selected .leading { color: var(--fg); }
.list-row .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-row .meta { font-size: 11px; color: var(--fg-4); flex: none; font-variant-numeric: tabular-nums; }

.nav-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-right: 2px;
}
.nav-group-title {
  padding: 10px 8px 4px;
  font-size: 11px;
  font-weight: 500;
  color: var(--fg-4);
}
.nav-group:first-child .nav-group-title { padding-top: 4px; }

.wb-footer {
  flex: none;
  padding-top: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.avatar-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 4px 8px 4px 4px;
  border-radius: 8px;
  color: var(--fg-2);
}
.avatar-btn:hover { background: var(--bg-hover); color: var(--fg); }
.avatar {
  width: 26px;
  height: 26px;
  border-radius: 999px;
  background: var(--primary);
  color: var(--primary-fg);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
}

/* Status indicators in session sidebar */
.dot-unread { width: 7px; height: 7px; border-radius: 99px; background: var(--accent); }
.ring-spin {
  width: 13px;
  height: 13px;
  border-radius: 99px;
  border: 1.5px solid var(--accent-soft);
  border-top-color: var(--accent);
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ================= Underlying Chat Session (Visible in Current Modal or when Returning) ================= */
.chat-header {
  height: 48px;
  padding: 0 16px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: none;
}
.chat-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 28px 32px 120px;
}
.chat-col { max-width: 740px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.bubble-user {
  align-self: flex-end;
  background: var(--bg-bubble);
  padding: 10px 14px;
  border-radius: 12px;
  max-width: 78%;
  font-size: 14px;
  line-height: 22px;
}
.msg-ai { font-size: 14px; line-height: 23px; color: var(--fg); }
.msg-ai p { margin: 0 0 10px; }
.msg-ai code { font-family: var(--font-mono); font-size: 0.86em; color: var(--fg-2); }
.tool-line {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  color: var(--fg-3);
  padding: 3px 0;
}
.tool-verb { font-family: var(--font-mono); min-width: 48px; color: var(--fg-2); font-weight: 500; }
.code-block {
  background: var(--bg-subtle);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 19px;
  color: var(--fg-2);
  overflow-x: auto;
}
.composer-float {
  position: absolute;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  width: min(740px, calc(100% - 48px));
  background: var(--bg-elevated);
  border-radius: 16px;
  box-shadow: var(--shadow-composer);
  padding: 12px 14px 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.composer-placeholder { color: var(--fg-4); font-size: 14px; }
.composer-tools { display: flex; align-items: center; gap: 8px; }

/* ================= Shared UI Components ================= */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 30px;
  padding: 0 11px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  flex: none;
  transition: background-color var(--duration-fast) var(--ease-standard), transform var(--duration-fast) var(--ease-standard);
}
.btn:active { transform: scale(0.97); }
.btn-xs { height: 26px; padding: 0 9px; font-size: 12px; border-radius: 7px; }
.btn-primary { background: var(--primary); color: var(--primary-fg); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-secondary { background: var(--secondary-bg); color: var(--fg); }
.btn-secondary:hover { background: var(--secondary-hover); }
.btn-quiet { background: transparent; color: var(--fg-2); }
.btn-quiet:hover { background: var(--bg-hover); color: var(--fg); }
.btn-danger { background: var(--danger-soft); color: var(--danger); }
.btn-icon { width: 28px; height: 28px; padding: 0; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 20px;
  padding: 0 7px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 500;
  background: var(--bg-muted);
  color: var(--fg-2);
  white-space: nowrap;
}
.badge-success { background: var(--success-soft); color: var(--success); }
.badge-warning { background: var(--warning-soft); color: var(--warning); }
.badge-danger { background: var(--danger-soft); color: var(--danger); }
.badge-accent { background: var(--accent-soft); color: var(--accent); }

.input, .select {
  height: 32px;
  border-radius: 8px;
  border: 1px solid var(--line-strong);
  background: var(--bg);
  padding: 0 10px;
  font-size: 13px;
  color: var(--fg);
  outline: none;
}
.input:focus, .select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.search-box {
  position: relative;
  display: flex;
  align-items: center;
}
.search-box .search-ic {
  position: absolute;
  left: 9px;
  color: var(--fg-4);
  pointer-events: none;
}
.search-box input {
  width: 100%;
  height: 30px;
  padding: 0 26px 0 28px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg);
  font-size: 12.5px;
  outline: none;
}
.search-box input:focus { border-color: var(--line-strong); }
.search-box .clear-btn {
  position: absolute;
  right: 5px;
  width: 20px;
  height: 20px;
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--fg-4);
}
.search-box .clear-btn:hover { background: var(--bg-hover); color: var(--fg); }

.switch {
  width: 34px;
  height: 20px;
  border-radius: 99px;
  background: var(--bg-muted);
  border: 1px solid var(--line-strong);
  padding: 2px;
  display: inline-flex;
  align-items: center;
  transition: background-color 140ms var(--ease-standard), border-color 140ms var(--ease-standard);
  flex: none;
}
.switch[aria-checked="true"] {
  background: var(--primary);
  border-color: var(--primary);
}
.switch::after {
  content: "";
  width: 14px;
  height: 14px;
  border-radius: 99px;
  background: var(--bg);
  box-shadow: 0 1px 2px rgb(0 0 0 / 0.18);
  transform: translateX(0);
  transition: transform 140ms var(--ease-standard);
}
.switch[aria-checked="true"]::after {
  background: var(--primary-fg);
  transform: translateX(14px);
}

.segmented {
  display: inline-flex;
  padding: 2px;
  border-radius: 8px;
  background: var(--bg-subtle);
  border: 1px solid var(--line);
  gap: 2px;
}
.segmented button {
  height: 26px;
  padding: 0 10px;
  border-radius: 6px;
  font-size: 12.5px;
  color: var(--fg-3);
  font-weight: 500;
}
.segmented button:hover { color: var(--fg); }
.segmented button.active {
  background: var(--bg-elevated);
  color: var(--fg);
  box-shadow: var(--shadow-soft);
}

.underline-tabs {
  display: flex;
  align-items: center;
  gap: 18px;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
}
.underline-tabs button {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 38px;
  font-size: 13px;
  color: var(--fg-3);
  white-space: nowrap;
  flex: none;
}
.underline-tabs button:hover { color: var(--fg); }
.underline-tabs button.active { color: var(--fg); font-weight: 500; }
.underline-tabs button.active::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 2px;
  background: var(--fg);
  border-radius: 2px;
}

/* SettingsGroup & SettingsRow */
.s-group { display: flex; flex-direction: column; }
.s-group-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 28px;
  margin-bottom: 4px;
}
.s-group-title { font-size: 12px; font-weight: 500; color: var(--fg-3); margin: 0; }
.s-card {
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0 16px;
  display: flex;
  flex-direction: column;
}
.s-card > * + * { border-top: 1px solid var(--line); }
.s-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 13px 0;
}
.s-row-text { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.s-row-title { font-size: 13.5px; font-weight: 500; color: var(--fg); }
.s-row-desc { font-size: 12px; color: var(--fg-3); }
.s-group-note { font-size: 12px; color: var(--fg-3); margin: 8px 2px 0; }

/* ================= Layout 1: Current Modal (1080×820) ================= */
.modal-scrim {
  position: absolute;
  inset: 0;
  background: var(--scrim);
  backdrop-filter: blur(1.5px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 40;
}
.modal-box {
  width: min(1080px, calc(100% - 0px));
  height: min(820px, calc(100% - 0px));
  background: var(--bg-elevated);
  border-radius: 16px;
  box-shadow: var(--shadow-pop);
  border: 1px solid var(--line);
  display: flex;
  overflow: hidden;
}
.modal-nav {
  width: 208px;
  flex: none;
  background: var(--bg-subtle);
  border-right: 1px solid var(--line);
  padding: 10px 8px;

// ==================== Actions ====================
function setMode(mode) {
  state.mode = mode;
  state.inSettings = true;
  state.nestedDialog = null;
  render();
}
function setViewport(vp) {
  state.viewport = vp;
  render();
}
function toggleDark() {
  state.dark = !state.dark;
  document.documentElement.classList.toggle('dark', state.dark);
  render();
}
function setPalette(p) {
  state.palette = p;
  document.documentElement.setAttribute('data-palette', p);
  render();
}
function toggleCallout() {
  state.showCallout = !state.showCallout;
  render();
}
function openSettings(sec) {
  if (sec) state.section = sec;
  state.inSettings = true;
  state.editingProviderId = null;
  state.nestedDialog = null;
  render();
}
function closeSettings() {
  state.inSettings = false;
  state.nestedDialog = null;
  render();
}
function selectSection(id) {
  state.section = id;
  state.editingProviderId = null;
  state.nestedDialog = null;
  render();
}
function setSearch(val) {
  state.search = val;
  renderSettingsNavOnly();
}
function clearSearch() {
  state.search = '';
  render();
}
function selectAgent(id) {
  state.selectedAgent = id;
  state.editingProviderId = null;
  render();
}
function openProvider(id) {
  if (state.mode === 'current') {
    state.editingProviderId = id;
    state.nestedDialog = 'provider-modal';
  } else {
    state.editingProviderId = id;
  }
  render();
}
function closeProvider() {
  state.editingProviderId = null;
  state.nestedDialog = null;
  render();
}
function openNested(kind) {
  state.nestedDialog = kind;
  render();
}
function closeNested() {
  state.nestedDialog = null;
  render();
}
function toggleBool(key) {
  state.values[key] = !state.values[key];
  render();
}
function setVal(key, val) {
  state.values[key] = val;
  render();
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.nestedDialog) { closeNested(); return; }
    if (state.editingProviderId) { closeProvider(); return; }
    if (state.inSettings) { closeSettings(); return; }
  }
});

// ==================== Render Helpers ====================
function getFilteredGroups() {
  const q = state.search.trim().toLowerCase();
  if (!q) return GROUPS;
  return GROUPS.map(g => ({
    ...g,
    items: g.items.filter(it =>
      it.label.toLowerCase().includes(q) ||
      (g.title && g.title.toLowerCase().includes(q)) ||
      it.keywords.toLowerCase().includes(q)
    ),
  })).filter(g => g.items.length > 0);
}

function renderSettingsNavList(showSearch = true) {
  const groups = getFilteredGroups();
  const hasRealDemo = (id) => ['providers', 'appearance', 'service', 'general'].includes(id);
  const searchHtml = showSearch ? `
    <div class="search-box" style="margin-bottom:6px">
      <span class="search-ic">${ic('search', 'i i-sm')}</span>
      <input id="settings-search-input" type="text" value="${escapeAttr(state.search)}" placeholder="搜索设置项…" oninput="setSearch(this.value)" />
      ${state.search ? `<button class="clear-btn" onclick="clearSearch()" aria-label="清除">${ic('x', 'i i-xs')}</button>` : ''}
    </div>
  ` : '';
  const listHtml = groups.length ? groups.map(g => `
    <div class="nav-group">
      ${g.title ? `<div class="nav-group-title">${g.title}</div>` : ''}
      ${g.items.map(it => `
        <button class="list-row ${state.section === it.id ? 'selected' : ''}" onclick="selectSection('${it.id}')">
          <span class="leading">${ic(it.icon)}</span>
          <span class="label">${it.label}</span>
          ${hasRealDemo(it.id) ? '<span class="meta">样页</span>' : ''}
        </button>
      `).join('')}
    </div>
  `).join('') : `<div style="padding:20px 8px;text-align:center;color:var(--fg-4);font-size:12px">没有匹配的设置项</div>`;

  return `${searchHtml}<div class="nav-scroll" id="settings-nav-scroll">${listHtml}</div>`;
}

// ==================== Main Render ====================
function escapeAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

function updateMetrics() {
  const vpEl = document.getElementById('viewport');
  const vpW = Math.round(vpEl.getBoundingClientRect().width);
  let navW = 0;
  let contentW = 0;
  if (!state.inSettings) {
    navW = 268;
    contentW = Math.max(0, vpW - 276);
  } else if (state.mode === 'current') {
    const modalW = Math.min(1080, vpW - 32);
    navW = 208;
    contentW = Math.max(0, modalW - 208 - 48);
  } else if (state.mode === 'optionA') {
    navW = 268 + 224;
    contentW = Math.max(0, vpW - 268 - 8 - 224 - 64);
  } else {
    navW = 268;
    contentW = Math.max(0, vpW - 268 - 8 - 64);
  }

  // Toggle responsive narrow-content class based on actual available content width
  vpEl.classList.toggle('narrow-content', contentW < 840);

  const metricsEl = document.getElementById('proto-metrics');
  metricsEl.innerHTML = `
    <span>视口 <strong>${vpW}px</strong></span>
    <span>·</span>
    <span>左侧导航占 <strong>${navW}px</strong></span>
    <span>·</span>
    <span>正文可用宽 <strong>${contentW}px</strong></span>
  `;
}

              <div class="page-section-head">
                <div>
                  <h2>${sec.label}</h2>
                  ${sec.groupTitle ? `<p class="page-section-sub">${sec.groupTitle}</p>` : ''}
                </div>
              </div>
            ` : ''}
            ${renderSectionBody(sec)}
          </div>
        </div>
      </div>
    `;
  } else {
    // Option B: Swapped sidebar, main area 100% belongs to settings content
    const colClass = sec.col === 'board' ? 'col-board' : 'col-document';
    mainEl.innerHTML = `
      <header class="page-header">
        <h1>${sec.groupTitle ? `${sec.groupTitle} / ` : ''}${sec.label}</h1>
        <span class="page-host">macbook.local</span>
        <span class="badge mono" style="margin-left:auto">/settings/${sec.id}</span>
      </header>
      <div class="page-body">
        <div class="page-scroller">
          <div class="${colClass}">
            ${renderCallout(sec)}
            ${!(state.section === 'providers' && state.editingProviderId) ? `
              <div class="page-section-head">
                <div>
                  <h2>${sec.label}</h2>
                </div>
              </div>
            ` : ''}
            ${renderSectionBody(sec)}
          </div>
        </div>
      </div>
    `;
  }

  // Current Modal Overlay
  if (state.inSettings && state.mode === 'current') {
    modalScrim.hidden = false;
    modalScrim.innerHTML = `
      <div class="modal-box" role="dialog" aria-label="设置">
        <nav class="modal-nav">
          <h2>设置</h2>
          ${renderSettingsNavList(false)}
        </nav>
        <div class="modal-main">
          <div class="modal-head">
            <h2>${sec.label}</h2>
            <button class="btn btn-quiet btn-icon" onclick="closeSettings()" aria-label="关闭">${ic('x')}</button>
          </div>
          <div class="modal-scroll">
            ${renderCallout(sec)}
            ${renderSectionBody(sec)}
          </div>
        </div>
      </div>
    `;
  } else {
    modalScrim.hidden = true;
    modalScrim.innerHTML = '';
  }

  // Nested Dialog
  if (state.nestedDialog) {
    nestedScrim.hidden = false;
    nestedScrim.innerHTML = renderNestedDialog();
  } else {
    nestedScrim.hidden = true;
    nestedScrim.innerHTML = '';
  }

  requestAnimationFrame(updateMetrics);
}

window.addEventListener('resize', updateMetrics);
render();
</script>
</body>
</html>
