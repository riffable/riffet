<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Riffet · 任务与助理（交互原型）</title>
<style>
/*
 * Interactive prototype for docs/TASK-BOARD.md, drawn with the design system (docs/design/system/):
 * role colours from apps/web/src/styles/index.css, type and motion from design-tokens.ts, and each
 * class below mirrors one component in apps/web/src/components/ui/ (named in the comment above it).
 * Icons are lucide-react@0.522 paths at stroke 1.25; agent marks are scripts/agent-marks/*.svg.
 */
:root {
  color-scheme: light;
  --bg: #ffffff; --bg-sidebar: #f7f8fa; --bg-subtle: #f5f6f8; --bg-muted: #eef0f3; --bg-elevated: #ffffff; --bg-popover: #ffffff;
  --bg-hover: rgb(35 45 70 / 0.055); --bg-active: rgb(35 45 70 / 0.09); --bg-bubble: #eef3fd;
  --fg: #2a2c2e; --fg-2: #50555d; --fg-3: #60666e; --fg-4: #adb2ba;
  --line: rgb(15 23 42 / 0.08); --line-soft: rgb(15 23 42 / 0.055); --line-strong: rgb(15 23 42 / 0.13);
  --primary: #15171a; --primary-hover: #34373d; --primary-fg: #ffffff;
  --accent: #3867f0; --accent-soft: rgb(56 103 240 / 0.1);
  --success: #1f9d55; --warning: #c77f06; --warning-soft: rgb(245 158 11 / 0.13); --danger: #e0454b; --danger-soft: rgb(224 69 75 / 0.08);
  --diff-add-marker: #01a241; --diff-del-marker: #ba2723;
  --agent-claude: #d97757;
  --shadow-soft: 0 1px 2px rgb(15 23 42 / 0.03), 0 3px 10px -4px rgb(15 23 42 / 0.05);
  --shadow-pop: 0 0 0 0.5px rgb(15 23 42 / 0.1), 0 8px 24px -8px rgb(15 23 42 / 0.14), 0 2px 5px -2px rgb(15 23 42 / 0.05);
  --shadow-composer: 0 0 0 0.5px rgb(24 24 26 / 0.08), 0 2px 4px rgb(24 24 26 / 0.03), 0 10px 28px -12px rgb(24 24 26 / 0.14);
  --shadow-peek: 0 0 0 1px var(--line), 0 18px 48px -16px rgb(24 24 26 / 0.28);
  --scrim: rgb(0 0 0 / 0.25);
  --canvas: var(--bg-sidebar);
  --focus-ring: color-mix(in srgb, var(--accent) 50%, transparent);
  --ease-standard: cubic-bezier(0.2, 0, 0, 1); --ease-decelerate: cubic-bezier(0.05, 0.7, 0.1, 1); --ease-accelerate: cubic-bezier(0.3, 0, 0.8, 0.15);
  --duration-fast: 150ms; --duration-base: 200ms; --duration-medium: 250ms; --duration-exit-fast: 100ms; --duration-exit-base: 140ms;
  --font-sans: "Inter Variable", "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, "PingFang SC", monospace;
}
.dark {
  color-scheme: dark;
  --bg: #141416; --bg-sidebar: #1a1a1d; --bg-subtle: #1d1d20; --bg-muted: #27272b; --bg-elevated: #1f1f22; --bg-popover: #252528;
  --bg-hover: rgb(255 255 255 / 0.06); --bg-active: rgb(255 255 255 / 0.1); --bg-bubble: #27282c;
  --fg: #d2d4d7; --fg-2: #b6bac1; --fg-3: #9da2aa; --fg-4: #62666e;
  --line: rgb(255 255 255 / 0.075); --line-soft: rgb(255 255 255 / 0.05); --line-strong: rgb(255 255 255 / 0.12);
  --primary: #eceef1; --primary-hover: #d3d6db; --primary-fg: #141416;
  --accent: #5b8cff; --accent-soft: rgb(91 140 255 / 0.15);
  --success: #3fb96f; --warning: #e5a13a; --warning-soft: rgb(229 161 58 / 0.15); --danger: #f0676c; --danger-soft: rgb(240 103 108 / 0.13);
  --diff-add-marker: #41c977; --diff-del-marker: #fa423e;
  --agent-claude: #e8916f;
  --shadow-soft: 0 1px 2px rgb(0 0 0 / 0.18);
  --shadow-pop: 0 0 0 0.5px rgb(255 255 255 / 0.09), 0 12px 32px -10px rgb(0 0 0 / 0.6);
  --shadow-composer: 0 0 0 0.5px rgb(255 255 255 / 0.08), 0 10px 28px -12px rgb(0 0 0 / 0.7);
  --shadow-peek: 0 0 0 1px var(--line), 0 18px 48px -12px rgb(0 0 0 / 0.7);
  --scrim: rgb(0 0 0 / 0.5);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--canvas); color: var(--fg); font: 13px/20px var(--font-sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: default; text-align: inherit; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
.ui { user-select: none; -webkit-user-select: none; cursor: default; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
svg.i * { vector-effect: non-scaling-stroke; }
.mono { font-family: var(--font-mono); }
.tnum { font-variant-numeric: tabular-nums; }
.trunc { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow { flex: 1; min-width: 0; }
.t-2xs { font-size: 11px; line-height: 16px; } .t-xs { font-size: 12px; line-height: 18px; } .t-sm { font-size: 13px; line-height: 20px; }
.t-base { font-size: 14px; line-height: 22px; } .t-lg { font-size: 16px; line-height: 24px; }
.fg-2 { color: var(--fg-2); } .fg-3 { color: var(--fg-3); } .fg-4 { color: var(--fg-4); } .warn { color: var(--warning); } .dang { color: var(--danger); }
.num { font-family: var(--font-mono); font-size: 11px; line-height: 16px; color: var(--fg-4); font-variant-numeric: tabular-nums; flex: none; }
.diff { font-family: var(--font-mono); font-size: 11px; line-height: 16px; font-variant-numeric: tabular-nums; flex: none; }
.diff .a { color: var(--diff-add-marker); } .diff .d { color: var(--diff-del-marker); }

/* Button — components/ui/button.tsx: primary ink, secondary 7% ink, ghost / quiet transparent */
.btn { display: inline-flex; flex: none; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; font-weight: 500;
  transition: color var(--duration-fast) var(--ease-standard), background-color var(--duration-fast) var(--ease-standard), scale var(--duration-fast) var(--ease-standard); }
.btn:active { scale: 0.97; }
.btn:disabled { opacity: .5; pointer-events: none; }
.btn.xs { height: 24px; padding: 0 8px; border-radius: 8px; font-size: 12px; line-height: 18px; } .btn.xs svg.i { width: 14px; height: 14px; }
.btn.sm { height: 28px; padding: 0 10px; border-radius: 10px; } .btn.sm svg.i { width: 14px; height: 14px; }
.btn.md { height: 32px; padding: 0 12px; border-radius: 10px; }
.btn.icon-xs { width: 24px; height: 24px; border-radius: 8px; } .btn.icon-xs svg.i { width: 14px; height: 14px; }
.btn.icon-sm { width: 28px; height: 28px; border-radius: 10px; }
.btn.primary { background: var(--primary); color: var(--primary-fg); } .btn.primary:hover { background: var(--primary-hover); }
.btn.secondary { background: color-mix(in srgb, var(--fg) 7%, transparent); color: var(--fg); }
.btn.secondary:hover, .btn.secondary[data-open] { background: color-mix(in srgb, var(--fg) 11%, transparent); }
.btn.ghost { color: var(--fg-2); } .btn.quiet { color: var(--fg-3); }
.btn.ghost:hover, .btn.quiet:hover, .btn.ghost[data-open], .btn.quiet[data-open] { background: var(--bg-hover); color: var(--fg); }

/* Segmented — controls.tsx: one thumb slides between the segments */
.seg { position: relative; display: inline-flex; align-items: center; padding: 2px; border-radius: 10px; background: var(--bg-muted); box-shadow: inset 0 0 0 .5px var(--line); }
.seg .thumb { position: absolute; left: 0; top: 0; border-radius: 8px; background: var(--bg-elevated); box-shadow: 0 0 0 .5px var(--line-strong), var(--shadow-soft);
  transition: transform var(--duration-base) var(--ease-standard), width var(--duration-base) var(--ease-standard); }
.dark .seg .thumb { background: var(--bg-active); }
.seg button { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 8px; font-weight: 500; color: var(--fg-3); transition: color var(--duration-base) var(--ease-standard); }
.seg button:hover { color: var(--fg-2); }
.seg button[aria-checked="true"] { color: var(--fg); }
.seg.xs button { height: 24px; padding: 0 10px; font-size: 12px; }
.seg svg.i { width: 14px; height: 14px; }

/* UnderlineTabs — controls.tsx */
.utabs { display: flex; align-items: stretch; gap: 4px; height: 36px; }
.utabs button { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; font-weight: 500; color: var(--fg-3); transition: color var(--duration-fast); }
.utabs button:hover { color: var(--fg); }
.utabs button::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 0; height: 2px; border-radius: 2px; background: transparent; transition: background-color var(--duration-fast); }
.utabs button[aria-selected="true"] { color: var(--fg); }
.utabs button[aria-selected="true"]::after { background: var(--fg); }

/* Badge, StatusDot, Kbd — controls.tsx */
.badge { display: inline-flex; flex: none; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: 8px; background: var(--bg-muted); color: var(--fg-2); font-size: 11px; line-height: 16px; font-weight: 500; }
.sdot { display: inline-block; flex: none; width: 6px; height: 6px; border-radius: 50%; }
.sdot.accent { background: var(--accent); } .sdot.warning { background: var(--warning); } .sdot.danger { background: var(--danger); } .sdot.idle { background: var(--fg-4); }
.sdot.pulse { animation: pulse-dot 1.4s ease-in-out infinite; }
@keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.kbd { display: inline-flex; align-items: center; justify-content: center; height: 20px; min-width: 20px; padding: 0 4px; border-radius: 6px; background: var(--bg-muted); color: var(--fg-3); font-size: 11px; font-weight: 500; }

/* ListRow — list-row.tsx: 32 high, 10 side padding; trailing actions wait for the row */
.row { display: flex; width: 100%; min-width: 0; min-height: 32px; align-items: center; gap: 8px; padding: 0 10px; border-radius: 10px; color: var(--fg-2); transition: background-color var(--duration-fast); }
.row:hover { background: var(--bg-hover); color: var(--fg); }
.row.sel { background: var(--bg-active); color: var(--fg); }
.row .lead { display: grid; place-items: center; width: 16px; height: 16px; flex: none; color: var(--fg-3); }
.reveal { opacity: 0; pointer-events: none; transition: opacity var(--duration-fast); }
.row:hover .reveal, .row:focus-within .reveal { opacity: 1; pointer-events: auto; }
.conceal { transition: opacity var(--duration-fast); }
.row:hover .conceal, .row:focus-within .conceal { opacity: 0; }
.stack { display: grid; flex: none; align-items: center; justify-items: end; } .stack > * { grid-area: 1 / 1; }

/* Menu and popover — dropdown-menu.tsx menuSurface / menuItem */
.menu { position: fixed; z-index: 75; min-width: 176px; max-height: 420px; overflow-y: auto; padding: 4px; border-radius: 12px; background: var(--bg-popover); box-shadow: var(--shadow-pop); color: var(--fg);
  animation: pop-in var(--duration-fast) var(--ease-decelerate) both; }
.menu.closing { animation: pop-out var(--duration-exit-fast) var(--ease-accelerate) both; }
@keyframes pop-in { from { opacity: 0; transform: scale(.96) translateY(-4px); } }
@keyframes pop-out { to { opacity: 0; transform: scale(.96) translateY(-4px); } }
.mi { display: flex; width: 100%; min-height: 32px; align-items: center; gap: 8px; padding: 0 8px; border-radius: 10px; font-size: 13px; }
.mi:hover, .mi:focus-visible { background: var(--bg-hover); outline: none; }
.mi > svg.i:first-child { color: var(--fg-3); }
.mi .end { margin-left: auto; padding-left: 16px; display: inline-flex; color: var(--fg); }
.mlabel { padding: 6px 8px 4px; font-size: 12px; line-height: 18px; font-weight: 500; color: var(--fg-3); }
.msep { height: 1px; margin: 4px -4px; background: var(--line); }

/* Dialog — dialog.tsx, size form (448) */
.scrim { position: fixed; inset: 0; z-index: 69; background: var(--scrim); backdrop-filter: blur(1.5px); animation: fade-in var(--duration-fast) var(--ease-decelerate) both; }
.dialog { position: fixed; z-index: 70; left: 50%; top: 50%; width: min(448px, calc(100vw - 32px)); transform: translate(-50%, -50%); display: flex; flex-direction: column; border-radius: 16px; background: var(--bg-elevated); box-shadow: var(--shadow-pop);
  animation: dialog-in var(--duration-fast) var(--ease-decelerate) both; }
@keyframes fade-in { from { opacity: 0; } }
@keyframes dialog-in { from { opacity: 0; transform: translate(-50%, -50%) scale(.96); } }
.dialog .dh { padding: 20px 48px 12px 20px; font-size: 16px; line-height: 24px; font-weight: 500; }
.dialog .dx { position: absolute; top: 12px; right: 12px; }
.dialog .db { display: flex; flex-direction: column; gap: 16px; padding: 0 20px 8px; }
.dialog .df { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 16px 20px 20px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 500; }
.input { width: 100%; min-width: 0; height: 32px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--bg-elevated); font-size: 13px; outline: none; transition: border-color var(--duration-fast), box-shadow var(--duration-fast); }
textarea.input { height: auto; min-height: 80px; padding: 8px 10px; line-height: 20px; resize: vertical; }
.input::placeholder { color: var(--fg-4); }
.input:hover { border-color: color-mix(in srgb, var(--fg-4) 60%, transparent); }
.input:focus, .input[data-open] { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
button.input { display: flex; align-items: center; gap: 8px; text-align: left; }
button.input svg.i:last-child { margin-left: auto; width: 14px; height: 14px; color: var(--fg-3); }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
.check .box { display: grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--line-strong); background: var(--bg-elevated); color: var(--primary-fg); transition: background-color var(--duration-fast), border-color var(--duration-fast); }
.check .box svg.i { width: 12px; height: 12px; opacity: 0; }
.check[aria-checked="true"] .box { background: var(--primary); border-color: var(--primary); }
.check[aria-checked="true"] .box svg.i { opacity: 1; }

/* ---------- prototype chrome (not part of the design) ---------- */
.demo-bar { position: fixed; inset: 0 0 auto 0; height: 44px; z-index: 50; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 16px; background: var(--canvas); box-shadow: inset 0 -1px var(--line); }
.demo-bar .name { font-weight: 500; color: var(--fg-3); }
.stage { position: absolute; inset: 44px 0 0 0; }
.scene { position: absolute; inset: 0; display: none; }
.scene.on { display: flex; }

/* ---------- workbench (patterns §1.1): sidebar on the canvas, main card inset 8, radius 12 ---------- */
.sb { width: 256px; flex: none; display: flex; flex-direction: column; min-height: 0; }
.sb-top { height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px; }
.sb-top .brand { font-size: 14px; line-height: 22px; font-weight: 600; letter-spacing: -.01em; }
.sb-nav { display: flex; flex-direction: column; gap: 1px; padding: 0 8px 8px; }
.nav { display: flex; height: 32px; align-items: center; gap: 9px; padding: 0 8px; border-radius: 10px; color: var(--fg-2); transition: background-color var(--duration-fast), color var(--duration-fast); }
.nav svg.i { width: 15px; height: 15px; }
.nav:hover { background: var(--bg-hover); color: var(--fg); }
.nav[aria-current="page"] { background: var(--bg-active); color: var(--fg); }
.nav .end { margin-left: auto; font-size: 11px; line-height: 16px; color: var(--fg-4); font-variant-numeric: tabular-nums; }
.sb-list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 12px; }
.sb-sec { display: flex; align-items: center; height: 28px; margin-top: 12px; padding: 0 8px; font-size: 11px; line-height: 16px; font-weight: 500; color: var(--fg-4); }
.sb-foot { display: flex; align-items: center; gap: 2px; height: 48px; flex: none; padding: 0 8px; }
.brand-mark { width: 20px; height: 20px; flex: none; }
.main { position: relative; flex: 1; min-width: 0; margin: 8px 8px 8px 0; border-radius: 12px; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }

/* PageScaffold — app/PageScaffold.tsx: header 52, one scroller, the board column (1200) */
.page-h { height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; }
.page-h h1 { margin: 0; font-size: 13px; line-height: 20px; font-weight: 500; }
.page-h .acts { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.scroller { flex: 1; min-height: 0; overflow-y: auto; }
.column { max-width: 1200px; margin: 0 auto; padding: 24px 32px 64px; box-sizing: content-box; }

/* toolbar under the header: the object (heading Select) left, filter and view right */
.toolbar { display: flex; align-items: center; gap: 4px; margin-bottom: 16px; }
.heading-select { display: inline-flex; height: 36px; margin-left: -8px; padding: 0 8px; align-items: center; gap: 8px; border-radius: 10px; font-size: 14px; line-height: 22px; font-weight: 500; }
.heading-select:hover, .heading-select[data-open] { background: var(--bg-hover); }
.heading-select svg.i { color: var(--fg-3); }
.btn .count { font-size: 11px; font-variant-numeric: tabular-nums; }

/* section heading: text-xs medium fg-3, 28 high (SettingsGroup's title) */
.sec { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 2px; font-size: 12px; line-height: 18px; font-weight: 500; color: var(--fg-3); }
.sec .n { font-weight: 400; color: var(--fg-4); font-variant-numeric: tabular-nums; }
.frame { border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); padding: 4px; }
.frame .row { border-radius: 8px; }

/* inbox: things that need the reader, above the columns */
.inbox { margin-bottom: 24px; }
.inbox .row { min-height: 36px; color: var(--fg); }
.inbox .why { flex: 0 1 38%; color: var(--fg-3); font-size: 12px; }
.inbox .num { width: 32px; }

/* board */
.board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; align-items: start; }
.bcol { display: flex; flex-direction: column; min-width: 0; border-radius: 12px; transition: background-color var(--duration-fast); }
.bcol.drop { background: var(--bg-hover); }
.bcol-h { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px 0 6px; font-weight: 500; }
.bcol-h .n { color: var(--fg-4); font-weight: 400; font-size: 12px; font-variant-numeric: tabular-nums; }
.bcol-h .btn { margin-left: auto; }
.cards { display: flex; flex-direction: column; gap: 8px; min-height: 96px; padding: 4px 0 16px; }
.card { display: block; width: 100%; padding: 10px 12px; border-radius: 12px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow var(--duration-fast), background-color var(--duration-fast); }
.card:hover { box-shadow: inset 0 0 0 1px var(--line-strong); }
.card.sel { background: var(--bg-active); box-shadow: inset 0 0 0 1px var(--line-strong); }
.card.dragging { opacity: .4; }
.card .top { display: flex; align-items: center; gap: 6px; height: 16px; }
.card .live { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 11px; line-height: 16px; }
.card .title { margin: 6px 0 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card.done .title { color: var(--fg-2); }
.card .labels { display: flex; flex-wrap: wrap; gap: 4px; margin: -2px 0 8px; }
.card .foot { display: flex; align-items: center; gap: 8px; height: 16px; font-size: 11px; line-height: 16px; color: var(--fg-3); }
.card .foot .when { margin-left: auto; color: var(--fg-4); font-variant-numeric: tabular-nums; }
.card .foot .sub { display: inline-flex; align-items: center; gap: 3px; }
.card .foot .sub svg.i { width: 12px; height: 12px; }
.marks { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.amark { width: 14px; height: 14px; flex: none; display: inline-block; }
.amark.owner { display: inline-grid; place-items: center; border-radius: 50%; background: var(--bg-active); color: var(--fg-2); }
.amark.owner svg.i { width: 10px; height: 10px; }
.status { width: 14px; height: 14px; flex: none; display: block; }

/* list view */
.lgroup + .lgroup { margin-top: 16px; }
.list .row { min-height: 36px; }
.list .row .t { flex: 1; color: var(--fg); }
.list .row.done .t { color: var(--fg-2); }
.list .num { width: 32px; }
.list .when { width: 44px; text-align: right; font-size: 12px; color: var(--fg-3); font-variant-numeric: tabular-nums; }

/* side panel, floating (surfaces §3.1): inset 16 inside the main card */
.panel:focus { outline: none; }
.panel { position: absolute; top: 16px; right: 16px; bottom: 16px; width: 440px; z-index: 20; display: flex; flex-direction: column; border-radius: 12px; background: var(--bg); box-shadow: var(--shadow-peek);
  animation: panel-in var(--duration-medium) var(--ease-decelerate) both; }
.panel.closing { animation: panel-out var(--duration-exit-base) var(--ease-accelerate) both; }
@keyframes panel-in { from { opacity: 0; transform: translateX(12px); } }
@keyframes panel-out { to { opacity: 0; transform: translateX(12px); } }
.panel-h { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; box-shadow: inset 0 -1px var(--line); }

/* Segmented: the thumb follows the checked segment */
function segmented(el, value, onChange, attr) {
  const place = (instant) => {
    const on = el.querySelector('[aria-checked="true"]'), thumb = el.querySelector('.thumb');
    if (!on) return;
    if (instant) thumb.style.transition = 'none';
    thumb.style.width = on.offsetWidth + 'px'; thumb.style.height = on.offsetHeight + 'px';
    thumb.style.transform = `translate(${on.offsetLeft}px, ${on.offsetTop}px)`;
    if (instant) { void thumb.offsetWidth; thumb.style.transition = ''; }
  };
  const set = (v, instant) => { el.querySelectorAll('[role=radio]').forEach(b => b.setAttribute('aria-checked', String(b.dataset[attr] === v))); place(instant); };
  el.querySelectorAll('[role=radio]').forEach(b => b.addEventListener('click', () => { set(b.dataset[attr], false); onChange(b.dataset[attr]); }));
  set(value, true);
  return set;
}

/* ---------- layers: menu above dialog above panel; Escape closes the top one ---------- */
let openMenu = null;
function closeMenu() {
  if (!openMenu) return;
  const { el, anchor } = openMenu; openMenu = null;
  anchor.removeAttribute('data-open');
  el.classList.add('closing');
  el.addEventListener('animationend', () => el.remove(), { once: true });
  setTimeout(() => el.remove(), 200);
}
// items: { label, icon?, html?, checked?, onPick, kind: 'radio' | 'check' } | { sep } | { heading }
function menu(anchor, items, { align = 'start', width } = {}) {
  if (openMenu?.anchor === anchor) { closeMenu(); return; }
  closeMenu();
  const el = document.createElement('div');
  el.className = 'menu ui'; el.setAttribute('role', 'menu');
  if (width) el.style.width = width + 'px';
  const render = () => {
    el.innerHTML = items.map((it, i) => it.sep ? '<div class="msep"></div>' : it.heading ? `<div class="mlabel">${it.heading}</div>`
      : `<button class="mi" role="${it.kind === 'check' ? 'menuitemcheckbox' : it.kind === 'radio' ? 'menuitemradio' : 'menuitem'}" data-k="${i}"${it.kind ? ` aria-checked="${!!it.checked}"` : ''}>${it.html ?? ((it.icon ? icon(it.icon) : '') + `<span class="trunc">${it.label}</span>`)}${it.checked ? `<span class="end">${icon('check')}</span>` : ''}</button>`).join('');
    el.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
      const it = items[+b.dataset.k];
      if (it.kind === 'check') { it.checked = !it.checked; it.onPick(it.checked); render(); return; }
      closeMenu(); it.onPick();
    });
  };
  render();
  $('overlay-host').append(el);
  const r = anchor.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  let left = align === 'end' ? r.right - w : r.left, top = r.bottom + 6;
  if (top + h > innerHeight - 8) top = r.top - 6 - h;
  left = Math.max(8, Math.min(left, innerWidth - 8 - w));
  el.style.left = left + 'px'; el.style.top = top + 'px';
  el.style.transformOrigin = `${align === 'end' ? 'right' : 'left'} top`;
  anchor.setAttribute('data-open', '');
  openMenu = { el, anchor };
  el.querySelector('.mi')?.focus({ preventScroll: true });
}
document.addEventListener('pointerdown', e => { if (openMenu && !openMenu.el.contains(e.target) && !openMenu.anchor.contains(e.target)) closeMenu(); }, true);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || e.isComposing) return;

function openTask(n) {
  const t = byN(n); if (!t) return;
  const fresh = !state.selected;
  state.selected = n;
  let panel = $('panel-host').querySelector('.panel');
  if (!panel || panel.classList.contains('closing')) { $('panel-host').innerHTML = '<aside class="panel" tabindex="-1" aria-label="任务详情"></aside>'; panel = $('panel-host').querySelector('.panel'); }
  panel.innerHTML = panelHTML(t);
  wirePanel(panel, t);
  if (fresh) panel.focus({ preventScroll: true });
  renderTasks();
}
function closeTask() {
  const panel = $('panel-host').querySelector('.panel');
  const n = state.selected; state.selected = null;
  if (panel) { panel.classList.add('closing'); panel.addEventListener('animationend', () => panel.remove(), { once: true }); }
  renderTasks();
  document.querySelector(`.card[data-n="${n}"], #inbox [data-n="${n}"]`)?.focus({ preventScroll: true });
}
function wirePanel(panel, t) {
  panel.querySelector('[data-close]').onclick = closeTask;
  panel.querySelectorAll('[data-open]').forEach(el => el.onclick = () => openTask(+el.dataset.open));
  panel.querySelector('[data-pick="status"]').onclick = e => menu(e.currentTarget, ['todo', 'doing', 'review', 'done', 'cancelled'].map(s => ({
    kind: 'radio', checked: t.status === s, html: `${statusIcon(s)}<span>${STATUS[s]}</span>`, onPick: () => setStatus(t, s) })));
  panel.querySelector('[data-pick="agent"]').onclick = e => menu(e.currentTarget, ['claude', 'codex', 'owner'].map(a => ({
    kind: 'radio', checked: t.agent === a, html: `${mark(a)}<span>${AGENT_NAME[a]}</span>`, onPick: () => { t.agent = a; openTask(t.n); } })));
  panel.querySelector('[data-more]').onclick = e => menu(e.currentTarget, [
    { label: '复制链接', icon: 'corner-down-right', onPick() {} },
    { label: '新建子任务', icon: 'list-todo', onPick() {} },
    { sep: true },
    { label: '取消任务', icon: 'x', onPick: () => setStatus(t, 'cancelled') },
  ], { align: 'end' });
  panel.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const act = b.dataset.act;
    if (act === 'start') { start(t); }
    if (act === 'done') setStatus(t, 'done');
    if (act === 'rework') { t.status = 'doing'; t.live = 'running'; t.when = '刚刚'; (t.runs ??= []).forEach(r => r.s = 'idle'); t.runs.unshift({ a: t.agent, t: t.title, s: 'running', x: '按你的评论返工', w: '刚刚' }); refresh(); }
    if (act === 'another') { (t.runs ??= []).unshift({ a: t.agent === 'owner' ? 'claude' : t.agent, t: t.title, s: 'running', x: '读取任务描述与上一个会话的结论', w: '刚刚' }); t.live = t.live === 'waiting' ? 'waiting' : 'running'; refresh(); }
  });
  panel.querySelectorAll('[data-approve]').forEach(b => b.onclick = () => resolveApproval(b.dataset.approve));
  const toggle = panel.querySelector('[data-toggle]');
  toggle.onclick = () => toggle.setAttribute('aria-checked', String(toggle.getAttribute('aria-checked') !== 'true'));
  const area = panel.querySelector('.embed textarea'), send = panel.querySelector('.embed .send');
  area.oninput = () => { send.disabled = !area.value.trim(); area.style.height = 'auto'; area.style.height = area.scrollHeight + 'px'; };
}
function setStatus(t, s) {
  t.status = s; t.when = '刚刚';
  if (s === 'done' || s === 'cancelled') { t.live = undefined; (t.runs ?? []).forEach(r => r.s = 'idle'); }
  refresh();
}
function start(t) {
  t.status = 'doing'; t.live = 'running'; t.when = '刚刚';
  const a = t.agent === 'owner' ? 'claude' : t.agent;
  t.runs = [{ a, t: t.title, s: 'running', x: '读取任务描述', w: '刚刚' }];
  refresh();
}
function resolveApproval(choice) {
  const t = byN(141);
  state.approval = choice;
  t.live = choice === 'deny' ? 'unseen' : 'running';
  t.why = undefined;
  t.runs[0].s = choice === 'deny' ? 'idle' : 'running';
  t.runs[0].x = choice === 'deny' ? '已拒绝运行 pnpm --filter web build' : '正在运行 pnpm --filter web build';
  refresh();
}

function thread(phone) {
  const p = state.proposal;
  const proposal = `
    <div class="icard ui block-gap">
      <header><h3>派发 2 个任务</h3></header>
      <div class="inset" style="padding:0 8px">
        <div class="prow">${statusIcon(byN(144).status)}<span class="num">#144</span><span class="grow trunc">Android 预览崩溃</span>${p === 'open' ? `<button class="capsule" data-pick-agent>${mark(byN(144).agent)}${AGENT_NAME[byN(144).agent]}${icon('chevron-down')}</button>` : `<span class="capsule">${mark(byN(144).agent)}${AGENT_NAME[byN(144).agent]}</span>`}</div>
        <div class="prow">${statusIcon(byN(143).status)}<span class="num">#143</span><span class="grow trunc">CI/CD 与版本发布方案</span><span class="capsule">#144 之后</span></div>
      </div>
      ${p === 'open' ? `<div class="opts">
        <button class="btn sm primary" data-proposal="start"><span>开始</span><span class="kbd">1</span></button>
        <button class="btn sm secondary" data-proposal="skip"><span>不用了</span><span class="kbd">2</span></button>
      </div>` : `<div class="done-note">${icon('check')}${p === 'start' ? '已开始 #144，#143 排在其后' : '未派发'}</div>`}
    </div>`;
  const a = state.approval;
  const approval = `
    <div class="icard ui block-gap">
      <header>${a === 'open' ? LIVE.waiting.dot : ''}<h3>#141 · 运行命令</h3><span class="t-xs fg-3">Claude Code</span></header>
      <div class="inset"><div class="cmd">pnpm --filter web build</div></div>
      ${a === 'open' ? `<div class="opts">
        <button class="btn sm primary" data-approve="allow"><span>允许</span><span class="kbd">1</span></button>
        <button class="btn sm secondary" data-approve="deny"><span>拒绝</span><span class="kbd">2</span></button>
      </div>` : `<div class="done-note">${icon('check')}${a === 'deny' ? '已拒绝' : '已允许'}</div>`}
    </div>`;
  const extra = state.extra.map(x => `
    <div class="turn"><div class="umsg"><div>${esc(x.text)}</div></div>
      <button class="process ui">${icon('chevron-right')}已处理 · 3s</button>
      <div class="md"><p>建了 #${x.n}，放在待办。</p>${tref(x.n)}</div>
    </div>`).join('');
  return `
    <div class="turn">
      <div class="umsg"><div>安卓预览崩溃和发布方案排一下，安卓那个先做</div></div>
      <button class="process ui">${icon('chevron-right')}已处理 · 8s</button>
      <div class="md">
        <p>两件事都已有任务。#144 的崩溃在「定位 Android 预览崩溃原因」那次会话里已经定位到 <code>PreviewHost</code>，可以直接修；#143 要用 #144 合入后的版本号，排在后面。</p>
        ${proposal}
      </div>
    </div>
    <div class="turn">
      <div class="md"><p>#141 在等你批准一条命令。</p>${approval}</div>
    </div>
    <div class="turn">
      <div class="md"><p>#140 改为待验收：6 个文件，<code>pnpm typecheck</code> 通过；Web 实际界面未确认。</p>${tref(140)}</div>
    </div>${extra}`;
}
function wireThread(root) {
  root.querySelectorAll('[data-proposal]').forEach(b => b.onclick = () => {
    state.proposal = b.dataset.proposal;
    if (state.proposal === 'start') { const t = byN(144); start(t); byN(143).when = '刚刚'; }
    refresh();
  });
  root.querySelectorAll('[data-approve]').forEach(b => b.onclick = () => resolveApproval(b.dataset.approve));
  root.querySelectorAll('[data-pick-agent]').forEach(b => b.onclick = () => menu(b, ['codex', 'claude'].map(a => ({ kind: 'radio', checked: byN(144).agent === a, html: `${mark(a)}<span>${AGENT_NAME[a]}</span>`, onPick: () => { byN(144).agent = a; refresh(); } }))));
  root.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => { setScene('board'); openTask(+b.dataset.goto); });
}

/* composer */
const input = $('composer-input'), sendBtn = $('composer-send');
function paintAgent() { $('assistant-agent').innerHTML = `${mark(state.assistantAgent)}<span>${AGENTS_FOR_ASSISTANT[state.assistantAgent]}</span>`; }
$('assistant-agent').onclick = e => menu(e.currentTarget, [{ heading: '助理使用的 Agent' }, ...Object.keys(AGENTS_FOR_ASSISTANT).map(a => ({
  kind: 'radio', checked: state.assistantAgent === a, html: `${mark(a)}<span>${AGENTS_FOR_ASSISTANT[a]}</span>`, onPick: () => { state.assistantAgent = a; paintAgent(); } }))]);
input.oninput = () => { sendBtn.disabled = !input.value.trim(); input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 240) + 'px'; };
input.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendBtn.click(); } };
sendBtn.onclick = () => {
  const text = input.value.trim(); if (!text) return;
  const t = { n: nextNumber++, title: text.replace(/^(帮我|请)?/, '').slice(0, 40), status: 'todo', agent: 'claude', labels: [], when: '刚刚', origin: 'assistant' };
  tasks.push(t);
  state.extra.push({ text, n: t.n });
  input.value = ''; input.oninput();
  refresh();
  $('convo').scrollTo({ top: $('convo').scrollHeight, behavior: 'smooth' });
};

/* ---------- phone task list ---------- */
function renderPhoneList() {
  const groups = [
    ['收件箱', tasks.filter(inInbox).sort((a, b) => inboxRank(a) - inboxRank(b)), t => reason(t)],
    ['进行中', tasks.filter(t => t.status === 'doing' && !inInbox(t)), t => t.runs?.[0]?.x ?? ''],
    ['待办', tasks.filter(t => t.status === 'todo'), () => ''],
    ['最近完成', tasks.filter(t => t.status === 'done').slice(0, 3), () => ''],
  ];
  $('p-list').innerHTML = groups.filter(([, l]) => l.length).map(([name, list, why]) => `
    <div class="p-sec">${name}</div>
    <div class="p-group">${list.map(t => `
      <div class="p-row">${statusIcon(t.status)}<div class="b"><div class="t trunc">${esc(t.title)}</div><div class="x"><span class="num" style="font-size:12px">#${t.n}</span>${why(t) ? `<span class="trunc ${t.live === 'waiting' ? 'warn' : t.live === 'failed' ? 'dang' : ''}">${esc(why(t))}</span>` : ''}</div></div>${t.live && t.live !== 'waiting' && t.live !== 'failed' ? liveDot(t.live) : ''}${mark(t.agent)}</div>`).join('')}</div>`).join('');
}

/* ---------- render ---------- */
function renderTasks() { renderInbox(); renderBoard(); renderList(); $('sb-desk').innerHTML = sidebar('board'); }
function refresh() {
  renderTasks();
  $('sb-new').innerHTML = sidebar('new');
  $('thread-desk').innerHTML = thread(false);
  $('thread-phone').innerHTML = thread(true);
  wireThread($('thread-desk')); wireThread($('thread-phone'));
  const pending = tasks.filter(inInbox).length;
  $('p-inbox').innerHTML = `${LIVE.waiting.dot}<span>${pending} 项待处理</span>${icon('chevron-right')}`;
  renderPhoneList();
  if (state.selected) { const panel = $('panel-host').querySelector('.panel'); if (panel) { panel.innerHTML = panelHTML(byN(state.selected)); wirePanel(panel, byN(state.selected)); } }
}

/* ---------- scenes ---------- */
let setSceneSeg;
function setScene(scene, fromView) {
  const desktop = scene === 'board' || scene === 'list';
  $('scene-desk').classList.toggle('on', desktop);
  $('scene-new').classList.toggle('on', scene === 'new');
  $('scene-phone').classList.toggle('on', scene === 'phone');
  setSceneSeg?.(scene, false);
  if (desktop && !fromView) { state.view = scene; setView(scene, true); applyView(); }
  requestAnimationFrame(() => { setView(state.view, true); setSceneSeg?.(scene, true); });
}
document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) setScene(g.dataset.go === 'board' ? state.view : g.dataset.go); });
setSceneSeg = segmented($('scene-seg'), 'board', v => setScene(v), 'scene');
const paintTheme = () => { const dark = document.documentElement.classList.contains('dark'); $('theme').innerHTML = icon(dark ? 'sun' : 'moon'); };
$('theme').onclick = () => { document.documentElement.classList.toggle('dark'); paintTheme(); };

hydrateIcons();
paintTheme(); paintFilter(); paintAgent();
refresh();
setScene('board');
// Deep links for screenshots: #board, #list, #new, #phone, optionally &task=141 and &dark
(() => {
  const h = new URLSearchParams(location.hash.slice(1).replace(/^(\w+)/, 'scene=$1'));
  if (h.has('dark')) { document.documentElement.classList.add('dark'); paintTheme(); }
  if (h.get('scene')) setScene(h.get('scene'));
  if (h.get('task')) openTask(+h.get('task'));
  if (h.has('dialog')) openDialog();
})();
</script>
</body>
</html>
