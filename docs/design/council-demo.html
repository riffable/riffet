<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Riffet · 多模型讨论</title>
<style>
:root {
  color-scheme: light;
  --bg: #ffffff; --bg-sidebar: #f7f8fa; --bg-subtle: #f5f6f8; --bg-muted: #eef0f3; --bg-elevated: #ffffff; --bg-popover: #ffffff;
  --bg-hover: rgb(35 45 70 / 0.055); --bg-active: rgb(35 45 70 / 0.09); --bg-bubble: #eef3fd;
  --fg: #1f2226; --fg-2: #50555d; --fg-3: #60666e; --fg-4: #adb2ba;
  --line: rgb(15 23 42 / 0.08); --line-strong: rgb(15 23 42 / 0.14);
  --primary: #15171a; --primary-hover: #34373d; --primary-fg: #ffffff;
  --accent: #3867f0; --accent-soft: rgb(56 103 240 / 0.09);
  --success: #1f9d55; --success-soft: rgb(31 157 85 / 0.1);
  --warning: #c77f06; --warning-soft: rgb(245 158 11 / 0.12);
  --danger: #e0454b; --danger-soft: rgb(224 69 75 / 0.09);
  --diff-add: #e6f4e7; --diff-del: #fce6e2;
  --agent-claude: #d97757; --agent-openai: #10a37f; --agent-deepseek: #4d6bfe; --agent-gemini: #8566c1;
  --shadow-soft: 0 1px 2px rgb(15 23 42 / 0.03), 0 3px 10px -4px rgb(15 23 42 / 0.05);
  --shadow-pop: 0 0 0 0.5px rgb(15 23 42 / 0.1), 0 8px 24px -8px rgb(15 23 42 / 0.14), 0 2px 5px -2px rgb(15 23 42 / 0.05);
  --shadow-composer: 0 0 0 0.5px rgb(24 24 26 / 0.08), 0 2px 4px rgb(24 24 26 / 0.03), 0 10px 28px -12px rgb(24 24 26 / 0.14);
  --scrim: rgb(0 0 0 / 0.25);
  --canvas: var(--bg-sidebar);
  --focus-ring: color-mix(in srgb, var(--accent) 50%, transparent);
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --fast: 150ms;
  --font-sans: "Inter Variable", "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace;
}
.dark {
  color-scheme: dark;
  --bg: #141416; --bg-sidebar: #1a1a1d; --bg-subtle: #1d1d20; --bg-muted: #27272b; --bg-elevated: #1f1f22; --bg-popover: #252528;
  --bg-hover: rgb(255 255 255 / 0.06); --bg-active: rgb(255 255 255 / 0.1); --bg-bubble: #23262e;
  --fg: #e2e4e8; --fg-2: #b6bac1; --fg-3: #9da2aa; --fg-4: #62666e;
  --line: rgb(255 255 255 / 0.075); --line-strong: rgb(255 255 255 / 0.13);
  --primary: #eceef1; --primary-hover: #d3d6db; --primary-fg: #141416;
  --accent: #5b8cff; --accent-soft: rgb(91 140 255 / 0.14);
  --success: #3fb96f; --success-soft: rgb(63 185 111 / 0.14);
  --warning: #e5a13a; --warning-soft: rgb(229 161 58 / 0.15);
  --danger: #f0676c; --danger-soft: rgb(240 103 108 / 0.14);
  --diff-add: #1f3124; --diff-del: #3c1f1b;
  --agent-claude: #e8916f; --agent-openai: #2fc79b; --agent-deepseek: #7590ff; --agent-gemini: #b497df;
  --shadow-soft: 0 1px 2px rgb(0 0 0 / 0.18);
  --shadow-pop: 0 0 0 0.5px rgb(255 255 255 / 0.09), 0 12px 32px -10px rgb(0 0 0 / 0.6);
  --shadow-composer: 0 0 0 0.5px rgb(255 255 255 / 0.08), 0 10px 28px -12px rgb(0 0 0 / 0.7);
  --scrim: rgb(0 0 0 / 0.5);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--canvas); color: var(--fg); font: 13px/20px var(--font-sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: default; text-align: inherit; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
.ui { user-select: none; -webkit-user-select: none; }
.selectable { user-select: text; -webkit-user-select: text; cursor: text; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
svg.i * { vector-effect: non-scaling-stroke; }
.mono { font-family: var(--font-mono); }
.tnum { font-variant-numeric: tabular-nums; }
.trunc { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow { flex: 1; min-width: 0; }
.t-title { font-size: 16px; line-height: 24px; font-weight: 500; }
.t-body { font-size: 14px; line-height: 23px; }
.t-prose { font-size: 14px; line-height: 26px; }
.t-ui { font-size: 13px; line-height: 20px; }
.t-sec { font-size: 12px; line-height: 16px; }
.t-foot { font-size: 11px; line-height: 16px; }
.fg-2 { color: var(--fg-2); } .fg-3 { color: var(--fg-3); } .fg-4 { color: var(--fg-4); }

/* Button */
.btn { display: inline-flex; flex: none; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; font-weight: 500;
  transition: color var(--fast) var(--ease), background-color var(--fast) var(--ease), scale var(--fast) var(--ease); }
.btn:active { scale: 0.97; }
.btn.xs { height: 24px; padding: 0 8px; border-radius: 6px; font-size: 12px; line-height: 16px; } .btn.xs svg.i { width: 14px; height: 14px; }
.btn.sm { height: 28px; padding: 0 10px; border-radius: 8px; } .btn.sm svg.i { width: 14px; height: 14px; }
.btn.md { height: 32px; padding: 0 12px; border-radius: 8px; }
.btn.icon-xs { width: 24px; height: 24px; border-radius: 6px; } .btn.icon-xs svg.i { width: 14px; height: 14px; }
.btn.icon-sm { width: 28px; height: 28px; border-radius: 8px; }
.btn.primary { background: var(--primary); color: var(--primary-fg); } .btn.primary:hover { background: var(--primary-hover); }
.btn.secondary { background: color-mix(in srgb, var(--fg) 7%, transparent); color: var(--fg); }
.btn.secondary:hover { background: color-mix(in srgb, var(--fg) 11%, transparent); }
.btn.ghost { color: var(--fg-2); } .btn.quiet { color: var(--fg-3); }
.btn.ghost:hover, .btn.quiet:hover { background: var(--bg-hover); color: var(--fg); }

/* Segmented */
.seg { position: relative; display: inline-flex; align-items: center; padding: 2px; border-radius: 10px; background: var(--bg-muted); box-shadow: inset 0 0 0 .5px var(--line); }
.seg .thumb { position: absolute; left: 0; top: 0; border-radius: 8px; background: var(--bg-elevated); box-shadow: 0 0 0 .5px var(--line-strong), var(--shadow-soft);
  transition: transform 200ms var(--ease), width 200ms var(--ease); }
.dark .seg .thumb { background: var(--bg-active); }
.seg button { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 8px; font-weight: 500; color: var(--fg-3); white-space: nowrap; }
.seg button:hover { color: var(--fg-2); }
.seg button[aria-checked="true"] { color: var(--fg); }
.seg.xs button { height: 24px; padding: 0 10px; font-size: 12px; }

/* Badge, StatusDot, Spinner, Check */
.badge { display: inline-flex; flex: none; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: 6px; background: var(--bg-muted); color: var(--fg-2); font-size: 11px; line-height: 16px; font-weight: 500; white-space: nowrap; }
.badge.success { background: var(--success-soft); color: var(--success); }
.badge.warning { background: var(--warning-soft); color: var(--warning); }
.badge.danger { background: var(--danger-soft); color: var(--danger); }
.sdot { display: inline-block; flex: none; width: 6px; height: 6px; border-radius: 50%; }
.sdot.ring { background: transparent; box-shadow: inset 0 0 0 1.5px var(--fg-3); }
.m-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.spinner { width: 12px; height: 12px; flex: none; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--accent) 25%, transparent); border-top-color: var(--accent); animation: spin .75s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse-hl { 0%,100% { box-shadow: inset 0 0 0 1.5px var(--accent); } 50% { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 30%, transparent); } }

.check { display: inline-grid; place-items: center; width: 16px; height: 16px; flex: none; border-radius: 4px; border: 1px solid var(--line-strong); background: var(--bg-elevated); color: var(--primary-fg); transition: background-color var(--fast), border-color var(--fast); }
.check svg.i { width: 12px; height: 12px; opacity: 0; }
.check[aria-checked="true"] { background: var(--primary); border-color: var(--primary); }
.check[aria-checked="true"] svg.i { opacity: 1; }

/* Demo bar */
.demo-bar { position: fixed; inset: 0 0 auto 0; height: 44px; z-index: 50; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 16px; background: var(--canvas); box-shadow: inset 0 -1px var(--line); }
.demo-bar .name { font-weight: 500; color: var(--fg-3); white-space: nowrap; }
.stage { position: absolute; inset: 44px 0 0 0; display: flex; }

/* Sidebar */
.sb { width: 248px; flex: none; display: flex; flex-direction: column; min-height: 0; }
.sb-top { height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px; }
.sb-top .brand { font-size: 14px; line-height: 22px; font-weight: 600; letter-spacing: -.01em; }
.brand-mark { width: 20px; height: 20px; flex: none; }
.sb-nav { display: flex; flex-direction: column; gap: 2px; padding: 0 8px 8px; }
.nav { display: flex; height: 32px; align-items: center; gap: 8px; padding: 0 10px; border-radius: 8px; color: var(--fg-2); }
.nav svg.i { width: 18px; height: 18px; color: var(--fg-3); }
.nav:hover { background: var(--bg-hover); color: var(--fg); }
.nav[aria-current="page"] { background: var(--bg-active); color: var(--fg); font-weight: 500; }
.nav[aria-current="page"] svg.i { color: var(--fg); }
.nav .end { margin-left: auto; font-size: 11px; color: var(--fg-4); font-variant-numeric: tabular-nums; }
.sb-list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 12px; }
.sb-sec { display: flex; align-items: center; height: 28px; margin-top: 12px; padding: 0 10px; font-size: 12px; font-weight: 500; color: var(--fg-4); }
.srow { display: flex; width: 100%; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: 8px; color: var(--fg-2); }
.srow:hover { background: var(--bg-hover); color: var(--fg); }
.srow.sel { background: var(--bg-active); color: var(--fg); font-weight: 500; }
.sb-foot { display: flex; align-items: center; height: 48px; flex: none; padding: 0 12px; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--bg-active); color: var(--fg); display: grid; place-items: center; font-size: 12px; font-weight: 500; }

/* Main card */
.main { position: relative; flex: 1; min-width: 0; margin: 8px 8px 8px 0; border-radius: 12px; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
.page-h { height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); }
.page-h h1 { margin: 0; font-size: 13px; line-height: 20px; font-weight: 500; }
.page-h .acts { margin-left: auto; display: flex; align-items: center; gap: 6px; }

/* Workspace */
.workspace { flex: 1; min-height: 0; display: flex; overflow: hidden; }
.stage-col { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.stage-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 32px 48px; scroll-behavior: smooth; }
.col-read { max-width: 840px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.col-wide { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

/* Launch page (ProjectHome style) */
.launch-wrap { max-width: 720px; margin: 56px auto 0; display: flex; flex-direction: column; gap: 16px; }
.launch-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.composer { border-radius: 16px; background: var(--bg-elevated); box-shadow: var(--shadow-composer); }
.composer textarea { display: block; width: 100%; min-height: 92px; max-height: 240px; padding: 14px 16px 8px; border: 0; background: none; resize: none; outline: none; font-size: 14px; line-height: 23px; }
.composer textarea::placeholder { color: var(--fg-4); }
.composer-setup { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-top: 1px solid var(--line); background: var(--bg-subtle); font-size: 12px; color: var(--fg-2); flex-wrap: wrap; }
.composer .bar { display: flex; align-items: center; gap: 6px; padding: 6px 10px 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.composer .send { margin-left: auto; width: 32px; height: 32px; }
.capsule { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 99px; color: var(--fg-3); font-size: 12px; line-height: 16px; transition: background-color var(--fast), color var(--fast); }
.capsule:hover { background: var(--bg-hover); color: var(--fg); }
.capsule[aria-pressed="true"] { background: var(--bg-active); color: var(--fg); font-weight: 500; }
.samples { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.sample-row { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; color: var(--fg-2); }
.sample-row:hover { background: var(--bg-hover); color: var(--fg); }

/* Stage Progress Rail */
.rail { display: flex; align-items: center; gap: 4px; padding-bottom: 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.rail-step { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 99px; font-size: 12px; color: var(--fg-3); transition: background-color var(--fast), color var(--fast); }
.rail-step:hover { background: var(--bg-hover); color: var(--fg); }
.rail-step.cur { background: var(--bg-active); color: var(--fg); font-weight: 500; }
.rail-step.done { color: var(--fg-2); }
.rail-sep { color: var(--fg-4); font-size: 12px; }

/* ===================== DEBATE: BILATERAL ARENA ===================== */
.matchup { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-radius: 12px; background: var(--bg-subtle); border: 1px solid var(--line); flex-wrap: wrap; }
.side-tag { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
.side-pill { font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 6px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--fg-2); }

.round-divider { display: flex; align-items: center; gap: 12px; margin: 8px 0 4px; }
.round-divider::before, .round-divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.round-label { font-size: 12px; color: var(--fg-3); font-weight: 500; white-space: nowrap; }

.chat-stream { display: flex; flex-direction: column; gap: 18px; }
.turn-msg { display: flex; flex-direction: column; gap: 6px; max-width: 78%; transition: opacity var(--fast); }
.turn-msg.pro { align-self: flex-start; align-items: flex-start; }
.turn-msg.con { align-self: flex-end; align-items: flex-end; }
.turn-msg.host { align-self: center; align-items: center; max-width: 82%; }
.turn-msg.pulse .bubble { animation: pulse-hl 1.2s ease-out 2; }

.turn-meta { display: flex; align-items: center; gap: 6px; padding: 0 4px; font-size: 12px; color: var(--fg-3); }
.turn-meta .name { font-weight: 500; color: var(--fg-2); }

.bubble { padding: 12px 16px; font-size: 14px; line-height: 24px; color: var(--fg); display: flex; flex-direction: column; gap: 10px; width: 100%; }
.turn-msg.pro .bubble { background: var(--bg-subtle); border-radius: 4px 16px 16px 16px; box-shadow: inset 0 0 0 1px var(--line); }
.turn-msg.con .bubble { background: var(--bg-bubble); border-radius: 16px 4px 16px 16px; }
.turn-msg.host .bubble { background: var(--bg); border-radius: 99px; padding: 7px 16px; box-shadow: inset 0 0 0 1px var(--line-strong); font-size: 13px; line-height: 20px; color: var(--fg-2); }

.bubble p { margin: 0; }
.bubble code { font-family: var(--font-mono); font-size: 0.86em; color: var(--fg-2); }

/* Reply quote & cross-exam attachment inside bubble */
.reply-quote { display: flex; flex-direction: column; gap: 3px; padding: 7px 10px; border-radius: 8px; background: color-mix(in srgb, var(--fg) 4%, transparent); border-left: 2px solid var(--line-strong); font-size: 12.5px; line-height: 19px; color: var(--fg-2); cursor: pointer; }
.reply-quote:hover { background: color-mix(in srgb, var(--fg) 7%, transparent); }
.reply-head { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--fg-3); }

.cross-q { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; border-radius: 8px; border-top: 1px dashed var(--line-strong); font-size: 13px; line-height: 20px; color: var(--fg-2); margin-top: 2px; }
.cross-q .qtag { flex: none; font-size: 11px; font-weight: 500; color: var(--fg-3); margin-top: 2px; }

.verdict-sheet { margin-top: 6px; padding: 18px 20px; border-radius: 12px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line-strong); display: flex; flex-direction: column; gap: 12px; }
.verdict-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.verdict-foot { display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }

/* ===================== PRISM: COLLISION & CONVERGENCE ===================== */
.sheet-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-radius: 12px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.sheet-col { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid var(--line); transition: opacity var(--fast) var(--ease), background-color var(--fast) var(--ease); }
.sheet-col:last-child { border-right: 0; }
.sheet-col.dim { opacity: 0.36; }
.sheet-col.lit { background: color-mix(in srgb, var(--bg-subtle) 55%, var(--bg)); }
.sheet-col-h { display: flex; align-items: center; gap: 8px; min-height: 24px; }
.sheet-col-stance { font-size: 12px; color: var(--fg-3); padding-bottom: 8px; border-bottom: 1px solid var(--line); }

.clash-list { display: flex; flex-direction: column; gap: 10px; }
.clash-item { border-radius: 12px; padding: 14px 16px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); display: flex; flex-direction: column; gap: 10px; transition: box-shadow var(--fast); }
.clash-item.lit { box-shadow: inset 0 0 0 1px var(--line-strong); background: color-mix(in srgb, var(--bg-subtle) 40%, var(--bg)); }
.clash-quotes { display: grid; grid-template-columns: 1fr 24px 1fr; gap: 8px; align-items: stretch; }
.clash-qbox { padding: 8px 10px; border-radius: 8px; background: var(--bg-subtle); font-size: 12.5px; line-height: 19px; color: var(--fg-2); display: flex; flex-direction: column; gap: 4px; }
.clash-vs { display: grid; place-items: center; color: var(--fg-4); font-size: 12px; }
.clash-ask { display: flex; align-items: flex-start; gap: 10px; padding-top: 8px; border-top: 1px solid var(--line); }

.shift-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--fg-3); padding: 3px 8px; border-radius: 6px; background: var(--bg-subtle); width: fit-content; }
.shift-tag .old { text-decoration: line-through; color: var(--fg-4); }

.prose-verdict { padding: 18px 0 6px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.prose-verdict p { margin: 0; font-size: 14px; line-height: 26px; }
.prose-verdict code { font-family: var(--font-mono); font-size: 0.86em; color: var(--fg-2); }

/* ===================== INSIGHT: SPEC REVIEW WORKBENCH ===================== */
.doc-sheet { border-radius: 12px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.doc-toolbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--bg-subtle); flex-wrap: wrap; }
.doc-goal { padding: 10px 16px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--fg-2); }
.doc-row { position: relative; border-bottom: 1px solid var(--line); transition: background-color var(--fast); }
.doc-row:last-child { border-bottom: 0; }
.doc-row-main { display: flex; align-items: flex-start; gap: 14px; padding: 14px 16px; cursor: pointer; }
.doc-row-main:hover { background: var(--bg-hover); }
.doc-row.lit .doc-row-main { background: var(--accent-soft); }
.doc-row.has-ann::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2.5px; border-radius: 2px; background: var(--line-strong); }
.doc-row.has-checked::before { background: var(--success); }
.doc-pno { font-family: var(--font-mono); font-size: 12px; line-height: 25px; color: var(--fg-4); width: 24px; flex: none; }
.doc-text { flex: 1; font-size: 14px; line-height: 25px; color: var(--fg); }
.doc-inline-ann { margin: 0 16px 14px 54px; padding: 10px 12px; border-radius: 10px; background: var(--bg-subtle); box-shadow: inset 0 0 0 1px var(--line); display: flex; flex-direction: column; gap: 8px; }
.inline-del { background: var(--diff-del); text-decoration: line-through; padding: 1px 4px; border-radius: 4px; }
.inline-add { background: var(--diff-add); padding: 1px 4px; border-radius: 4px; }

.rev-strip { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rev-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; background: var(--bg-subtle); box-shadow: inset 0 0 0 1px var(--line); font-size: 12px; color: var(--fg-2); }

/* Shared formatting */

.diff-add { background: var(--diff-add); padding: 4px 8px; border-radius: 6px; font-size: 12px; line-height: 18px; }

.embed { max-width: 840px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 14px; border-radius: 12px; background: var(--bg-subtle); box-shadow: inset 0 0 0 1px var(--line); }
.embed.wide { max-width: 1120px; }
.embed input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 13px; line-height: 20px; }
.embed input::placeholder { color: var(--fg-4); }
.send { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: var(--primary-fg); flex: none; }

.dialog { position: fixed; z-index: 70; left: 50%; top: 50%; width: min(448px, calc(100vw - 32px)); transform: translate(-50%, -50%); border-radius: 16px; background: var(--bg-elevated); box-shadow: var(--shadow-pop); overflow: hidden; }

.dx { position: absolute; top: 14px; right: 12px; }
.db { padding: 4px 20px 8px; display: flex; flex-direction: column; gap: 12px; }
.df { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 18px; }
.input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--bg-elevated); font-size: 13px; line-height: 20px; outline: none; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
.notice { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; background: var(--warning-soft); font-size: 12px; line-height: 16px; }
.notice svg.i { color: var(--warning); width: 14px; height: 14px; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 90; display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 12px; background: var(--bg-popover); box-shadow: var(--shadow-pop); font-size: 13px; }

function formatMdLite(text, highlightSnippet) {
  let html = esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  if (highlightSnippet) {
    const safe = esc(highlightSnippet).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    html = html.replace(new RegExp(safe, 'g'), `<span class="quote-hit">${esc(highlightSnippet)}</span>`);
  }
  return html.split('\n\n').map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
}

function clipStream(text, pct) {
  if (pct >= 100) return text;
  return text.slice(0, Math.max(12, Math.floor(text.length * pct / 100))) + '…';
}

function renderRail(s) {
  return `
    <div class="rail">
      ${s.phases.map((label, i) => {
        const cls = i === s.phaseIndex ? 'cur' : i < s.phaseIndex ? 'done' : '';
        const spin = i === s.phaseIndex && state.streaming ? '<span class="spinner"></span>' : '';
        return `
          ${i > 0 ? '<span class="rail-sep">›</span>' : ''}
          <button class="rail-step ${cls}" onclick="jumpPhase(${i})">${spin}<span>${esc(label)}</span></button>
        `;
      }).join('')}
    </div>
  `;
}

/* ===================== DEBATE VIEW ===================== */
function renderDebateStage(s) {
  const swapped = state.debateTrack === 'b';
  const pro = modelOf(swapped ? s.conModel : s.proModel);
  const con = modelOf(swapped ? s.proModel : s.conModel);
  const judge = modelOf(s.judgeModel);
  const pIdx = s.phaseIndex;

  const matchupHtml = `
    <div class="matchup">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="side-tag"><span class="side-pill">正方</span><span class="m-dot" style="background:${pro.color}"></span><span style="font-weight:500">${pro.name}</span></span>
        <span class="fg-4 t-sec">vs</span>
        <span class="side-tag"><span class="m-dot" style="background:${con.color}"></span><span style="font-weight:500">${con.name}</span><span class="side-pill">反方</span></span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        ${pIdx === 0 ? `<button class="btn xs secondary" onclick="swapDebateSides()">${ico('swap')}<span>互换</span></button><button class="btn xs primary" onclick="advancePhase(1)">开始辩论</button>` : ''}
        ${pIdx >= 3 ? `
          <div class="seg xs" role="radiogroup" aria-label="场次" id="track-seg">
            <span class="thumb" aria-hidden="true"></span>
            <button role="radio" aria-checked="${state.debateTrack === 'a'}" onclick="setDebateTrack('a')">首轮</button>
            <button role="radio" aria-checked="${state.debateTrack === 'b'}" onclick="setDebateTrack('b')">互换重赛</button>
          </div>
        ` : ''}
      </div>
    </div>
    <div class="t-body selectable" style="padding:0 4px">
      <span class="t-sec fg-3" style="margin-right:6px">命题</span>${esc(s.proposition)}
    </div>
  `;

  const rounds = swapped && s.rematchRounds ? s.rematchRounds : s.rounds;
  const streamHtml = [];
  rounds.forEach((r, idx) => {
    const rp = idx + 1;
    if (pIdx < rp) return;
    const pct = pIdx === rp && state.streaming ? state.streamProgress : 100;

    streamHtml.push(`<div class="round-divider" id="phase-${rp}"><span class="round-label">第 ${r.num} 轮 · ${esc(r.stage)}</span></div>`);

    r.order.forEach(side => {
      const isPro = side === 'pro';
      const m = isPro ? pro : con;
      const turn = r[side];
      const pulsed = state.pulseTurnId === turn.id ? 'pulse' : '';

      const meta = isPro
        ? `<div class="turn-meta"><span class="m-dot" style="background:${m.color}"></span><span class="name">${m.name}</span><span>正方</span>${pct < 100 ? '<span class="spinner"></span>' : ''}</div>`
        : `<div class="turn-meta">${pct < 100 ? '<span class="spinner"></span>' : ''}<span>反方</span><span class="name">${m.name}</span><span class="m-dot" style="background:${m.color}"></span></div>`;

      const replyBlock = turn.replyTo ? `
        <div class="reply-quote" onclick="focusTurn('${turn.replyTo.id}')">
          <div class="reply-head">
            ${ico('corner')}
            <span>${esc(turn.replyTo.label)}</span>
            <span class="badge success">${turn.replyTo.status === 'direct' ? '已正面回应' : '部分回应'}</span>
          </div>
          <div>${esc(turn.replyTo.quote)}</div>
        </div>
      ` : '';

      const questionBlock = turn.question ? `
        <div class="cross-q">
          <span class="qtag">追问${isPro ? '反方' : '正方'}</span>
          <span class="grow selectable">${esc(turn.question.text)}</span>
        </div>
      ` : '';

      streamHtml.push(`
        <div class="turn-msg ${isPro ? 'pro' : 'con'} ${pulsed}" id="turn-${turn.id}">
          ${meta}
          <div class="bubble selectable">
            ${replyBlock}
            ${formatMdLite(clipStream(turn.text, pct))}
            ${questionBlock}
          </div>
        </div>
      `);
    });
  });

  if (s.hostTurns?.length) {
    s.hostTurns.forEach(ht => {
      streamHtml.push(`<div class="turn-msg host"><div class="bubble selectable">主持人追问：${esc(ht.prompt)}</div></div>`);
      streamHtml.push(`
        <div class="turn-msg pro">
          <div class="turn-meta"><span class="m-dot" style="background:${pro.color}"></span><span class="name">${pro.name}</span><span>正方补充</span></div>
          <div class="bubble selectable">${formatMdLite(ht.proReply)}</div>
        </div>
        <div class="turn-msg con">
          <div class="turn-meta"><span>反方补充</span><span class="name">${con.name}</span><span class="m-dot" style="background:${con.color}"></span></div>
          <div class="bubble selectable">${formatMdLite(ht.conReply)}</div>
        </div>
      `);
    });
  }

  let verdictHtml = '';
  if (pIdx >= 3) {
    verdictHtml = `
      <div class="round-divider" id="phase-3"><span class="round-label">讨论总结</span></div>
      <section class="verdict-sheet">
        <div class="verdict-head">
          <span class="m-dot" style="background:${judge.color}"></span>
          <span class="t-ui" style="font-weight:500">${judge.name}</span>
          <span class="badge warning">${esc(s.verdict.winner)}</span>
        </div>
        <div class="t-prose selectable">${formatMdLite(s.verdict.takeaway)}</div>
        ${state.debateTrack === 'b' ? `
          <div class="t-sec fg-2 selectable" style="padding:8px 12px;border-radius:8px;background:var(--bg-subtle)">
            互换验证（${esc(s.verdict.rematch.proName)} 持正方 vs ${esc(s.verdict.rematch.conName)} 持反方）：${esc(s.verdict.rematch.note)}
          </div>
        ` : ''}
        <div class="verdict-foot">
          <button class="btn sm secondary" onclick="setDebateTrack(state.debateTrack === 'a' ? 'b' : 'a')">${ico('swap')}<span>${state.debateTrack === 'a' ? '查看互换立场重赛' : '切回首轮'}</span></button>
          <span class="grow"></span>
          <button class="btn sm secondary" onclick="openExportDialog('session')">带入会话</button>
          <button class="btn sm primary" onclick="openExportDialog('task')">转为任务</button>
        </div>
      </section>
    `;
  }

  return `<div class="col-read">${renderRail(s)}${matchupHtml}<div class="chat-stream">${streamHtml.join('')}</div>${verdictHtml}</div>`;
}

function renderPrismStage(s) {
  const pIdx = s.phaseIndex;
  const activeClash = s.probe.contradictions.find(c => c.id === (state.hoverClashId || state.litQuoteId));
  const involvedModels = activeClash ? new Set([activeClash.left.model, activeClash.right.model]) : null;

  const pct0 = pIdx === 0 && state.streaming ? state.streamProgress : 100;
  const exploreHtml = `
    <div id="phase-0">
      <div class="sheet-grid">
        ${s.participants.map(id => {
          const m = modelOf(id);
          const entry = s.explore[id];
          const isInvolved = involvedModels ? involvedModels.has(id) : false;
          const isDim = involvedModels && !isInvolved;
          const tOpen = state.openThoughts.has('exp:' + id);
          return `
            <article class="sheet-col ${isDim ? 'dim' : ''} ${isInvolved ? 'lit' : ''}" data-prism-col="${id}">
              <div class="sheet-col-h">
                <span class="m-dot" style="background:${m.color}"></span>
                <span class="t-ui trunc" style="font-weight:500">${m.name}</span>
                <span class="grow"></span>
                ${pct0 < 100 ? '<span class="spinner"></span>' : ''}
              </div>
              <div class="sheet-col-stance">${esc(entry.stance)}</div>
              <button class="thought-btn" aria-expanded="${tOpen}" onclick="toggleThought('exp:${id}')">
                ${ico('chevron-right')}<span>思考</span>
              </button>
              ${tOpen ? `<div class="thought">${esc(entry.thought)}</div>` : ''}
              <div class="t-body selectable">${formatMdLite(clipStream(entry.text, pct0), isInvolved ? entry.quoteSnippet : null)}</div>
            </article>
          `;
        }).join('')}
      </div>
    </div>
  `;

  let probeHtml = '';
  if (pIdx >= 1) {
    const obs = modelOf(s.observer);
    probeHtml = `
      <div id="phase-1" style="display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="t-ui" style="font-weight:500">分歧焦点</span>
          <span class="t-sec fg-3">${obs.name} 整理 · 悬停定位原文</span>
          <span class="grow"></span>
          ${pIdx === 1 ? `<button class="btn sm primary" onclick="advancePhase(2)">开始回应追问</button>` : ''}
        </div>
        <div class="clash-list">
          ${s.probe.contradictions.map(c => {
            const lm = modelOf(c.left.model);
            const rm = modelOf(c.right.model);
            const isLit = (state.hoverClashId || state.litQuoteId) === c.id;
            return `
              <div class="clash-item ${isLit ? 'lit' : ''}" data-clash="${c.id}" onmouseenter="hoverClash('${c.id}')" onmouseleave="hoverClash(null)">
                <div style="display:flex;align-items:center;gap:8px">
                  <button class="check" role="checkbox" aria-checked="${c.selected}" aria-label="保留追问" onclick="toggleProbeQuestion('${c.id}')">${ico('check')}</button>
                  <span class="t-ui" style="font-weight:500">${esc(c.title)}</span>
                </div>
                <div class="clash-quotes">
                  <div class="clash-qbox">
                    <div style="display:flex;align-items:center;gap:6px"><span class="m-dot" style="background:${lm.color}"></span><span class="t-sec fg-3">${lm.name}</span></div>
                    <div class="selectable">“${esc(c.left.quote)}”</div>
                  </div>
                  <div class="clash-vs">vs</div>
                  <div class="clash-qbox">
                    <div style="display:flex;align-items:center;gap:6px"><span class="m-dot" style="background:${rm.color}"></span><span class="t-sec fg-3">${rm.name}</span></div>
                    <div class="selectable">“${esc(c.right.quote)}”</div>
                  </div>
                </div>
                <div class="clash-ask">
                  <span class="badge warning">追问</span>
                  <span class="t-sec fg-2 grow selectable">${esc(c.question)}</span>
                </div>
              </div>
            `;
          }).join('')}
        </div>
        ${s.probe.gaps?.length ? `<div class="t-sec fg-3" style="padding:2px 4px">待补充：${s.probe.gaps.map(esc).join(' · ')}</div>` : ''}
      </div>
    `;
  }

  let deepenHtml = '';
  if (pIdx >= 2) {
    const pct2 = pIdx === 2 && state.streaming ? state.streamProgress : 100;
    deepenHtml = `
      <div id="phase-2" style="display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="t-ui" style="font-weight:500">回应追问</span>
          <span class="t-sec fg-3">立场变化</span>
        </div>
        <div class="sheet-grid">
          ${s.participants.map(id => {
            const m = modelOf(id);
            const d = s.deepen[id];
            return `
              <article class="sheet-col">
                <div class="sheet-col-h">
                  <span class="m-dot" style="background:${m.color}"></span>
                  <span class="t-ui trunc" style="font-weight:500">${m.name}</span>
                  <span class="grow"></span>
                  ${pct2 < 100 ? '<span class="spinner"></span>' : ''}
                </div>
                <div class="shift-tag">
                  ${d.shifted ? `<span class="old">${esc(d.oldStance)}</span><span>→</span><span style="color:var(--success);font-weight:500">${esc(d.newStance)}</span>` : `<span>${esc(d.newStance)}</span>`}
                </div>
                <div class="t-body selectable">${formatMdLite(clipStream(d.text, pct2))}</div>
              </article>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  let verdictHtml = '';
  if (pIdx >= 3) {
    const obs = modelOf(s.observer);
    verdictHtml = `
      <section class="prose-verdict" id="phase-3">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="badge success">一致结论</span>
          <span class="t-title">${esc(s.verdict.headline)}</span>
          <span class="grow"></span>
          <span class="t-sec fg-3"><span class="m-dot" style="background:${obs.color};vertical-align:middle;margin-right:4px"></span>${obs.name}</span>
        </div>
        <div class="selectable">${formatMdLite(s.verdict.analysis)}</div>
      </section>
    `;
  }

  return `<div class="col-wide">${renderRail(s)}${exploreHtml}${probeHtml}${deepenHtml}${verdictHtml}</div>`;
}

/* ===================== INSIGHT VIEW ===================== */
function renderInsightStage(s) {
  const pIdx = s.phaseIndex;
  const checkedIds = new Set(s.annotations.filter(a => a.checked).map(a => a.id));
  const byPara = pid => (pIdx >= 2 ? s.annotations.filter(a => a.para === pid) : []);

  const reviewerChips = pIdx >= 1 ? `
    <div class="rev-strip">
      ${s.participants.map(id => {
        const m = modelOf(id);
        const r = s.reviews[id];
        return `<span class="rev-chip">${pIdx === 1 && state.streaming ? '<span class="spinner"></span>' : `<span class="m-dot" style="background:${m.color}"></span>`}<span>${m.name}</span><span class="fg-3">· ${r.role}：${esc(r.summary)}</span></span>`;
      }).join('')}
      <span class="grow"></span>
      ${pIdx >= 2 ? `<span class="t-sec fg-3">已采纳 ${checkedIds.size} / ${s.annotations.length}</span>` : ''}
    </div>
  ` : '';

  const docHtml = `
    <section class="doc-sheet">
      <div class="doc-toolbar">
        <span class="mono t-sec fg-2">${esc(s.refs[0])}</span>
        <span class="grow"></span>
        ${pIdx >= 2 ? `
          <div class="seg xs" role="radiogroup" aria-label="文档视图" id="doc-seg">
            <span class="thumb" aria-hidden="true"></span>
            <button role="radio" aria-checked="${state.docMode === 'annotate'}" onclick="setDocMode('annotate')">原文批注</button>
            <button role="radio" aria-checked="${state.docMode === 'preview'}" onclick="setDocMode('preview')">修订预览 (${checkedIds.size})</button>
          </div>
        ` : pIdx === 0 ? `<button class="btn xs primary" onclick="advancePhase(1)">开始审阅</button>` : ''}
      </div>
      <div class="doc-goal selectable">目标：${esc(s.goal)}</div>
      <div>
        ${s.paragraphs.map(p => {
          const anns = byPara(p.id);
          const hasChecked = anns.some(a => a.checked);
          const isLit = pIdx >= 2 && state.litParaId === p.id;

          let bodyHtml = esc(p.text);
          if (pIdx >= 2 && state.docMode === 'preview') {
            anns.filter(a => a.checked).forEach(a => {
              if (bodyHtml.includes(esc(a.before))) {
                bodyHtml = bodyHtml.replace(esc(a.before), `<span class="inline-del">${esc(a.before)}</span> <span class="inline-add">${esc(a.after)}</span>`);
              } else {
                bodyHtml += ` <span class="inline-add">${esc(a.after)}</span>`;
              }
            });
          }

          const inlineAnns = pIdx >= 2 && state.docMode === 'annotate' && isLit && anns.length ? anns.map(a => `
            <div class="doc-inline-ann">
              <div style="display:flex;align-items:center;gap:8px">
                <button class="check" role="checkbox" aria-checked="${a.checked}" aria-label="采纳修改" onclick="toggleAnnotation('${a.id}')">${ico('check')}</button>
                <span class="badge ${a.task === 'correct' ? 'warning' : ''}">${a.taskLabel}</span>
                <span class="t-ui" style="font-weight:500">${esc(a.title)}</span>
                <span class="grow"></span>
                <span class="t-sec fg-3">${a.model}</span>
              </div>
              <div class="diff-del">- ${esc(a.before)}</div>
              <div class="diff-add">+ ${esc(a.after)}</div>
            </div>
          `).join('') : '';

          return `
            <div class="doc-row ${anns.length ? 'has-ann' : ''} ${hasChecked ? 'has-checked' : ''} ${isLit ? 'lit' : ''}" id="doc-${p.id}">
              <div class="doc-row-main" onclick="highlightPara('${p.id}')">
                <span class="doc-pno">${p.id}</span>
                <div class="doc-text selectable">${bodyHtml}</div>
                ${anns.length ? `<span class="badge ${hasChecked ? 'success' : ''}">${anns.length} 条建议</span>` : ''}
              </div>
              ${inlineAnns}
            </div>
          `;
        }).join('')}
      </div>
    </section>
  `;

  return `<div class="col-read">${renderRail(s)}${reviewerChips}${docHtml}</div>`;
}

/* ===================== RIGHT ASIDE ===================== */
function renderAside(s) {
  const aside = document.getElementById('ledger-aside');
  if (!s || !state.asideOpen) { aside.hidden = true; return; }
  aside.hidden = false;

  if (s.mode === 'debate') {
    const qList = [];
    s.rounds.forEach(r => {
      if (r.pro.question) qList.push({ side: '正方追问', ...r.pro.question, targetTurn: r.con.id });
      if (r.con.question) qList.push({ side: '反方追问', ...r.con.question, targetTurn: s.rounds[1]?.pro.id || r.pro.id });
    });
    const lastRound = s.rounds[Math.max(0, Math.min(s.phaseIndex - 1, s.rounds.length - 1))];
    aside.innerHTML = `
      <div class="aside-h"><span>交锋记录</span></div>
      <div class="aside-b">
        <div class="arow">
          <span class="t-sec fg-3">正方核心</span>
          <span class="t-ui">${esc(lastRound.ledger.pro.claim)}</span>
          ${lastRound.ledger.pro.weakness ? `<span class="t-sec" style="color:var(--warning)">待补：${esc(lastRound.ledger.pro.weakness)}</span>` : ''}
        </div>
        <div class="arow">
          <span class="t-sec fg-3">反方核心</span>
          <span class="t-ui">${esc(lastRound.ledger.con.claim)}</span>
          ${lastRound.ledger.con.weakness ? `<span class="t-sec" style="color:var(--warning)">待补：${esc(lastRound.ledger.con.weakness)}</span>` : ''}
        </div>
        <div class="t-sec fg-3" style="margin-top:4px;font-weight:500">质询定位</div>
        <div>
          ${qList.map(q => `
            <div class="arow clickable" onclick="focusTurn('${q.targetTurn}')">
              <div style="display:flex;align-items:center;gap:6px">
                <span class="t-sec fg-3">${q.side}</span>
                <span class="grow"></span>
                <span class="badge success">已正面回应</span>
              </div>
              <div class="t-ui">${esc(q.summary)}</div>
              <div class="t-sec fg-2">${esc(q.text)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  } else if (s.mode === 'prism') {
    aside.innerHTML = `
      <div class="aside-h"><span>各方立场</span></div>
      <div class="aside-b">
        ${s.participants.map(id => {
          const m = modelOf(id);
          const e = s.explore[id];
          const d = s.deepen[id];
          return `
            <div class="arow">
              <div style="display:flex;align-items:center;gap:6px">
                <span class="m-dot" style="background:${m.color}"></span>
                <span class="t-ui" style="font-weight:500">${m.name}</span>
              </div>
              <div class="t-sec fg-2">${esc(e.stance)} ${d && d.shifted ? `→ <b style="color:var(--success);font-weight:500">${esc(d.newStance)}</b>` : ''}</div>
            </div>
          `;
        }).join('')}
        <div class="t-sec fg-3" style="margin-top:4px;font-weight:500">分歧索引</div>
        <div>
          ${s.probe.contradictions.map(c => `
            <div class="arow clickable ${state.litQuoteId === c.id ? 'active' : ''}" onclick="highlightContradiction('${c.id}')">
              <div class="t-ui" style="font-weight:500">${esc(c.title)}</div>
              <div class="t-sec fg-2">${esc(c.question)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  } else {
    const filtered = s.annotations.filter(a => state.insightFilter === 'all' || a.task === state.insightFilter);
    aside.innerHTML = `
      <div class="aside-h"><span>修改建议 · ${s.annotations.length}</span></div>
      <div class="aside-b">
        <div class="seg xs" role="radiogroup" aria-label="筛选" id="insight-seg">
          <span class="thumb" aria-hidden="true"></span>
          ${[['all','全部'],['correct','修改'],['augment','补充'],['diagnose','问题'],['restructure','结构']].map(([k,l]) => `
            <button role="radio" data-filter="${k}" aria-checked="${state.insightFilter === k}" onclick="setInsightFilter('${k}')">${l}</button>
          `).join('')}
        </div>
        <div>
          ${filtered.map(a => `
            <div class="arow clickable ${state.litParaId === a.para ? 'active' : ''}" onclick="highlightPara('${a.para}')">
              <div style="display:flex;align-items:center;gap:6px">
                <button class="check" role="checkbox" aria-checked="${a.checked}" aria-label="选中" onclick="event.stopPropagation();toggleAnnotation('${a.id}')">${ico('check')}</button>
                <span class="badge ${a.task === 'correct' ? 'warning' : ''}">${a.taskLabel}</span>
                <span class="mono t-sec fg-3">${a.para}</span>
                <span class="grow"></span>
                <span class="t-sec fg-3">${a.model}</span>
              </div>
              <div class="t-ui" style="font-weight:500">${esc(a.title)}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
    positionThumb(document.getElementById('insight-seg'));
  }
}

function renderSteerDock(s) {
  const dock = document.getElementById('steer-dock');
  if (!s || s.mode === 'insight') { dock.hidden = true; return; }
  dock.hidden = false;
  const wide = s.mode === 'prism' ? 'wide' : '';
  dock.innerHTML = `
    <div class="embed ${wide}">
      <input id="steer-input" placeholder="${s.mode === 'debate' ? '作为主持人向双方追问或补充约束…' : '补充条件或追问…'}" onkeydown="if(event.key==='Enter')injectSupplement()" />
      <button class="send" aria-label="发送" onclick="injectSupplement()">${ico('arrow-up')}</button>
    </div>
  `;
}

function render() {
  const s = currentSession();
  renderSidebar();
  renderHeader();

  const inner = document.getElementById('stage-inner');
  if (!s) inner.innerHTML = renderLaunchPage();
  else if (s.mode === 'debate') inner.innerHTML = renderDebateStage(s);
  else if (s.mode === 'prism') inner.innerHTML = renderPrismStage(s);
  else inner.innerHTML = renderInsightStage(s);

  renderAside(s);
  renderSteerDock(s);

  document.querySelectorAll('#mode-seg button').forEach(b => {
    b.setAttribute('aria-checked', b.dataset.id === state.activeId ? 'true' : 'false');
  });
  positionThumb(document.getElementById('mode-seg'));
  positionThumb(document.getElementById('launch-seg'));
  positionThumb(document.getElementById('track-seg'));
  positionThumb(document.getElementById('doc-seg'));
}

/* ===================== ACTIONS ===================== */
window.selectSession = id => {
  clearInterval(startStreamSim._timer);
  state.activeId = id;
  state.litQuoteId = null;
  state.hoverClashId = null;
  state.pulseTurnId = null;
  state.streaming = false;
  state.streamProgress = 100;
  render();
};

window.jumpPhase = i => {
  const s = currentSession();
  if (!s) return;
  if (i > s.phaseIndex) { s.phaseIndex = i; render(); }
  document.getElementById('phase-' + i)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
};

window.advancePhase = idx => {
  const s = currentSession();
  if (!s) return;
  s.phaseIndex = idx;
  startStreamSim(true);
};

window.setDebateTrack = t => { state.debateTrack = t; render(); };

window.focusTurn = turnId => {
  state.pulseTurnId = turnId;
  render();
  document.getElementById('turn-' + turnId)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  setTimeout(() => { state.pulseTurnId = null; }, 2200);
};

window.hoverClash = id => {
  if (state.hoverClashId === id) return;
  state.hoverClashId = id;
  const s = currentSession();
  if (!s || s.mode !== 'prism') return;
  const activeId = state.hoverClashId || state.litQuoteId;
  const clash = s.probe.contradictions.find(c => c.id === activeId);
  const involved = clash ? new Set([clash.left.model, clash.right.model]) : null;
  document.querySelectorAll('[data-prism-col]').forEach(el => {
    const mid = el.getAttribute('data-prism-col');
    el.classList.toggle('dim', Boolean(involved && !involved.has(mid)));
    el.classList.toggle('lit', Boolean(involved && involved.has(mid)));
  });
  document.querySelectorAll('[data-clash]').forEach(el => {
    el.classList.toggle('lit', el.getAttribute('data-clash') === activeId);
  });
};

window.highlightContradiction = id => {
  state.litQuoteId = state.litQuoteId === id ? null : id;
  render();
  document.getElementById('phase-0')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
};

window.setDocMode = m => { state.docMode = m; render(); };

window.highlightPara = pid => {
  state.litParaId = state.litParaId === pid ? null : pid;
  render();
  document.getElementById('doc-' + pid)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
};

window.setInsightFilter = f => { state.insightFilter = f; render(); };

window.toggleAnnotation = id => {
  const item = currentSession()?.annotations?.find(a => a.id === id);
  if (item) item.checked = !item.checked;
  render();
};

window.toggleThought = key => {
  if (state.openThoughts.has(key)) state.openThoughts.delete(key);
  else state.openThoughts.add(key);
  render();
};

window.toggleProbeQuestion = id => {
  const q = currentSession()?.probe?.contradictions?.find(x => x.id === id);
  if (q) q.selected = !q.selected;
  render();
};

window.swapDebateSides = () => {
  const s = currentSession();
  if (!s || s.mode !== 'debate') return;
  [s.proModel, s.conModel] = [s.conModel, s.proModel];
  render();
  showToast('已互换正反方');
};

window.setLaunchMode = m => { state.launchMode = m; render(); };
window.toggleLaunchRhythm = () => { state.launchRhythm = state.launchRhythm === 'pause' ? 'auto' : 'pause'; render(); };
window.toggleLaunchModel = id => {
  if (state.launchModels.has(id)) { if (state.launchModels.size > 2) state.launchModels.delete(id); }
  else state.launchModels.add(id);
  render();
};
window.cycleDebateSide = side => {
  const ids = MODELS.map(m => m.id);
  const cur = side === 'pro' ? state.launchPro : state.launchCon;
  const other = side === 'pro' ? state.launchCon : state.launchPro;
  let next = ids[(ids.indexOf(cur) + 1) % ids.length];
  if (next === other) next = ids[(ids.indexOf(next) + 1) % ids.length];
  if (side === 'pro') state.launchPro = next; else state.launchCon = next;
  render();
};
window.swapLaunchSides = () => {
  [state.launchPro, state.launchCon] = [state.launchCon, state.launchPro];
  render();
};

window.startFromLaunch = () => {
  const title = (document.getElementById('launch-topic')?.value || '').trim() || '未命名讨论';
  const base = JSON.parse(JSON.stringify(SESSIONS.find(x => x.mode === state.launchMode) || SESSIONS[0]));
  base.id = 'custom-' + Date.now();
  base.title = title;
  if (base.mode === 'debate') {
    base.proposition = title;
    base.proModel = state.launchPro;
    base.conModel = state.launchCon;
  } else {
    base.participants = [...state.launchModels].slice(0, 3);
  }
  base.status = 'running';
  base.phaseIndex = base.mode === 'debate' ? 1 : 0;
  state.customSessions.unshift(base);
  state.activeId = base.id;
  startStreamSim(false);
  showToast('已开始讨论');
};

window.toggleAside = () => { state.asideOpen = !state.asideOpen; render(); };

window.injectSupplement = () => {
  const input = document.getElementById('steer-input');
  const val = (input?.value || '').trim();
  if (!val) { showToast('请输入追问内容'); return; }
  const s = currentSession();
  if (!s) return;
  if (s.mode === 'debate') {
    s.hostTurns = s.hostTurns || [];
    s.hostTurns.push({
      prompt: val,
      proReply: `针对「${val}」，正方补充：可通过独立的只读快照导出，把结论同步进既有会话检索，避免在核心投递表中维护两套生命周期。`,
      conReply: `针对「${val}」，反方回应：若只靠导出快照，讨论过程中的增量变化依然无法跨端同步，统一抽象层才是长期解法。`
    });
    render();
    const sc = document.getElementById('stage-scroll');
    sc.scrollTop = sc.scrollHeight;
  } else if (s.mode === 'prism') {
    s.probe.contradictions.push({
      id: 'u-' + Date.now(),
      title: '追加追问',
      left: { model: s.participants[0], quote: '已收到追加约束' },
      right: { model: s.participants[1], quote: val },
      question: val,
      selected: true
    });
    s.phaseIndex = 2;
    startStreamSim(true);
    showToast('已追问并重新收敛');
  }
  if (input) input.value = '';
};

function startStreamSim(singleStep = false) {
  clearInterval(startStreamSim._timer);
  const s = currentSession();
  if (!s) return;
  state.streaming = true;
  state.streamProgress = 18;
  render();
  startStreamSim._timer = setInterval(() => {
    state.streamProgress += 28;
    if (state.streamProgress >= 100) {
      if (singleStep || state.phaseIndex >= s.phases.length - 1) {
        state.streamProgress = 100;
        state.streaming = false;
        s.status = 'done';
        clearInterval(startStreamSim._timer);
      } else {
        s.phaseIndex += 1;
        state.streamProgress = 20;
      }
    }
    render();
  }, 240);
}

window.openExportDialog = kind => {
  const s = currentSession();
  if (!s) return;
  const host = document.getElementById('overlay-host');
  const titleMap = { task: '转为任务', session: '带入会话', review: '发回会话' };
  const actionMap = { task: '创建任务', session: '开始会话', review: '发送' };
  const defaultBody = s.mode === 'prism'
    ? `${s.verdict.headline}\n\n${s.verdict.analysis}`
    : s.mode === 'debate'
    ? s.verdict.takeaway
    : s.annotations.filter(a => a.checked).map((a, i) => `${i + 1}. [${a.para}] ${a.after}`).join('\n');

  host.innerHTML = `
    <div class="scrim" onclick="closeOverlay()"></div>
    <div class="dialog" role="dialog" aria-modal="true">
      <header class="dh">
        <span>${titleMap[kind]}</span>
        <button class="btn icon-sm quiet dx" aria-label="关闭" onclick="closeOverlay()">${ico('x')}</button>
      </header>
      <div class="db">
        <textarea class="input" rows="5">${esc(defaultBody)}</textarea>
        <select class="input">
          <option>Claude Code · claude-opus-4.8</option>
          <option>Codex · gpt-5.6-codex</option>
        </select>
      </div>
      <footer class="df">
        <button class="btn md ghost" onclick="closeOverlay()">取消</button>
        <button class="btn md primary" onclick="closeOverlay();showToast('${kind === 'task' ? '已创建任务' : '已打开会话'}')">${actionMap[kind]}</button>
      </footer>
    </div>
  `;
};

window.closeOverlay = () => { document.getElementById('overlay-host').innerHTML = ''; };
window.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(); });
window.addEventListener('resize', () => {
  positionThumb(document.getElementById('mode-seg'));
  positionThumb(document.getElementById('launch-seg'));
  positionThumb(document.getElementById('track-seg'));
  positionThumb(document.getElementById('doc-seg'));
  positionThumb(document.getElementById('insight-seg'));
});

document.getElementById('mode-seg').addEventListener('click', e => {
  const btn = e.target.closest('button[data-id]');
  if (btn) selectSession(btn.dataset.id);
});
document.getElementById('btn-replay').addEventListener('click', () => {
  const s = currentSession();
  if (!s) { selectSession('debate-monolith'); currentSession().phaseIndex = 1; startStreamSim(false); return; }
  s.phaseIndex = s.mode === 'debate' ? 1 : 0;
  startStreamSim(false);
});
document.getElementById('btn-theme').addEventListener('click', () => {
  state.dark = !state.dark;
  document.documentElement.classList.toggle('dark', state.dark);
  document.getElementById('btn-theme').innerHTML = ico(state.dark ? 'sun' : 'moon');
});

document.getElementById('btn-theme').innerHTML = ico('moon');
render();
</script>
</body>
</html>
