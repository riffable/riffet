name: CI (macOS)

# macOS runners cost ten times the Linux minutes, so these jobs run only when something the Mac
# build or the macOS environment resolution depends on changes, plus once a week to catch the rest.
on:
  push:
    branches: ['**']
    paths: &mac-paths
      - 'apps/macos/**'
      - 'apps/mobile/**'
      - '!apps/mobile/androidApp/**'
      - '!apps/mobile/iosApp/**'
      - 'apps/server/src/environment*.ts'
      - 'packages/plugin-api/src/kit/cli-resolve.ts'
      - 'scripts/environment-smoke.test.mjs'
      - 'scripts/gen-macos-icons.ts'
      - 'scripts/gen-icon-packs.ts'
      - 'scripts/svg-icon-path.ts'
      - 'scripts/icon-sources/**'
      - 'scripts/runtime-package.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.node-version'
      - '.github/workflows/ci-macos.yml'
      - '.github/workflows/verify.yml'
  pull_request:
    paths: *mac-paths
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      os: macos-latest

  macos-app:
    # The native macOS client (docs/MACOS.md): the shared Kotlin client on Kotlin/Native, then the
    # Swift app on top of it. Kotlin/Native silently skips Apple targets on other hosts, so this has
    # to run on macOS to mean anything.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      # The Debug build's "Bundle server payload" phase runs `pnpm build` in this checkout.
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Shared client on Kotlin/Native
        working-directory: apps/mobile
        run: ./gradlew :client:macosArm64Test --console=plain
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and test the app
        working-directory: apps/macos
        run: ./scripts/build.sh test
      - name: Acknowledgements cover the resolved Swift packages
        working-directory: apps/macos
        run: node scripts/check-acknowledgements.mjs Riffet.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
