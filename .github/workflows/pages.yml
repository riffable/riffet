name: Pages

on:
  push:
    branches: [main]
    # The plugin index is built from the registry records, the example packages and the built-in manifests,
    # packed and checked by the plugin tooling and the server's package reader.
    paths: ['site/**', 'examples/plugins/**', 'plugins/**', 'packages/plugin-api/**', 'apps/server/src/plugins-host/**', 'scripts/build-site.ts', '.github/workflows/pages.yml']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # The org's plan serves Pages from public repositories only; while this one is private the
    # job is skipped instead of failing on every push.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Release dates in the plugin index come from each package's last commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Site and plugin index
        run: pnpm build:site --out dist/site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v5
